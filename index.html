                teams: healedTeams,
                field: newField
            });

            if (appMode === 'local_room') {
                const activeNext = [nextMatch.pA, nextMatch.pB];
                const humans = activeNext.filter(p => !gameState.isBot[p]);
                if (humans.length > 0) setPlayerRole(humans[0]);
                else setPlayerRole(activeNext[0]);
                setCommandingIdx(0);
            }
            return;
        }

        let nextMatch = null;
        if (gameState.tournamentMatch === 'semi1') nextMatch = 'semi2';
        else if (gameState.tournamentMatch === 'semi2') nextMatch = 'bronze';
        else if (gameState.tournamentMatch === 'bronze') nextMatch = 'final';

        let newField = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [], p8: [] };
        let activeNext = [];
        const bracket = gameState.tournamentBracket || ['p1', 'p2', 'p3', 'p4'];
        
        if (nextMatch === 'semi2') activeNext = [bracket[2], bracket[3]];
        if (nextMatch === 'bronze') activeNext = [gameState.tournamentResults.semi1.loser, gameState.tournamentResults.semi2.loser];
        if (nextMatch === 'final') activeNext = [gameState.tournamentResults.semi1.winner, gameState.tournamentResults.semi2.winner];
        
        activeNext.forEach(p => {
            newField[p] = healedTeams[p].slice(0, gameState.settings.fieldSize).map((_, i) => i);
        });

        updateState({
            status: 'pre_battle', 
            tournamentMatch: nextMatch,
            teams: healedTeams,
            field: newField
        });

        if (appMode === 'local_room') {
            const humans = activeNext.filter(p => !gameState.isBot[p]);
            if (humans.length > 0) {
                setPlayerRole(humans[0]);
            } else {
                setPlayerRole(activeNext[0]);
            }
            setCommandingIdx(0);
        }
    };

    useEffect(() => {
        if (gameState.status === 'executing' && !isPlayingEvents && gameState.events.length > 0) {
            playEventsAnimation();
        }
    }, [gameState.status, gameState.events]);

    const playEventsAnimation = async () => {
        setIsPlayingEvents(true);
        // Usa lo stato d'inizio turno per cominciare l'animazione, creando VERA suspance!
        let currentDisplay = JSON.parse(JSON.stringify(gameState.startOfTurnTeams || gameState.teams));
        let currentDisplayField = JSON.parse(JSON.stringify(gameState.startOfTurnField || gameState.field));
        
        setDisplayTeams(currentDisplay);
        setDisplayField(currentDisplayField);

        for (let evt of gameState.events) {
            if (evt.text) setEventPlaybackText(evt.text);
            if (evt.type === 'summon') {
               currentDisplay[evt.player].push(evt.newChar);
               currentDisplayField[evt.player].push(evt.fieldIdx);
               setDisplayTeams({ ...currentDisplay });
               setDisplayField({ ...currentDisplayField });
            } else if (evt.type === 'damage') {
              if (currentDisplay[evt.targetPlayer] && currentDisplay[evt.targetPlayer][evt.targetIdx]) {
                  currentDisplay[evt.targetPlayer][evt.targetIdx].hp = evt.newHp;
                  setDisplayTeams({ ...currentDisplay });
              }
            } else if (evt.type === 'switch') {
               currentDisplayField[evt.player][evt.pos] = evt.newIdx;
               setDisplayField({ ...currentDisplayField });
            } else if (evt.type === 'remove') {
               currentDisplayField[evt.player].splice(evt.pos, 1);
               setDisplayField({ ...currentDisplayField });
            } else if (evt.type === 'status_update') {
               if (currentDisplay[evt.targetPlayer] && currentDisplay[evt.targetPlayer][evt.targetIdx]) {
                   currentDisplay[evt.targetPlayer][evt.targetIdx].statuses = evt.statuses;
                   setDisplayTeams({ ...currentDisplay });
               }
            }
            await new Promise(r => setTimeout(r, 1600)); 
        }

        setEventPlaybackText('Turno concluso.');
        await new Promise(r => setTimeout(r, 1000));
        setIsPlayingEvents(false);
        
        // FIX 3: Solo l'Host o il gioco in locale aggiornano lo stato per il turno successivo
        if (appMode === 'local_room' || playerRole === 'p1') {
            if (gameState.postExecStatus === 'gameover') {
                 updateState({ status: 'gameover', events: [] });
            } else if (gameState.postExecStatus === 'intermission') {
                 updateState({ status: 'intermission', events: [] });
            } else if (gameState.postExecStatus === 'switching_phase') {
                 if (appMode === 'local_room') {
                     const active = getActivePlayers().filter(p => !gameState.isBot[p] && gameState.pendingSwitches[p] > 0);
                     if (active.length > 0) setPlayerRole(active[0]);
                 }
                 updateState({ status: 'switching_phase', events: [] });
            } else {
                if (appMode === 'local_room') {
                const active = getActivePlayers().filter(p => !gameState.isBot[p]);
                if (active.length > 0) {
                    setPlayerRole(active[0]);
                    setCommandingIdx(0);
                    setActionMenuMode('moves');
                } else {
                    setCommandingIdx(-1);
                }
            } else {
                if (!gameState.isBot[playerRole]) {
                    setCommandingIdx(0);
                    setActionMenuMode('moves');
                } else {
                    setCommandingIdx(-1);
                }
            }
            updateState({ status: 'battling', events: [] });
            }
        } else {
            // I client ospiti si limitano a ripristinare la UI
            setCommandingIdx(0);
            setActionMenuMode('moves');
        }
    };

    // --- EFFECT PER LA FASE DI SOSTITUZIONE ---
    useEffect(() => {
        if (gameState.status === 'switching_phase' && (appMode === 'local_room' || playerRole === 'p1')) {
            let allReady = true;
            const active = getActivePlayers();
            
            let updatedActions = { ...gameState.switchActions };
            let changed = false;

            active.forEach(p => {
                const needed = gameState.pendingSwitches[p] || 0;
                const picked = updatedActions[p]?.length || 0;
                
                if (gameState.isBot[p] && needed > picked) {
                    const aliveBench = gameState.teams[p].map((c, i) => ({c, i})).filter(o => o.c.hp > 0 && !gameState.field[p].includes(o.i) && !o.c.isSummonOnly && !updatedActions[p].includes(o.i));
                    
                    for (let i = picked; i < needed && i < picked + aliveBench.length; i++) {
                        updatedActions[p].push(aliveBench[i - picked].i);
                        changed = true;
                    }
                }
                
                if ((updatedActions[p]?.length || 0) < needed) {
                    allReady = false;
                }
            });

            if (changed) {
                updateState({ switchActions: updatedActions });
                return; 
            }

            if (allReady) {
                let newField = JSON.parse(JSON.stringify(gameState.field));
                let newEvents = [];
                active.forEach(p => {
                    if (gameState.switchActions[p] && gameState.switchActions[p].length > 0) {
                        gameState.switchActions[p].forEach(idx => {
                            newField[p].push(idx);
                        });
                    }
                });
                
                updateState({ 
                    status: 'battling', 
                    field: newField, 
                    pendingSwitches: { p1: 0, p2: 0, p3: 0, p4: 0 },
                    switchActions: { p1: [], p2: [], p3: [], p4: [] }
                }).then(() => {
                    if (appMode === 'local_room') {
                        const humans = active.filter(p => !gameState.isBot[p]);
                        if (humans.length > 0) {
                            setPlayerRole(humans[0]);
                            setCommandingIdx(0);
                            setActionMenuMode('moves');
                        } else {
                            setCommandingIdx(-1);
                        }
                    } else {
                        if (!gameState.isBot[playerRole]) {
                            setCommandingIdx(0);
                            setActionMenuMode('moves');
                        } else {
                            setCommandingIdx(-1);
                        }
                    }
                });
            }
        }
    }, [gameState.status, gameState.switchActions, gameState.pendingSwitches, gameState.field, gameState.teams, appMode, playerRole]);

    // --- RENDERERS ---

    const renderView = () => {
        if (appMode === 'menu') {
            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-4 relative overflow-hidden">
                <h1 className="text-6xl md:text-7xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 flex items-center gap-4 z-10 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] text-center leading-tight">
                    <Swords size={64} className="text-cyan-400 drop-shadow-lg hidden md:block" />
                    Multiverse RPG
                    <Swords size={64} className="text-purple-500 drop-shadow-lg hidden md:block" />
                </h1>
                <p className="text-slate-400 mb-12 text-center text-lg z-10 max-w-lg font-medium">Scegli i tuoi campioni. Domina il multiverso in tattiche battaglie a turni in diverse modalità!</p>
                
                <div className="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl w-full max-w-md border border-slate-700/50 shadow-[0_0_50px_rgba(0,0,0,0.5)] space-y-5 z-10">
                    <div>
                        <label className="block text-xs uppercase tracking-widest font-bold text-slate-400 mb-2">Tuo Nome</label>
                        <input type="text" value={playerName} onChange={e => setPlayerName(e.target.value)} className="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all" placeholder="Inserisci il tuo nome..." />
                    </div>

                    <div>
                        <label className="block text-xs uppercase tracking-widest font-bold text-slate-400 mb-2 flex items-center gap-2"><ImageIcon size={14}/> URL Avatar (Opzionale)</label>
                        <input type="text" value={playerAvatarUrl} onChange={e => setPlayerAvatarUrl(e.target.value)} className="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition-all text-sm" placeholder="Es: https://.../img.jpg" />
                    </div>

                    <div className="pt-4 border-t border-slate-800 space-y-4">
                        <button onClick={handleCreateRoom} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:-translate-y-0.5">
                             <Wifi size={20}/> Crea Stanza Online (Host)
                        </button>
                        <div className="flex gap-2">
                            <input type="text" value={roomIdInput} onChange={e => setRoomIdInput(e.target.value)} placeholder="Codice Stanza" className="w-1/2 bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-2 text-white text-center font-mono uppercase focus:border-purple-500 outline-none transition-all" />
                            <button onClick={handleJoinRoom} className="w-1/2 bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 text-white font-bold py-2 rounded-xl transition-all shadow-lg hover:-translate-y-0.5">
                                Unisciti
                            </button>
                        </div>
                    </div>

                    <div className="pt-4 border-t border-slate-800">
                         <button onClick={() => {
                             const saved = localStorage.getItem('multiverse_rpg_campaign_save');
                             if (saved) {
                                 setCampaignState(JSON.parse(saved));
                                 setAppMode('campaign_map');
                             } else {
                                 const finn = CHARACTERS.find(c=>c.id==='finn');
                                 const topo = CHARACTERS.find(c=>c.id==='topolino');
                                 setCampaignState({
                                     sectorIdx: 0,
                                     missionIdx: 0,
                                     roster: ['finn', 'topolino'],
                                     rosterStats: { 'finn': finn ? finn.maxHp : 100, 'topolino': topo ? topo.maxHp : 100 },
                                     coins: 50,
                                     difficulty: 'Normal'
                                 });
                                 setAppMode('campaign_intro');
                             }
                         }} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:-translate-y-0.5 mb-3">
                             <BookOpen size={20}/> Campagna: Crisi del Varco
                         </button>
                         <button onClick={handleVsCpuStart} className="w-full mb-3 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:-translate-y-0.5">
                             <Target size={20}/> Gioca vs CPU (Bot IA)
                        </button>
                         <button onClick={handleLocalStart} className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5">
                             <Users size={20}/> Gioca in Locale (Stesso PC)
                        </button>
                        <div className="grid grid-cols-2 gap-3 mt-4">
                            <button onClick={() => setAppMode('catalog')} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <BookOpen size={20}/> Catalogo
                            </button>
                            <button onClick={() => setAppMode('type_chart')} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <GridIcon size={20}/> Tabella Tipi
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mt-3">
                            <button onClick={() => { if(!playerName.trim()) setSystemAlert("Inserisci il tuo nome per usare lo Shop!"); else setAppMode('shop'); }} className="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <ShoppingCart size={20}/> Negozio
                            </button>
                            <button onClick={() => { if(!playerName.trim()) setSystemAlert("Inserisci il tuo nome per vedere le tue statistiche!"); else setAppMode('stats'); }} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <BarChart size={20}/> Statistiche
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }
    
    if (appMode === 'campaign_intro') {
        return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-6 relative overflow-hidden">
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-900/40 via-slate-950 to-black pointer-events-none opacity-60"></div>
                 <div className="bg-slate-900/80 p-8 rounded-3xl max-w-2xl text-center border border-emerald-500/30 z-10 shadow-2xl">
                      <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-4">La Crisi del Varco Corrotto</h1>
                      <h2 className="text-xl text-emerald-400 font-bold mb-6">Prologo: L'Eclissi di Cell</h2>
                      <p className="text-slate-300 mb-4 text-left leading-relaxed">
                          Un'entità proveniente da un futuro distorto, Cell Perfetto (Corrotto), ha utilizzato una tecnologia rubata per fondere le dimensioni.
                      </p>
                      <p className="text-slate-300 mb-8 text-left leading-relaxed">
                          Ha emesso una "Frequenza di Sottomissione" che ha lavato il cervello al 90% degli eroi, trasformandoli nei suoi Burattini Perfetti. Solo Finn l'Umano e Topolino sono sfuggiti. Ora devono formare la Resistenza Finale!
                      </p>
                      
                      <div className="flex justify-center gap-4 mb-8">
                          <button onClick={() => setCampaignState(p => ({...p, difficulty: 'Normal'}))} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${campaignState.difficulty === 'Normal' ? 'border-blue-500 bg-blue-500/20 text-blue-400' : 'border-slate-700 text-slate-500'}`}>Normale</button>
                          <button onClick={() => setCampaignState(p => ({...p, difficulty: 'Insane'}))} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${campaignState.difficulty === 'Insane' ? 'border-rose-500 bg-rose-500/20 text-rose-400' : 'border-slate-700 text-slate-500'}`}>Multiverso Folle</button>
                      </div>
                      
                      <button onClick={() => setAppMode('campaign_map')} className="bg-gradient-to-r from-emerald-500 to-teal-600 px-10 py-4 rounded-full font-black text-xl hover:scale-105 transition-transform">Inizia Avventura</button>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_map') {
        const sector = CAMPAIGN_DATA.sectors[campaignState.sectorIdx];
        const mission = sector.missions[campaignState.missionIdx];
        
        return (
            <div className={`min-h-screen flex flex-col p-6 text-white ${sector.bg} relative overflow-hidden`}>
                <button onClick={() => setAppMode('menu')} className="absolute top-6 left-6 flex items-center gap-2 text-slate-300 hover:text-white transition-colors bg-black/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/20 z-20">
                     <ArrowLeft size={20} /> Abbandona Campagna
                </button>
                <button onClick={() => { localStorage.removeItem('multiverse_rpg_campaign_save'); setAppMode('menu'); }} className="absolute top-6 right-6 flex items-center gap-2 text-rose-400 hover:text-white transition-colors bg-black/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-rose-500/50 z-20 text-sm font-bold shadow-lg">
                     Resetta Progressi
                </button>
                <div className="flex justify-center items-center bg-black/50 p-4 rounded-2xl mb-8 backdrop-blur-md border border-white/10 mt-14 max-w-4xl mx-auto w-full">
                    <div className="flex-1 text-center">
                        <h2 className="text-3xl font-black text-emerald-400">{sector.name}</h2>
                        <p className="text-slate-300 text-sm">{sector.description}</p>
                    </div>
                    <div className="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-xl border border-yellow-500/50 absolute right-8">
                        <Coins className="text-yellow-400" size={24} />
                        <span className="font-bold text-yellow-400 text-xl">{campaignState.coins}</span>
                    </div>
                </div>
                
                <div className="flex-1 flex flex-col md:flex-row gap-8 max-w-6xl w-full mx-auto">
                    <div className="flex-1 bg-black/40 rounded-3xl p-8 border border-white/10 flex flex-col justify-center items-center text-center">
                        <h3 className="text-sm text-slate-400 font-bold uppercase tracking-widest mb-2">Prossima Missione</h3>
                        <h1 className="text-5xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">{mission.title}</h1>
                        <div className="flex items-center justify-center gap-4 mb-8 bg-black/30 p-4 rounded-2xl w-full">
                            <span className="text-slate-400 font-bold uppercase tracking-widest text-sm mr-4">Boss:</span>
                            {mission.boss.map(bId => {
                                const b = CHARACTERS.find(c=>c.id===bId);
                                return b ? <img key={bId} src={b.img} className="w-16 h-16 rounded-full border-2 border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.5)] object-cover" title={b.name} alt={b.name} /> : null;
                            })}
                        </div>
                        <button onClick={() => { setCampaignDialogueIdx(0); setAppMode('campaign_dialogue'); }} className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl font-bold text-xl flex items-center gap-2 shadow-lg hover:-translate-y-1 transition-all">Avvia Missione <ArrowLeft className="rotate-180"/></button>
                    </div>
                    
                    <div className="w-full md:w-1/3 bg-black/40 rounded-3xl p-6 border border-white/10 flex flex-col">
                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-400"><Users size={20}/> La Tua Resistenza</h3>
                        <div className="space-y-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2 flex-1">
                            {campaignState.roster.map(id => {
                                const char = CHARACTERS.find(c=>c.id===id);
                                const hp = campaignState.rosterStats[id];
                                if(!char) return null;
                                return (
                                    <div key={id} className={`bg-slate-900/80 p-3 rounded-xl border ${hp <= 0 ? 'border-rose-900 grayscale opacity-75' : 'border-slate-700/50'} flex items-center gap-3`}>
                                        <img src={char.img} className="w-12 h-12 rounded-full border border-slate-600 object-cover" />
                                        <div className="flex-1">
                                            <div className="font-bold text-sm truncate">{char.name} {hp <= 0 && <span className="text-rose-500 text-[10px] ml-1">(Esausto)</span>}</div>
                                            {renderHealthBar(hp, char.maxHp)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_dialogue') {
        const sector = CAMPAIGN_DATA.sectors[campaignState.sectorIdx];
        const mission = sector.missions[campaignState.missionIdx];
        
        // --- LOGICA LORE DINAMICO ---
        let fullDialogue = [...mission.dialogue];
        
        const aliveHeroes = campaignState.roster.filter(id => campaignState.rosterStats[id] > 0);
        const bossIds = mission.boss;

        // Se siamo all'inizio della conversazione, verifichiamo se ci sono legami speciali
        if (campaignDialogueIdx === 0 && !fullDialogue.some(d => d.isDynamicLore)) {
            const lorePool = [
                { h: 'finn', b: 'jake', t: "Jake! Ricordati di noi! Di BMO, della Casa sull'Albero! Non lasciare che quel testone verde ti porti via!" },
                { h: 'marceline', b: 'jake', t: "Ehi cagnolone, svegliati o ti prosciugo tutto il sangue! Sto scherzando... forse." },
                { h: 'finn', b: 'marceline', t: "Marceline, ti prego! Non sei tu! Rompi il controllo, ricordati di Ooo e delle nostre canzoni!" },
                { h: 'spongebob', b: 'patrick', t: "Patrick, migliore amico mio! Non farti controllare! Ricordati di quando cacciavamo le meduse!" },
                { h: 'patrick', b: 'spongebob', t: "Spongebob! Ti salverò io! Anzi, ti prenderò a testate finché non torni normale!" },
                { h: 'ladybug', b: 'chatnoir', t: "Chat, gattino sciocco, resisti! Il tuo Miraculous è più forte di questo trucco mentale!" },
                { h: 'chatnoir', b: 'renarouge', t: "Rena, smettila con queste illusioni! Siamo una squadra, svegliati!" },
                { h: 'cyborg', b: 'corvina', t: "Corvina! Usa il tuo mantra! Azzarath Metrion... dai, blocca la sua frequenza!" },
                { h: 'robin', b: 'cyborg', t: "Cyborg, riavvia i sistemi! Scavalca il firewall di Cell, ora!" },
                { h: 'goku', b: 'cell', t: "Ancora tu, Cell?! Questa volta non avrai bisogno di esplodere per perdere contro di noi!" },
                { h: 'kratos', b: 'goku', t: "Un guerriero che si fa dominare la mente è debole. Ti libererò io a suon di pugni." },
                { h: 'stewie', b: 'plankton', t: "Un microbo con un occhio solo? Amico, i miei laser sono perfetti per disinfestare l'arena." },
                { h: 'finn', b: 'reghiaccio', t: "Simon! Smettila di fare il cattivo o ti prendo a calci il sedere ghiacciato un'altra volta!" },
                { h: 'astral', b: 'utopia', t: "Numero 39: Utopia... la mia carta più fedele. Ti libererò da questa oscurità con la luce della speranza!" },
                { h: 'goku', b: 'snorlax', t: "Ehi bestione! Se ti liberi da quell'insetto ti offro io la cena, promesso!" },
                { h: 'poisonivy', b: 'roserade', t: "La tua tossina è potente, piccola Roserade. Smettila di servire lui e combatti per il Verde!" },
                { h: 'luigi', b: 'mario', t: "M-Mario! Fratellone! Svegliati, mi fai troppa paura quando hai quegli occhi viola!" },
                { h: 'bowser', b: 'mario', t: "Bwahahah! Mario, farti comandare a bacchetta da un insetto gigante è patetico! Ti schiaccio io prima che lo faccia lui!" },
                { h: 'bowser', b: 'luigi', t: "Lo spilungone verde! Fatti da parte, non ho tempo da perdere con un fifone come te!" },
                { h: 'zuko', b: 'katara', t: "Katara, reagisci! Non puoi piegarti a questo Cell! Abbiamo ancora una pace da costruire!" },
                { h: 'zuko', b: 'aang', t: "Aang, tu sei l'Avatar! Sei tu che devi portare l'equilibrio, non la sottomissione!" },
                { h: 'katara', b: 'aang', t: "Aang, ti prego! Guarda i miei occhi, ricordati di noi! Rompi questa frequenza oscura!" },
                { h: 'bowser', b: 'spyro', t: "Un draghetto lilla? Bwahaha! Ti faccio vedere io come sputa fuoco un VERO drago!" },
                { h: 'aang', b: 'zabuza', t: "Usare il dominio dell'acqua per creare una nebbia assassina?! Io ti fermerò!" },
                { h: 'natsu', b: 'juvia', t: "Juvia! Smettila di fare fiumi di lacrime e datti una mossa, dobbiamo rompere questo incantesimo!" },
                { h: 'kratos', b: 'nito', t: "Un altro signore dei morti che brama anime. Le mie lame conoscono bene il tuo tipo." },
                { h: 'carlos', b: 'hannibal', t: "Hai l'aria del mostro psicopatico... Ho affrontato gli zombie, non ho paura di te!" },
                { h: 'corvina', b: 'trigon', t: "Padre... pensavi di potermi manipolare di nuovo nascondendoti dietro quel burattino di Cell? Questa volta la tua fine sarà definitiva!" }
            ];

            let injected = false;
            lorePool.forEach(lore => {
                if (!injected && aliveHeroes.includes(lore.h) && bossIds.includes(lore.b)) {
                    const heroName = CHARACTERS.find(c => c.id === lore.h).name;
                    // Inserisci la battuta di legame speciale subito dopo la prima battuta del boss (indice 1)
                    fullDialogue.splice(1, 0, { s: heroName, t: lore.t, isDynamicLore: true });
                    injected = true;
                }
            });
        }

        const dialogue = fullDialogue[campaignDialogueIdx];
        
        const speakerName = dialogue.s.replace(' (Corrotto)', '').replace(' (Corrotta)', '');
        const speakerChar = CHARACTERS.find(c => c.name === speakerName || c.name.includes(speakerName));
        const isCorrupted = dialogue.s.includes('Corrott');
        
        const nextDialogue = () => {
            if (campaignDialogueIdx < fullDialogue.length - 1) {
                setCampaignDialogueIdx(p => p + 1);
            } else {
                setCampaignSelectedTeam([...campaignState.roster.filter(id => campaignState.rosterStats[id] > 0).slice(0, 4)]);
                setAppMode('campaign_team_select');
            }
        };
        
        return (
            <div className={`min-h-screen flex flex-col justify-end p-8 ${sector.bg} relative overflow-hidden`} onClick={nextDialogue}>
                 {speakerChar && (
                     <div className={`absolute bottom-0 left-4 md:left-24 transition-all duration-500 pointer-events-none ${isCorrupted ? 'scale-105 drop-shadow-[0_0_30px_rgba(220,38,38,0.6)] filter sepia-[0.5] hue-rotate-[-30deg]' : 'drop-shadow-2xl'}`}>
                         <img src={speakerChar.img} className="w-48 h-48 md:w-80 md:h-80 object-cover rounded-t-full border-t-4 border-x-4 border-slate-800 opacity-90" />
                     </div>
                 )}
                 <div className={`bg-slate-900/90 border-2 ${dialogue.isDynamicLore ? 'border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.3)]' : 'border-emerald-500 shadow-2xl'} p-8 rounded-2xl max-w-4xl w-full mx-auto z-10 cursor-pointer relative mb-12`}>
                      <div className={`absolute -top-4 left-6 px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest shadow-md ${dialogue.isDynamicLore ? 'bg-yellow-500 text-black' : isCorrupted ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                          {dialogue.s} {dialogue.isDynamicLore && "⭐"}
                      </div>
                      <p className={`text-xl md:text-2xl mt-4 leading-relaxed font-medium ${dialogue.isDynamicLore ? 'text-yellow-100 italic' : 'text-white'}`}>"{dialogue.t}"</p>
                      <p className="text-right text-xs text-slate-500 mt-4 animate-pulse font-bold">Clicca per continuare...</p>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_post_dialogue') {
        const sector = CAMPAIGN_DATA.sectors[campaignState.sectorIdx];
        const mission = sector.missions[campaignState.missionIdx];
        
        // COSTRUZIONE DINAMICA DEL DIALOGO (INCLUSA LA PREOCCUPAZIONE PER GLI ESAUSTI)
        let fullDialogue = [...(mission.postDialogue || [])];
        
        if (campaignState.faintedInLastBattle && campaignState.faintedInLastBattle.length > 0) {
            const faintedName = campaignState.faintedInLastBattle[0]; 
            
            // Trova un personaggio ancora in piedi per dire la battuta
            const aliveCharacters = campaignState.roster.filter(id => campaignState.rosterStats[id] > 0);
            let speakerId = aliveCharacters.length > 0 ? aliveCharacters[Math.floor(Math.random() * aliveCharacters.length)] : 'finn';
            const speakerNameObj = CHARACTERS.find(c => c.id === speakerId);
            const speakerName = speakerNameObj ? speakerNameObj.name : "Finn l'Umano";

            // Se il personaggio scelto per parlare è se stesso (bug), forza Finn o Topolino
            const finalSpeaker = speakerName === faintedName ? "Topolino" : speakerName;

            const randomPhrases = [
                `Oh no! ${faintedName} è a terra! Dobbiamo rimetterlo in sesto!`,
                `${faintedName} ha preso una bella batosta... forza, resisti! Ti cureremo!`,
                `Accidenti, ${faintedName} è esausto! Qualcuno prenda una Pozione!`,
                `Abbiamo vinto, ma a che prezzo? ${faintedName} ha perso i sensi...`
            ];
            const phrase = randomPhrases[Math.floor(Math.random() * randomPhrases.length)];
            
            // Inserisci questo dialogo dinamico SOLO al primo indice, generato al volo
            if (campaignDialogueIdx === 0 && !fullDialogue[0]?.isDynamic) {
                fullDialogue.unshift({ s: finalSpeaker, t: phrase, isDynamic: true });
            } else if (fullDialogue[0] && fullDialogue[0].isDynamic) {
                // Per mantenere lo stato se il componente si re-renderizza
            } else {
                 fullDialogue.unshift({ s: finalSpeaker, t: phrase, isDynamic: true });
            }
        }

        const dialogue = fullDialogue[campaignDialogueIdx];
        
        const nextDialogue = () => {
            if (dialogue && campaignDialogueIdx < fullDialogue.length - 1) {
                setCampaignDialogueIdx(p => p + 1);
            } else {
                const newCoins = campaignState.coins + 150;
                let nextMissionIdx = campaignState.missionIdx + 1;
                let nextSectorIdx = campaignState.sectorIdx;
                let nextAppMode = 'campaign_map';

                if (nextMissionIdx >= CAMPAIGN_DATA.sectors[campaignState.sectorIdx].missions.length) {
                    nextMissionIdx = 0;
                    nextSectorIdx++;
                    nextAppMode = 'campaign_shop';
                }

                if (nextSectorIdx >= CAMPAIGN_DATA.sectors.length) {
                    nextAppMode = 'campaign_ending';
                }

                setCampaignState(prev => ({
                    ...prev,
                    coins: newCoins,
                    missionIdx: nextMissionIdx,
                    sectorIdx: nextSectorIdx,
                    faintedInLastBattle: null // Resetta la memoria degli svenuti per la prossima lotta
                }));
                setAppMode(nextAppMode);
            }
        };

        if (!dialogue) {
             setTimeout(nextDialogue, 0);
             return <div className="min-h-screen bg-slate-950"></div>;
        }

        const speakerName = dialogue.s.replace(' (Corrotto)', '').replace(' (Corrotta)', '');
        const speakerChar = CHARACTERS.find(c => c.name === speakerName || c.name.includes(speakerName));
        
        return (
            <div className={`min-h-screen flex flex-col justify-end p-8 ${sector.bg} relative overflow-hidden`} onClick={nextDialogue}>
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-yellow-500/20 via-transparent to-transparent pointer-events-none opacity-50"></div>
                 {speakerChar && (
                     <div className={`absolute bottom-0 left-4 md:left-24 transition-all duration-500 pointer-events-none drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]`}>
                         <img src={speakerChar.img} className="w-48 h-48 md:w-80 md:h-80 object-cover rounded-t-full border-t-4 border-x-4 border-emerald-500 opacity-100" />
                     </div>
                 )}
                 <div className="bg-slate-900/95 border-2 border-emerald-400 p-8 rounded-2xl max-w-4xl w-full mx-auto z-10 cursor-pointer shadow-[0_0_40px_rgba(16,185,129,0.2)] relative mb-12 animate-fade-in">
                      <div className={`absolute -top-4 left-6 px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest shadow-md bg-emerald-500 text-white`}>{dialogue.s}</div>
                      <p className="text-xl md:text-2xl mt-4 leading-relaxed font-medium text-white italic">"{dialogue.t}"</p>
                      <p className="text-right text-xs text-emerald-400 mt-4 animate-pulse font-bold">Clicca per continuare...</p>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_team_select') {
        const isFinalRaid = campaignState.sectorIdx === CAMPAIGN_DATA.sectors.length - 1;
        const maxTeamSize = isFinalRaid ? 20 : 4;

        const toggleChar = (id) => {
            if (campaignSelectedTeam.includes(id)) {
                setCampaignSelectedTeam(campaignSelectedTeam.filter(c => c !== id));
            } else {
                if (campaignSelectedTeam.length < maxTeamSize) setCampaignSelectedTeam([...campaignSelectedTeam, id]);
            }
        };
        
        const handleStartCampaignBattle = () => {
            if (campaignSelectedTeam.length === 0) return setSystemAlert("Seleziona almeno un personaggio!");
            
            const mission = CAMPAIGN_DATA.sectors[campaignState.sectorIdx].missions[campaignState.missionIdx];
            
            const p1Team = campaignSelectedTeam.map(id => {
                const baseChar = CHARACTERS.find(c => c.id === id);
                const hp = campaignState.rosterStats[id];
                return {
                    ...JSON.parse(JSON.stringify(baseChar)), hp: hp, statuses: [], consecutiveProtect: 0,
                    baseAtk: baseChar.atk, baseDef: baseChar.def, baseSpd: baseChar.spd,
                    moves: baseChar.moves.map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
                };
            });

            const p2Team = mission.boss.map(id => {
                const baseChar = CHARACTERS.find(c => c.id === id);
                
                // BUFF GIGANTESCO PER I RAID BOSS FINALI!
                let hpMultiplier = 1;
                if (isFinalRaid) hpMultiplier = 15; // Trigon e Gaster hanno 15x HP!
                else if (campaignState.difficulty === 'Insane') hpMultiplier = 1.5; 
                
                let hp = Math.floor(baseChar.maxHp * hpMultiplier);
                
                let charInst = {
                    ...JSON.parse(JSON.stringify(baseChar)), hp: hp, maxHp: hp, statuses: [], consecutiveProtect: 0,
                    baseAtk: baseChar.atk, baseDef: baseChar.def, baseSpd: baseChar.spd,
                    moves: baseChar.moves.map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
                };
                
                if (!isFinalRaid) {
                    charInst.imageFilter = 'sepia(0.6) hue-rotate(250deg) saturate(3) brightness(0.7) contrast(1.3) drop-shadow(0 0 10px rgba(168,85,247,0.8))';
                } else {
                    charInst.imageFilter = 'drop-shadow(0 0 20px rgba(220,38,38,1))'; // Aura rossa oscura per i boss finali
                }

                if (campaignState.difficulty === 'Insane' || isFinalRaid) {
                    charInst.statuses.push({ type: 'Protetto', turns: 1 });
                    charInst.statuses.push({ type: 'Scudo Team', turns: 2 });
                }
                
                // Buff Alle Statistiche dei Super Boss
                if (isFinalRaid) {
                     charInst.atk = Math.floor(charInst.atk * 1.5);
                     charInst.baseAtk = charInst.atk;
                     charInst.def = Math.floor(charInst.def * 1.2);
                     charInst.baseDef = charInst.def;
                }

                return charInst;
            });

            const state = initialGameState();
            state.gameMode = 'classica';
            state.isCampaignBattle = true;
            state.settings = { teamSize: p1Team.length, fieldSize: Math.min(4, Math.max(p1Team.length > 4 ? 4 : p1Team.length, p2Team.length)) };
            
            state.players.p1 = playerName || "Resistenza";
            state.playerAvatars.p1 = CHARACTERS.find(c=>c.id===campaignSelectedTeam[0])?.img || '';
            state.isBot.p1 = false;
            
            state.players.p2 = mission.boss.map(id => CHARACTERS.find(c=>c.id===id).name).join(" & ");
            state.playerAvatars.p2 = CHARACTERS.find(c=>c.id===mission.boss[0])?.img || '';
            state.isBot.p2 = true;

            state.teams = { p1: p1Team, p2: p2Team, p3: [], p4: [] };
            state.field = { 
                p1: p1Team.slice(0, state.settings.fieldSize).map((_, i) => i), 
                p2: p2Team.slice(0, state.settings.fieldSize).map((_, i) => i),
                p3: [], p4: []
            };
            state.status = 'pre_battle';
            
            setGameState(state);
            setPlayerRole('p1');
            setAppMode('local_room');
        };
        
        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col items-center justify-center relative">
                <button onClick={() => setAppMode('campaign_map')} className="absolute top-6 left-6 flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
                     <ArrowLeft size={20} /> Indietro
                </button>
                <div className="text-center mb-8">
                    <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
                        {isFinalRaid ? "LA BATTAGLIA FINALE - MODALITÀ RAID" : "Prepara la tua Squadra"}
                    </h2>
                    <p className={`text-slate-400 mt-2 ${isFinalRaid ? 'font-bold text-rose-400' : ''}`}>
                        {isFinalRaid ? `Schiera un esercito! Seleziona fino a ${maxTeamSize} eroi per abbattere i Veri Padroni. (Selezionati: ${campaignSelectedTeam.length}/${maxTeamSize})` : `Seleziona fino a ${maxTeamSize} eroi per lo scontro. (Selezionati: ${campaignSelectedTeam.length}/${maxTeamSize})`}
                    </p>
                </div>
                
                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-10 max-w-5xl w-full max-h-[50vh] overflow-y-auto custom-scrollbar p-2">
                    {campaignState.roster.map(id => {
                        const char = CHARACTERS.find(c=>c.id===id);
                        const hp = campaignState.rosterStats[id];
                        const isSelected = campaignSelectedTeam.includes(id);
                        const isDead = hp <= 0;
                        if(!char) return null;
                        return (
                            <div key={id} onClick={() => !isDead && toggleChar(id)} className={`p-4 rounded-xl border-2 transition-all cursor-pointer flex flex-col items-center text-center shadow-lg hover:-translate-y-1 ${isDead ? 'opacity-40 border-rose-900 grayscale bg-slate-900 pointer-events-none' : isSelected ? 'border-emerald-500 bg-emerald-900/40 shadow-[0_0_20px_rgba(16,185,129,0.4)]' : 'border-slate-700 bg-slate-800 hover:border-slate-500'}`}>
                                <img src={char.img} className={`w-20 h-20 rounded-full border-2 mb-3 object-cover ${isSelected ? 'border-emerald-400' : 'border-slate-600'}`} />
                                <div className="font-bold text-sm mb-2 truncate w-full">{char.name}</div>
                                <div className="w-full">{renderHealthBar(hp, char.maxHp)}</div>
                                {isDead && <div className="text-[10px] text-rose-500 font-bold mt-2 uppercase tracking-widest bg-rose-900/50 px-2 py-0.5 rounded">Esausto</div>}
                            </div>
                        );
                    })}
                </div>
                <button onClick={handleStartCampaignBattle} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-12 py-5 rounded-full font-black text-2xl shadow-[0_10px_30px_rgba(59,130,246,0.4)] hover:-translate-y-1 transition-all flex items-center gap-3">
                    <Swords size={28}/> Inizia Battaglia!
                </button>
            </div>
        );
    }

    if (appMode === 'campaign_shop') {
        const buyHeal = () => {
            if (campaignState.coins >= 50) {
                const newStats = {...campaignState.rosterStats};
                campaignState.roster.forEach(id => {
                    newStats[id] = CHARACTERS.find(c=>c.id===id).maxHp;
                });
                setCampaignState(p => ({...p, coins: p.coins - 50, rosterStats: newStats}));
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-6 relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-yellow-900/40 via-slate-950 to-black pointer-events-none opacity-60"></div>
                <div className="bg-slate-900/90 border border-yellow-500/50 p-10 rounded-3xl max-w-lg w-full text-center shadow-[0_0_50px_rgba(234,179,8,0.15)] z-10">
                    <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-2">Checkpoint Dimensionale</h2>
                    <p className="text-slate-400 text-sm mb-10">Riposa e cura la tua squadra prima del prossimo settore.</p>
                    
                    <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 mb-10 flex justify-between items-center shadow-inner">
                         <div className="text-left flex items-center gap-4">
                             <div className="bg-emerald-500/20 p-3 rounded-xl text-emerald-400"><Heart size={28}/></div>
                             <div>
                                 <div className="font-black text-xl text-white">Cura Totale Squadra</div>
                                 <div className="text-xs text-slate-400 mt-1">Ripristina tutti gli HP al massimo</div>
                             </div>
                         </div>
                         <button onClick={buyHeal} className="bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 text-white font-black px-6 py-3 rounded-xl flex items-center gap-2 shadow-lg hover:-translate-y-0.5 transition-all"><Coins size={20}/> 50</button>
                    </div>

                    <div className="flex items-center justify-center gap-3 mb-10 text-2xl font-black bg-black/40 py-4 rounded-xl border border-slate-800">
                        Bilancio: <Coins className="text-yellow-400" size={28} /> <span className="text-yellow-400">{campaignState.coins} Monete</span>
                    </div>
                    
                    <button onClick={() => setAppMode('campaign_map')} className="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-full font-black text-xl transition-all shadow-lg hover:-translate-y-1">Avanza al Prossimo Settore</button>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_ending') {
        return (
            <div className="min-h-screen bg-gradient-to-t from-blue-950 to-slate-950 text-white flex flex-col items-center justify-center p-6 text-center">
                <Trophy size={80} className="text-yellow-400 mb-6 drop-shadow-[0_0_30px_rgba(234,179,8,0.8)] animate-bounce" />
                <h1 className="text-6xl md:text-8xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 drop-shadow-md tracking-tighter">IL MULTIVERSO È LIBERO!</h1>
                <p className="text-xl md:text-2xl text-slate-300 max-w-3xl mb-12 font-medium leading-relaxed">
                    Cell Perfetto è stato sconfitto e il suo influsso spezzato. Il varco rimane aperto, ma ora eroi e cattivi di ogni dimensione possono convivere in pace. Hai salvato innumerevoli mondi!
                </p>
                <div className="bg-slate-900/50 p-6 rounded-3xl border border-white/10 mb-12 w-full max-w-4xl backdrop-blur-md">
                    <h3 className="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-6">La Resistenza Finale</h3>
                    <div className="flex flex-wrap justify-center gap-4">
                         {campaignState.roster.map(id => {
                              const char = CHARACTERS.find(c=>c.id===id);
                              if(!char) return null;
                              return <img key={id} src={char.img} className="w-16 h-16 rounded-full border-2 border-emerald-500 object-cover shadow-lg" title={char.name} alt={char.name} />;
                         })}
                    </div>
                </div>
                <button onClick={() => { localStorage.removeItem('multiverse_rpg_campaign_save'); setAppMode('menu'); }} className="bg-white text-black px-12 py-5 rounded-full font-black text-xl hover:scale-105 transition-transform shadow-[0_0_40px_rgba(255,255,255,0.4)]">Torna al Menu Principale</button>
            </div>
        );
    }

    if (appMode === 'shop') {
        const playerData = getPlayerData();
        
        const handleBuyItem = (itemDef) => {
            if (playerData.coins >= itemDef.price) {
                updateLocalStats({ spendCoins: itemDef.price, buyItem: itemDef.id });
                // Forza un re-render cambiando un po' lo stato locale, o basterà il prossimo ciclo
                setGameState({...gameState}); 
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        const handleBuyChar = (char) => {
            if (playerData.coins >= char.price) {
                updateLocalStats({ spendCoins: char.price, unlockChar: char.id });
                setGameState({...gameState}); 
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/40 via-slate-950 to-black pointer-events-none opacity-60"></div>
                
                <div className="relative z-10 w-full max-w-5xl bg-slate-900/80 backdrop-blur-xl border border-amber-700/50 rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center mb-6 border-b border-amber-800/50 pb-6 shrink-0">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-amber-400 transition-colors font-bold bg-slate-950/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 text-center flex-1 flex items-center justify-center gap-3">
                            <ShoppingCart size={32} className="text-amber-500" /> Negozio
                        </h2>
                        <div className="flex items-center gap-2 bg-black/50 px-5 py-2 rounded-full border border-amber-500/50">
                            <Coins size={24} className="text-yellow-400" />
                            <span className="font-black text-xl text-yellow-400">{playerData.coins}</span>
                        </div>
                    </div>

                    <div className="flex gap-4 mb-6 shrink-0">
                         <button onClick={() => setShopTab('items')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${shopTab === 'items' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg border border-amber-500' : 'bg-slate-950/50 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}><BookOpen size={20}/> Oggetti e Cure</button>
                         <button onClick={() => setShopTab('chars')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${shopTab === 'chars' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg border border-amber-500' : 'bg-slate-950/50 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}><Users size={20}/> Personaggi Sbloccabili</button>
                    </div>

                    {shopTab === 'items' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar p-2">
                            {Object.values(ITEMS_DB).map(item => {
                                const owned = playerData.inventory[item.id] || 0;
                                const canAfford = playerData.coins >= item.price;
                                
                                return (
                                    <div key={item.id} className="bg-slate-950/80 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between hover:border-amber-500/50 transition-colors group shadow-lg relative">
                                        <div className="absolute top-3 right-3 bg-slate-800 text-xs font-bold px-2 py-1 rounded text-slate-400 border border-slate-600">
                                            Posseduti: {owned}
                                        </div>
                                        <div>
                                            <div className="text-4xl mb-3 mt-2">{item.icon}</div>
                                            <h3 className="text-lg font-black text-white mb-1">{item.name}</h3>
                                            <p className="text-xs text-slate-400 h-10 leading-tight">{item.desc}</p>
                                        </div>
                                        <button 
                                            onClick={() => handleBuyItem(item)}
                                            disabled={!canAfford}
                                            className={`mt-4 w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${canAfford ? 'bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white shadow-lg hover:-translate-y-0.5' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}`}
                                        >
                                            Compra - <Coins size={16}/> {item.price}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {shopTab === 'chars' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto custom-scrollbar p-2">
                            {CHARACTERS.filter(c => c.price && !c.isSummonOnly).sort((a,b) => a.price - b.price).map(char => {
                                const isUnlocked = playerData.unlockedChars.includes(char.id);
                                const canAfford = playerData.coins >= char.price;
                                
                                return (
                                    <div key={char.id} className={`bg-slate-950/80 border ${isUnlocked ? 'border-emerald-500/50' : 'border-slate-700'} rounded-2xl p-4 flex flex-col justify-between transition-colors shadow-lg relative`}>
                                        <div className="flex flex-col items-center">
                                            <img src={char.img} className={`w-20 h-20 rounded-full object-cover mb-3 border-2 ${isUnlocked ? 'border-emerald-500/50' : 'border-slate-600'}`} />
                                            <h3 className="text-sm font-black text-white text-center mb-1 leading-tight">{char.name}</h3>
                                            <div className="flex flex-wrap gap-1 justify-center mb-3">
                                                {char.types.map(t => (
                                                    <span key={t} className={`text-[8px] font-black px-1 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        {isUnlocked ? (
                                            <button disabled className="w-full py-2 rounded-xl font-bold flex items-center justify-center gap-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs cursor-default">
                                                <Unlock size={14}/> Sbloccato
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => handleBuyChar(char)}
                                                disabled={!canAfford}
                                                className={`w-full py-2 rounded-xl font-bold flex items-center justify-center gap-1 transition-all text-xs ${canAfford ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}`}
                                            >
                                                <Lock size={14}/> {char.price} <Coins size={12}/>
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            </div>
        );
    }

    if (appMode === 'stats') {
        const key = `multiverse_rpg_stats_${playerName.trim().toLowerCase()}`;
        const rawStats = localStorage.getItem(key);
        const stats = rawStats ? JSON.parse(rawStats) : { matches: 0, wins: 0, playtime: 0, chars: {}, moves: {} };

        const getMostUsed = (obj) => {
            if (!obj || Object.keys(obj).length === 0) return { name: "Nessuno", count: 0 };
            const best = Object.keys(obj).reduce((a, b) => obj[a] > obj[b] ? a : b);
            return { name: best, count: obj[best] };
        };

        const favChar = getMostUsed(stats.chars);
        const favMove = getMostUsed(stats.moves);
        
        const formatTime = (secs) => {
            if (secs < 60) return `${secs} secondi`;
            const m = Math.floor(secs / 60);
            const h = Math.floor(m / 60);
            if (h > 0) return `${h}h ${m % 60}m`;
            return `${m}m ${secs % 60}s`;
        };

        const winRate = stats.matches > 0 ? Math.round((stats.wins / stats.matches) * 100) : 0;

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>
                
                <div className="relative z-10 w-full max-w-3xl bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
                    <div className="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-950/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 text-center flex-1">Statistiche di {playerName}</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {/* Panoramica */}
                        <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 shadow-inner">
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 flex items-center gap-2"><Trophy size={16} className="text-yellow-500"/> Carriera</h3>
                            
                            <div className="space-y-4">
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Partite Giocate</span>
                                    <span className="text-2xl font-black text-white">{stats.matches}</span>
                                </div>
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Vittorie</span>
                                    <span className="text-2xl font-black text-emerald-400">{stats.wins}</span>
                                </div>
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Win Rate</span>
                                    <span className="text-2xl font-black text-blue-400">{winRate}%</span>
                                </div>
                                <div className="flex justify-between items-end">
                                    <span className="text-slate-300 font-medium">Tempo in Battaglia</span>
                                    <span className="text-xl font-bold text-amber-400">{formatTime(stats.playtime)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Preferenze */}
                        <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 shadow-inner flex flex-col justify-center">
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 flex items-center gap-2"><Target size={16} className="text-rose-500"/> I Tuoi Preferiti</h3>
                            
                            <div className="bg-slate-900 border border-slate-700/50 rounded-xl p-4 mb-4 flex items-center gap-4">
                                <div className="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center shrink-0 border border-slate-600">
                                    <Users size={24} className="text-cyan-400"/>
                                </div>
                                <div>
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Personaggio Più Usato</div>
                                    <div className="text-lg font-black text-white truncate">{favChar.name}</div>
                                    <div className="text-xs text-slate-500">Schierato {favChar.count} volte</div>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-700/50 rounded-xl p-4 flex items-center gap-4">
                                <div className="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center shrink-0 border border-slate-600">
                                    <Swords size={24} className="text-rose-400"/>
                                </div>
                                <div className="overflow-hidden">
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Mossa Più Usata</div>
                                    <div className="text-lg font-black text-white truncate">{favMove.name}</div>
                                    <div className="text-xs text-slate-500">Eseguita {favMove.count} volte</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p className="text-center text-slate-500 text-xs mt-4">
                        I dati vengono salvati localmente su questo dispositivo associandoli al nome che hai inserito.
                    </p>
                </div>
            </div>
        );
    }

    if (appMode === 'type_chart') {
        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>
                <div className="relative z-10 flex flex-col h-full max-w-7xl mx-auto w-full">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 hidden sm:block">Tabella Efficacia Tipi</h2>
                        <div className="w-[100px] hidden sm:block"></div>
                    </div>

                    <div className="flex flex-wrap gap-4 justify-center mb-6 text-sm font-bold bg-slate-900/60 p-3 rounded-2xl border border-slate-700/50 backdrop-blur-md">
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-green-500 rounded border border-green-400"></div> 2x (Superefficace)</span>
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-red-500 rounded border border-red-400"></div> ½x (Poco efficace)</span>
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-700 rounded border border-gray-500"></div> 0x (Nessun effetto)</span>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar border border-slate-700/50 rounded-2xl bg-slate-900/80 backdrop-blur-md shadow-2xl relative">
                        <table className="w-full text-center border-collapse">
                            <thead>
                                <tr>
                                    <th className="p-3 border-b-2 border-r-2 border-slate-700 bg-slate-950 sticky top-0 left-0 z-30 shadow-sm min-w-[120px]">
                                        <div className="text-xs text-slate-400 text-right pr-2">Difensore ➔</div>
                                        <div className="text-xs text-slate-400 text-left pl-2 mt-1">Attaccante ⬇</div>
                                    </th>
                                    {TYPES.map(t => (
                                        <th key={t} className="p-2 border-b-2 border-slate-700 sticky top-0 bg-slate-950 z-20 w-12 sm:w-16 shadow-sm">
                                            <div className="flex justify-center h-24 items-end pb-2">
                                                <span className={`text-[10px] font-black px-1.5 py-1 rounded uppercase tracking-wider ${TYPE_STYLES[t] || 'bg-gray-500'} transform -rotate-180 whitespace-nowrap`} style={{ writingMode: 'vertical-rl' }}>
                                                    {t}
                                                </span>
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {TYPES.map(atkType => (
                                    <tr key={atkType} className="hover:bg-slate-800/50 transition-colors">
                                        <th className="p-2 border-r-2 border-b border-slate-700 bg-slate-950 sticky left-0 z-20 text-left shadow-sm">
                                            <span className={`text-[10px] sm:text-xs font-black px-2 py-1.5 rounded shadow-sm uppercase w-full block text-center ${TYPE_STYLES[atkType] || 'bg-gray-500'}`}>
                                                {atkType}
                                            </span>
                                        </th>
                                        {TYPES.map(defType => {
                                            const mult = TYPE_CHART[atkType] && TYPE_CHART[atkType][defType] !== undefined ? TYPE_CHART[atkType][defType] : 1;
                                            let cellClass = "p-2 border-b border-r border-slate-800/30 text-sm md:text-base transition-colors hover:brightness-125";
                                            let content = "";
                                            
                                            if (mult === 2) { 
                                                cellClass += " bg-green-500/20 text-emerald-400 font-black shadow-[inset_0_0_10px_rgba(16,185,129,0.2)]"; 
                                                content = "2x"; 
                                            } else if (mult === 0.5) { 
                                                cellClass += " bg-red-500/20 text-rose-400 font-bold shadow-[inset_0_0_10px_rgba(244,63,94,0.1)]"; 
                                                content = "½x"; 
                                            } else if (mult === 0) { 
                                                cellClass += " bg-gray-800/80 text-gray-500 font-black"; 
                                                content = "0x"; 
                                            } else {
                                                cellClass += " text-slate-600 font-medium text-[10px]";
                                            }

                                            return (
                                                <td key={defType} className={cellClass}>
                                                    {content}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    }

    if (appMode === 'catalog') {
        let displayedChars = [...CHARACTERS].filter(c => !c.isSummonOnly);
        if (catalogFilter !== 'Tutti') {
            displayedChars = displayedChars.filter(c => c.types.includes(catalogFilter));
        }
        if (catalogSearch.trim() !== '') {
            const searchLower = catalogSearch.toLowerCase();
            displayedChars = displayedChars.filter(c => c.name.toLowerCase().includes(searchLower));
        }
        if (catalogSort === 'alpha') {
            displayedChars.sort((a, b) => a.name.localeCompare(b.name));
        } else if (catalogSort === 'type') {
            displayedChars.sort((a, b) => a.types[0].localeCompare(b.types[0]));
        }

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>

                <div className="relative z-10 flex flex-col h-full max-w-7xl mx-auto w-full">
                    <div className="flex justify-between items-center mb-8">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 hidden sm:block">Catalogo Personaggi</h2>
                        <div className="w-[100px] hidden sm:block"></div>
                    </div>

                    <div className="flex flex-wrap gap-4 mb-8 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50 backdrop-blur-md items-center">
                        <div className="flex-1 min-w-[200px]">
                            <input 
                                type="text" 
                                placeholder="Cerca per nome..." 
                                value={catalogSearch} 
                                onChange={e => setCatalogSearch(e.target.value)} 
                                className="w-full bg-slate-800 text-white font-bold px-4 py-2 rounded-xl outline-none border border-slate-600 focus:border-cyan-500 placeholder-slate-400"
                            />
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-slate-400 font-bold uppercase text-xs tracking-widest">Filtra:</span>
                            <select value={catalogFilter} onChange={e => setCatalogFilter(e.target.value)} className="bg-slate-800 text-white font-bold p-2 rounded-lg outline-none border border-slate-600 focus:border-cyan-500">
                                <option value="Tutti">Tutti</option>
                                {TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-slate-400 font-bold uppercase text-xs tracking-widest">Ordina:</span>
                            <select value={catalogSort} onChange={e => setCatalogSort(e.target.value)} className="bg-slate-800 text-white font-bold p-2 rounded-lg outline-none border border-slate-600 focus:border-cyan-500">
                                <option value="alpha">A-Z</option>
                                <option value="type">Per Tipo Primario</option>
                            </select>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 pb-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                            {displayedChars.map(char => (
                                <div key={char.id} className="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-5 flex flex-col items-center hover:border-cyan-500/50 transition-colors shadow-lg relative">
                                    <img src={char.img} alt={char.name} className="w-24 h-24 rounded-full object-cover mb-4 border-2 border-slate-600/50" />
                                    {char.price && (
                                        <div className="absolute top-2 right-2 bg-amber-500/20 border border-amber-500/50 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                            <Lock size={10}/> {char.price}
                                        </div>
                                    )}
                                    <h4 className="font-bold text-lg mb-2 text-slate-100 text-center">{char.name}</h4>
                                    <div className="flex flex-wrap gap-1.5 justify-center mb-4">
                                      {char.types.map(t => (
                                        <span key={t} className={`text-[9px] font-black px-2 py-0.5 rounded-md uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                      ))}
                                    </div>
                                    <div className="w-full grid grid-cols-2 gap-2 text-xs font-mono bg-slate-950/50 p-3 rounded-xl mb-4 border border-slate-800">
                                        <div className="text-emerald-400">HP: {char.maxHp}</div>
                                        <div className="text-rose-400">ATK: {char.atk}</div>
                                        <div className="text-blue-400">DEF: {char.def}</div>
                                        <div className="text-amber-400">SPD: {char.spd}</div>
                                    </div>
                                    <div className="w-full space-y-2">
                                        {char.moves.map((m, i) => (
                                            <div key={i} className="text-[10px] bg-slate-800 p-2 rounded border border-slate-700 flex flex-col gap-1">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-gray-300">{m.name}</span>
