          const getPlayerData = (nameOverride = null) => {
              const nameToUse = nameOverride || playerName;
              if (!nameToUse.trim()) return { matches: 0, wins: 0, playtime: 0, chars: {}, moves: {}, coins: 100, inventory: { cura_totale: 1 }, unlockedChars: [] };
              const key = `multiverse_rpg_stats_${nameToUse.trim().toLowerCase()}`;
              const raw = localStorage.getItem(key);
              if (raw) {
                  let data = JSON.parse(raw);
                  // Compatibilità con salvataggi vecchi
                  if (data.coins === undefined) data.coins = 100;
                  if (data.inventory === undefined) data.inventory = { cura_totale: 1 };
                  if (data.unlockedChars === undefined) data.unlockedChars = [];
                  return data;
              }
              return { matches: 0, wins: 0, playtime: 0, chars: {}, moves: {}, coins: 100, inventory: { cura_totale: 1 }, unlockedChars: [] };
          };

          const updateLocalStats = (updates) => {
              if (!playerName.trim()) return;
              const key = `multiverse_rpg_stats_${playerName.trim().toLowerCase()}`;
              let current = getPlayerData();

              if (updates.match) current.matches++;
              if (updates.win) current.wins++;
              if (updates.playtime) current.playtime += updates.playtime;
              if (updates.char) {
                  current.chars[updates.char] = (current.chars[updates.char] || 0) + 1;
              }
              if (updates.move) {
                  current.moves[updates.move] = (current.moves[updates.move] || 0) + 1;
              }
              if (updates.addCoins) current.coins += updates.addCoins;
              if (updates.spendCoins) current.coins -= updates.spendCoins;
              if (updates.buyItem) {
                  current.inventory[updates.buyItem] = (current.inventory[updates.buyItem] || 0) + 1;
              }
              if (updates.unlockChar) {
                  if (!current.unlockedChars) current.unlockedChars = [];
                  if (!current.unlockedChars.includes(updates.unlockChar)) {
                      current.unlockedChars.push(updates.unlockChar);
                  }
              }
              if (updates.overwriteInventory) {
                  current.inventory = updates.overwriteInventory;
              }
              
              localStorage.setItem(key, JSON.stringify(current));
          };

          const leaveRoom = () => {
            setAppMode('menu');
            setRoomId(null);
            setPlayerRole(null);
            setGameState(initialGameState());
          };

          const renderHealthBar = (hp, maxHp) => {
              const percentage = (hp / maxHp) * 100;
              let color = 'bg-green-500'; if (percentage < 50) color = 'bg-yellow-400'; if (percentage < 20) color = 'bg-red-500';
              return (
                  <div className="w-full bg-gray-900 rounded-full h-4 mt-1 relative overflow-hidden border border-gray-950">
                      <div className={`${color} h-full transition-all duration-1000 ease-in-out`} style={{ width: `${percentage}%` }}></div>
                      <span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)] z-10">
                              {Math.ceil(percentage)}%
                      </span>
                  </div>
              );
          };

          useEffect(() => {
            if (!isPlayingEvents && gameState.status === 'battling' && gameState.teams.p1) {
              setDisplayTeams(JSON.parse(JSON.stringify(gameState.teams)));
              setDisplayField(JSON.parse(JSON.stringify(gameState.field)));
            }
          }, [gameState.teams, gameState.field, isPlayingEvents, gameState.status]);

          useEffect(() => {
            if (appMode === 'online_room' && roomId && user) {
              const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
              const unsubscribe = onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                  const data = snapshot.data();
                  setGameState(data);
                }
              }, (err) => console.error(err));
              return () => unsubscribe();
            }
          }, [appMode, roomId, user]);

          // Listener per sbloccare il turno quando arrivano i dati o i bot calcolano
          useEffect(() => {
              if ((appMode === 'online_room' || appMode === 'local_room') && playerRole === 'p1' && gameState.status === 'battling') {
                  const activePlayers = getActivePlayers();
                  let humansReady = true;
                  let humanCount = 0;

                  activePlayers.forEach(p => {
                      if (!gameState.isBot[p]) {
                          humanCount++;
                          const fieldCount = gameState.field[p]?.length || 0;
                          if (Object.keys(gameState.actions[p] || {}).length < fieldCount) humansReady = false;
                      }
                  });

                  if (humansReady) {
                      let finalActions = { ...gameState.actions };
                      activePlayers.forEach(p => {
                          if (gameState.isBot[p]) {
                               finalActions[p] = generateCPUActionsForPlayer(p, finalActions);
                          }
                      });
                      calculateTurn(finalActions);
                  }
              }
          }, [gameState.actions, gameState.status, appMode, playerRole]);

          useEffect(() => {
            if (!isPlayingEvents && gameState.teams.p1) {
              setDisplayTeams(JSON.parse(JSON.stringify(gameState.teams)));
              setDisplayField(JSON.parse(JSON.stringify(gameState.field)));
            }
          }, [gameState.teams, gameState.field, isPlayingEvents]);

          useEffect(() => {
              if (gameState.status === 'pre_battle') {
                  setIntroCharIdx(0);
                  const interval = setInterval(() => {
                      setIntroCharIdx(prev => prev + 1);
                  }, 300);

                  let timeout;
                  if (appMode === 'local_room' || playerRole === 'p1') {
                      timeout = setTimeout(() => {
                          updateState({ status: 'battling' });
                          if (appMode === 'local_room') {
                              setPlayerRole('p1');
                              setCommandingIdx(0);
                          }
                      }, 3500); 
                  }

                  return () => {
                      clearInterval(interval);
                      if (timeout) clearTimeout(timeout);
                  };
              }
          }, [gameState.status, appMode, playerRole]);

          const updateState = async (newState) => {
            if (appMode === 'local_room') {
              setGameState(prev => {
                const nextState = { ...prev };
                Object.keys(newState).forEach(key => {
                  if (key.includes('.')) {
                    const parts = key.split('.');
                    let current = nextState;
                    for (let i = 0; i < parts.length - 1; i++) {
                      current[parts[i]] = { ...current[parts[i]] }; 
                      current = current[parts[i]];
                    }
                    current[parts[parts.length - 1]] = newState[key];
                  } else {
                    nextState[key] = newState[key];
                  }
                });
                return nextState;
              });
              return Promise.resolve();
            } else if (appMode === 'online_room' && roomId) {
              const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
              await updateDoc(roomRef, newState);
            }
          };

          const getRequiredPlayers = (mode, currentSettings) => {
              if (mode === 'classica') return 2;
              if (mode === 'torneo_punti') return currentSettings ? currentSettings.maxPlayers : 4;
              return 4;
          };
          
          const getActivePlayers = () => {
              if (gameState.gameMode === 'classica') return ['p1', 'p2'];
              if (gameState.gameMode === 'multipla') return ['p1', 'p2', 'p3', 'p4'];
              if (gameState.gameMode === 'torneo') {
                  const bracket = gameState.tournamentBracket || ['p1', 'p2', 'p3', 'p4'];
                  if (gameState.tournamentMatch === 'semi1') return [bracket[0], bracket[1]];
                  if (gameState.tournamentMatch === 'semi2') return [bracket[2], bracket[3]];
                  if (gameState.tournamentMatch === 'bronze' && gameState.tournamentResults.semi1 && gameState.tournamentResults.semi2) 
                      return [gameState.tournamentResults.semi1.loser, gameState.tournamentResults.semi2.loser];
                  if (gameState.tournamentMatch === 'final' && gameState.tournamentResults.semi1 && gameState.tournamentResults.semi2) 
                      return [gameState.tournamentResults.semi1.winner, gameState.tournamentResults.semi2.winner];
                  return [bracket[0], bracket[1]]; 
              }
              if (gameState.gameMode === 'torneo_punti') {
                  if (gameState.roundRobinMatches && gameState.roundRobinMatches.length > 0) {
                      const match = gameState.roundRobinMatches[gameState.currentMatchIdx];
                      return [match.pA, match.pB];
                  }
                  return ['p1', 'p2'];
              }
              return ['p1', 'p2'];
          };

          const isAllPlayersJoined = () => {
              const req = getRequiredPlayers(gameState.gameMode, gameState.settings);
              let joined = 0;
              const slots = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].slice(0, req);
              slots.forEach(slot => {
                  if (gameState.players[slot]) joined++;
              });
              
              if (gameState.gameMode === 'torneo_punti') return joined >= 2;
              return joined === req;
          };

          const handleCreateRoom = async () => {
            if (!playerName.trim()) return setSystemAlert("Inserisci il tuo nome!");
            if (!user) return setSystemAlert("Connessione ai server in corso, riprova tra un istante.");
            const newRoomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            const state = initialGameState();
            state.players.p1 = playerName;
            state.playerAvatars.p1 = playerAvatarUrl;
            state.inventory.p1 = getPlayerData().inventory;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
            await setDoc(roomRef, state);
            
            setRoomId(newRoomId);
            setPlayerRole('p1');
            setAppMode('online_room');
          };

          const handleJoinRoom = async () => {
            if (!playerName.trim() || !roomIdInput.trim()) return setSystemAlert("Inserisci nome e codice stanza!");
            if (!user) return setSystemAlert("Connessione in corso...");
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomIdInput.toUpperCase());
            const snap = await getDoc(roomRef);
            if (!snap.exists()) return setSystemAlert("Stanza non trovata!");
            
            const data = snap.data();
            let assignedRole = null;
            const req = getRequiredPlayers(data.gameMode, data.settings);
            
            // Trova primo slot libero o occupato da un Bot
            ['p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].slice(0, req - 1).forEach(slot => {
                 if (!assignedRole && (!data.players[slot] || data.isBot[slot])) {
                      assignedRole = slot;
                 }
            });

            if (!assignedRole) return setSystemAlert("Stanza piena o partita in corso!");

            await updateDoc(roomRef, { 
                [`players.${assignedRole}`]: playerName,
                [`playerAvatars.${assignedRole}`]: playerAvatarUrl,
                [`isBot.${assignedRole}`]: false,
                [`inventory.${assignedRole}`]: getPlayerData().inventory
            });
            setRoomId(roomIdInput.toUpperCase());
            setPlayerRole(assignedRole);
            setAppMode('online_room');
          };

          const handleAddBot = (slot) => {
            const botNum = Object.values(gameState.isBot).filter(Boolean).length + 1;
            updateState({
                [`players.${slot}`]: `CPU Bot ${botNum}`,
                [`playerAvatars.${slot}`]: `https://api.dicebear.com/7.x/bottts/svg?seed=CpuBot${botNum}&backgroundColor=020617`,
                [`isBot.${slot}`]: true,
                [`inventory.${slot}`]: { cura_totale: 1 }
            });
          };

          const handleRemovePlayer = (slot) => {
            updateState({
                [`players.${slot}`]: null,
                [`playerAvatars.${slot}`]: '',
                [`isBot.${slot}`]: false,
                [`inventory.${slot}`]: {}
            });
          };

          const handleLocalStart = () => {
            const state = initialGameState();
            state.players.p1 = playerName || "Gioc. 1";
            state.playerAvatars.p1 = playerAvatarUrl;
            state.inventory.p1 = getPlayerData().inventory;
            setGameState(state);
            setPlayerRole('p1');
            setAppMode('local_room');
          };

          const handleVsCpuStart = () => {
            const state = initialGameState();
            state.players.p1 = playerName || "Giocatore";
            state.playerAvatars.p1 = playerAvatarUrl;
            state.inventory.p1 = getPlayerData().inventory;
            state.players.p2 = "Bot Supremo";
            state.playerAvatars.p2 = 'https://api.dicebear.com/7.x/bottts/svg?seed=CpuBot&backgroundColor=020617';
            state.isBot.p2 = true;
            state.inventory.p2 = { cura_totale: 1, pozione: 2 };
            setGameState(state);
            setPlayerRole('p1');
            setAppMode('local_room');
          };

          const handlePick = (char) => {
            const currentDraft = gameState.draft[playerRole] || [];
            if (currentDraft.length >= gameState.settings.teamSize) return;
            
            const charInstance = { 
                ...char, 
                statuses: [],
                consecutiveProtect: 0,
                baseAtk: char.atk,
                baseDef: char.def,
                baseSpd: char.spd,
                moves: char.moves.map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
            };

            const newDraft = { ...gameState.draft, [playerRole]: [...currentDraft, charInstance] };
            updateState({ draft: newDraft });
          };

          const startBattle = () => {
            const teams = JSON.parse(JSON.stringify(gameState.draft));
            let fieldSize = gameState.settings.fieldSize;
            if (gameState.gameMode === 'multipla') fieldSize = 1; 
            
            let field = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [], p8: [] };
            
            // GESTIONE SHUFFLE GIOCATORI NEL TORNEO
            let bracket = ['p1', 'p2', 'p3', 'p4'];
            let rrMatches = [];
            let scores = { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0, p7: 0, p8: 0 };

            if (gameState.gameMode === 'torneo') {
                for (let i = bracket.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [bracket[i], bracket[j]] = [bracket[j], bracket[i]];
                }
                ['p1', 'p2', 'p3', 'p4'].forEach(p => {
                    if (teams[p] && teams[p].length > 0) {
                        field[p] = teams[p].slice(0, fieldSize).map((_, i) => i);
                    }
                });
            } else if (gameState.gameMode === 'torneo_punti') {
                const joinedPlayers = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].filter(p => gameState.players[p]);
                for (let i = 0; i < joinedPlayers.length; i++) {
                    for (let j = i + 1; j < joinedPlayers.length; j++) {
                        rrMatches.push({ pA: joinedPlayers[i], pB: joinedPlayers[j] });
                    }
                }
                rrMatches.sort(() => Math.random() - 0.5); // Mescola le partite
                
                // Manda in campo solo i due giocatori della prima partita
                [rrMatches[0].pA, rrMatches[0].pB].forEach(p => {
                    if (teams[p] && teams[p].length > 0) {
                        field[p] = teams[p].slice(0, fieldSize).map((_, i) => i);
                    }
                });
            } else {
                ['p1', 'p2', 'p3', 'p4'].forEach(p => {
                    if (teams[p] && teams[p].length > 0) {
                        field[p] = teams[p].slice(0, fieldSize).map((_, i) => i);
                    }
                });
            }

            let nextState = {
              status: 'pre_battle', 
              teams: teams,
              field: field,
              actions: { p1: {}, p2: {}, p3: {}, p4: {}, p5: {}, p6: {}, p7: {}, p8: {} },
              pendingSwitches: { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0, p7: 0, p8: 0 },
              switchActions: { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [], p8: [] },
              tournamentMatch: gameState.gameMode === 'torneo' ? 'semi1' : null,
              tournamentBracket: bracket,
              roundRobinMatches: rrMatches,
              currentMatchIdx: 0,
              playerScores: scores
            };

            updateState(nextState);

            // AGGIORNAMENTO STATISTICHE: Partita e Personaggi scelti
            if (playerName.trim()) {
                updateLocalStats({ match: true });
                const myKey = Object.keys(gameState.players).find(k => gameState.players[k] === playerName);
                if (myKey && teams[myKey]) {
                    teams[myKey].forEach(c => updateLocalStats({ char: c.name }));
                }
            }
            matchStartTimeRef.current = Date.now();

            if (appMode === 'local_room' || appMode === 'vs_cpu') {
                let active = [];
                if (gameState.gameMode === 'torneo') active = [bracket[0], bracket[1]];
                else if (gameState.gameMode === 'torneo_punti') active = [rrMatches[0].pA, rrMatches[0].pB];
                else active = ['p1', 'p2', 'p3', 'p4'].slice(0, getRequiredPlayers(gameState.gameMode, gameState.settings));
                
                const humans = active.filter(p => !gameState.isBot[p]);
                if (humans.length > 0) {
                    setPlayerRole(humans[0]);
                } else {
                    setPlayerRole(active[0]);
                }
                setCommandingIdx(0);
            }
          };

          // --- INTELLIGENZA ARTIFICIALE CPU (Migliorata per Tutti i Bot) ---
          const generateCPUActionsForPlayer = (cpuPlayer, currentActions) => {
                let cpuActions = {};
                
                let enemyTeams = [];
                if (gameState.gameMode === 'multipla') {
                    enemyTeams = ['p1', 'p2'].includes(cpuPlayer) ? ['p3', 'p4'] : ['p1', 'p2'];
                } else if (gameState.gameMode === 'torneo') {
                    const activeMatchPlayers = getActivePlayers();
                    enemyTeams = [activeMatchPlayers.find(p => p !== cpuPlayer)];
                } else {
                    enemyTeams = [cpuPlayer === 'p1' ? 'p2' : 'p1'];
                }

                let possibleEnemies = [];
                enemyTeams.forEach(ePlayer => {
                    if(ePlayer && gameState.field[ePlayer]) {
                        gameState.field[ePlayer].forEach((fIdx, arrIdx) => {
                            let eChar = gameState.teams[ePlayer]?.[fIdx];
                            if (eChar && eChar.hp > 0) {
                                possibleEnemies.push({ player: ePlayer, idx: fIdx, fieldIdx: arrIdx, char: eChar });
                            }
                        });
                    }
                });

                gameState.field[cpuPlayer].forEach((charTeamIdx, fieldIdx) => {
                    const cpuChar = gameState.teams[cpuPlayer][charTeamIdx];
                    if (cpuChar.hp <= 0) return;

                    let bestAction = null;
                    let bestScore = -1;

                    // 1. Priorità Cure se in fin di vita
                    if (gameState.inventory[cpuPlayer].cura_totale > 0 && cpuChar.hp < (cpuChar.maxHp * 0.30)) {
                        bestAction = { type: 'use_item', itemId: 'cura_totale', targetIdx: charTeamIdx };
                        bestScore = 10000;
                    } else if (gameState.inventory[cpuPlayer].pozione > 0 && cpuChar.hp < (cpuChar.maxHp * 0.50)) {
                        bestAction = { type: 'use_item', itemId: 'pozione', targetIdx: charTeamIdx };
                        bestScore = 8000;
                    }

                    // 2. Valutazione Mosse Strategiche
                    if (!bestAction) {
                        cpuChar.moves.forEach((move, moveIdx) => {
                            if (move.remainingUses === 0) return;

                            if (move.target === 'self' || move.targetMode === 'team_smart_heal' || move.targetMode === 'team' || move.isProtect || move.isSummon) {
                                // Mosse di Supporto
                                let score = 50; 
                                if (move.heal || move.healAlone) {
                                    if (cpuChar.hp < cpuChar.maxHp * 0.5) score += 200;
                                    else score = 0;
                                }
                                if (move.isProtect) score = 80 - ((cpuChar.consecutiveProtect || 0) * 40);
                                if (move.statBuff) score += 100;

                                score += Math.random() * 20; 
                                
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestAction = { type: 'attack', moveIdx, targetPlayer: cpuPlayer, targetIdx: charTeamIdx };
                                }
                            } else if (move.targetMode === 'ally') {
                                // Logic per curare alleati
                                let allyScore = 0;
                                let bestAlly = null;
                                const myTeamPlayers = gameState.gameMode === 'multipla' ? (['p1', 'p2'].includes(cpuPlayer) ? ['p1', 'p2'] : ['p3', 'p4']) : [cpuPlayer];
                                
                                myTeamPlayers.forEach(allyPlayer => {
                                     gameState.field[allyPlayer]?.forEach((aIdx, aFieldIdx) => {
                                          const aChar = gameState.teams[allyPlayer][aIdx];
                                          if (aChar && aChar.hp > 0 && aChar.hp < aChar.maxHp * 0.5) {
                                              allyScore = 150 + Math.random() * 20;
                                              bestAlly = { p: allyPlayer, i: aIdx, fi: aFieldIdx };
                                          }
                                     });
                                });
                                
                                if (bestAlly && allyScore > bestScore) {
                                    bestScore = allyScore;
                                    bestAction = { type: 'attack', moveIdx, targetPlayer: bestAlly.p, targetIdx: bestAlly.i, targetFieldIdx: bestAlly.fi };
                                }
                            } else {
                                // Mosse di Attacco contro Nemici
                                possibleEnemies.forEach(target => {
                                    let score = 10;
                                    if (move.power > 0) {
                                        const mult = getMultiplier(move.type, target.char.types);
                                        const dmgEst = (move.power * mult * (cpuChar.atk / Math.max(1, target.char.def))) / 2;
                                        score += dmgEst;
                                        if (dmgEst >= target.char.hp) score += 5000; 
                                        if (mult > 1) score += 100;
                                    }
                                    if (move.statusEffect) score += 60; 
                                    if (move.drain && cpuChar.hp < cpuChar.maxHp) score += 80;

                                    score += Math.random() * 15; 

                                    if (score > bestScore) {
                                        bestScore = score;
                                        if (move.targetCount > 1) {
                                            bestAction = { type: 'attack', moveIdx, autoTargetCount: move.targetCount };
                                        } else {
                                            bestAction = { type: 'attack', moveIdx, targetPlayer: target.player, targetIdx: target.idx, targetFieldIdx: target.fieldIdx };
                                        }
                                    }
                                });
                            }
                        });
                    }

                    if (!bestAction && possibleEnemies.length > 0) {
                        bestAction = { type: 'attack', moveIdx: 0, targetPlayer: possibleEnemies[0].player, targetIdx: possibleEnemies[0].idx, targetFieldIdx: possibleEnemies[0].fieldIdx };
                    } else if (!bestAction) {
                        bestAction = { type: 'attack', moveIdx: 0, targetPlayer: cpuPlayer, targetIdx: charTeamIdx };
                    }

                    if (bestAction) {
                        cpuActions[charTeamIdx] = bestAction;
                    }
                });

                return cpuActions;
          };

          const commitAction = (actionDetails) => {
            const activeCharTeamIdx = gameState.field[playerRole][commandingIdx];
            
            const newActions = {
                ...gameState.actions,
                [playerRole]: {
                    ...(gameState.actions[playerRole] || {}),
                    [activeCharTeamIdx]: actionDetails
                }
            };
            
            updateState({ actions: newActions }).then(() => {
              setTargetingMoveIdx(null);
              if (commandingIdx < gameState.field[playerRole].length - 1) {
                setCommandingIdx(prev => prev + 1);
              } else {
                if (appMode === 'local_room') {
                    const active = getActivePlayers().filter(p => !gameState.isBot[p]);
                    const currIdx = active.indexOf(playerRole);
                    if (currIdx < active.length - 1) {
                        setPlayerRole(active[currIdx + 1]);
                        setCommandingIdx(0);
                    } else {
                        setCommandingIdx(-1);
                    }
                } else {
                  setCommandingIdx(-1);
                }
              }
            });
          };

          const handleSelectMoveTarget = (targetPlayer, targetFieldIdx) => {
            const activeCharTeamIdx = gameState.field[playerRole][commandingIdx];
            const activeCommandChar = gameState.teams[playerRole][activeCharTeamIdx];
            const move = activeCommandChar.moves[targetingMoveIdx];
            
            // SELEZIONE SINGOLA CLASSICA
            commitAction({
                type: 'attack',
                moveIdx: targetingMoveIdx,
                targetPlayer,
                targetIdx: gameState.field[targetPlayer][targetFieldIdx],
                targetFieldIdx: targetFieldIdx
            });
          };

          const checkTurnReady = (currentActions) => {
            if (appMode === 'online_room' && playerRole !== 'p1') return; 
            
            const activePlayers = getActivePlayers();
            let allReady = true;
            activePlayers.forEach(p => {
                const fieldCount = gameState.field[p].length;
                if (Object.keys(currentActions[p]).length < fieldCount) allReady = false;
            });

            if (allReady) {
              calculateTurn(currentActions);
            }
          };

          const calculateDamage = (attacker, defender, move, multiplier) => {
            let pwr = move.power;
            if (move.speedScaling) pwr += Math.floor(attacker.spd / 3);
            
            let defValue = move.ignoreDefBuffs && defender.def > defender.baseDef ? defender.baseDef : defender.def;
            
            const baseDamage = ((2 * 50 / 5 + 2) * pwr * (attacker.atk / defValue)) / 50 + 2;
            const randomFactor = (Math.floor(Math.random() * 16) + 85) / 100;
            const weakenFactor = attacker.statuses?.some(s => s.type === 'Indebolito') ? 0.75 : 1;
            const teamDefFactor = defender.statuses?.some(s => s.type === 'Scudo Team') && !move.ignoreDefBuffs ? 0.33 : 1;

            // STAB (Same-Type Attack Bonus): Danno aumentato del 50% se il tipo mossa coincide con il tipo attaccante
            const stabFactor = attacker.types.includes(move.type) ? 1.5 : 1;

            return Math.max(1, Math.floor(baseDamage * randomFactor * multiplier * weakenFactor * teamDefFactor * stabFactor));
          };

          const calculateTurn = (currentActions) => {
            let events = [];
            // Salvataggio stato d'inizio turno per garantire la suspense visiva
            const startOfTurnTeams = JSON.parse(JSON.stringify(gameState.teams));
            const startOfTurnField = JSON.parse(JSON.stringify(gameState.field));
            
            let workingTeams = JSON.parse(JSON.stringify(gameState.teams));
            let workingField = JSON.parse(JSON.stringify(gameState.field));
            let workingInventory = JSON.parse(JSON.stringify(gameState.inventory));
            const activeMatchPlayers = getActivePlayers();

            const handleFaint = (targetPlayer, targetIdx) => {
              const char = workingTeams[targetPlayer][targetIdx];
              events.push({ text: `${char.name} è esausto!`, type: 'faint' });
              
              char.atk = char.baseAtk;
              char.def = char.baseDef;
              char.spd = char.baseSpd;
              char.consecutiveProtect = 0;
              char.statuses = [];
              
              const deadFieldPos = workingField[targetPlayer].indexOf(targetIdx);
              if (deadFieldPos !== -1) {
                  // Rimuove il personaggio morto dal campo. Verrà innescata la fase di Sostituzione Manuale a fine turno
                  workingField[targetPlayer].splice(deadFieldPos, 1);
                  events.push({ type: 'remove', player: targetPlayer, pos: deadFieldPos });
              }
            };

            const applyDamage = (target, dmg, targetPlayer, targetIdx, text) => {
                target.hp = Math.max(0, target.hp - dmg);
                events.push({ type: 'damage', text: text, targetPlayer, targetIdx, newHp: target.hp });
                if (target.hp === 0) handleFaint(targetPlayer, targetIdx);
            };

            const updateStatusUI = (player, idx) => {
                events.push({ type: 'status_update', targetPlayer: player, targetIdx: idx, statuses: JSON.parse(JSON.stringify(workingTeams[player][idx].statuses)) });
            };

            let turnQueue = [];
            activeMatchPlayers.forEach(player => {
              workingTeams[player].forEach(char => { if (!char.statuses) char.statuses = []; });
              Object.keys(currentActions[player] || {}).forEach(charTeamIdxStr => {
                const charTeamIdx = parseInt(charTeamIdxStr);
                const char = workingTeams[player][charTeamIdx];
                const action = currentActions[player][charTeamIdxStr];
                
                let effSpd = char.spd;
                if (char.statuses.some(s => s.type === 'Elettrizzato')) effSpd = Math.floor(effSpd / 2);
                
                const move = action.type === 'attack' ? char.moves[action.moveIdx] : null;
                const priority = (action.type === 'switch' || action.type === 'use_item') ? 6 : (move ? (move.priority || 0) : 0);

                turnQueue.push({ player, charTeamIdx, char, effSpd, action, priority, move });
              });
            });

            turnQueue.sort((a, b) => b.priority - a.priority || b.effSpd - a.effSpd);

            for (let order of turnQueue) {
              const { player, charTeamIdx, action, move } = order;
              const attacker = workingTeams[player][charTeamIdx];
              
              if (attacker.hp <= 0 && action.type !== 'use_item') continue; 

              // AGGIORNAMENTO STATISTICHE: Mossa usata
              if (gameState.players[player] === playerName && action.type === 'attack' && move) {
                  updateLocalStats({ move: move.name });
              }

              if (action.type === 'use_item') {
                  const itemId = action.itemId;
                  const itemDef = ITEMS_DB[itemId];
                  
                  if (workingInventory[player][itemId] > 0) {
                      workingInventory[player][itemId] -= 1;
                      
                      if (itemDef.type === 'revive') {
                          // Trova il primo alleato morto
                          const deadAllyIdx = workingTeams[player].findIndex(c => c.hp <= 0 && !c.isSummonOnly);
                          if (deadAllyIdx !== -1) {
                              let ally = workingTeams[player][deadAllyIdx];
                              const healAmount = Math.floor(ally.maxHp * itemDef.value);
                              ally.hp = healAmount;
                              ally.statuses = [];
                              events.push({ type: 'damage', text: `${gameState.players[player]} usa ${itemDef.name}! ${ally.name} è tornato in vita!`, targetPlayer: player, targetIdx: deadAllyIdx, newHp: ally.hp });
                          } else {
                              events.push({ type: 'text', text: `${gameState.players[player]} prova a usare ${itemDef.name}, ma non ci sono alleati da rianimare! (L'oggetto è stato consumato)` });
                          }
                      } else {
                          // Oggetti che bersagliano il personaggio attivo
                          if (attacker.hp <= 0) {
                              events.push({ type: 'text', text: `${gameState.players[player]} prova a usare ${itemDef.name}, ma ${attacker.name} è esausto!` });
                              continue;
                          }
                          
                          if (itemDef.type === 'heal') {
                              const healAmount = Math.floor(attacker.maxHp * itemDef.value);
                              attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmount);
                              events.push({ type: 'damage', text: `${gameState.players[player]} usa ${itemDef.name} su ${attacker.name}! Recupera PS.`, targetPlayer: player, targetIdx: charTeamIdx, newHp: attacker.hp });
                          } else if (itemDef.type === 'buff') {
                              if (itemDef.stat === 'atk') attacker.atk = Math.floor(attacker.atk * itemDef.value);
                              if (itemDef.stat === 'def') attacker.def = Math.floor(attacker.def * itemDef.value);
                              if (itemDef.stat === 'spd') attacker.spd = Math.floor(attacker.spd * itemDef.value);
                              events.push({ type: 'text', text: `${gameState.players[player]} usa ${itemDef.name}! Le statistiche di ${attacker.name} aumentano.` });
                          } else if (itemDef.type === 'heal_status') {
                              const negatives = ['Avvelenato', 'Scottato', 'Elettrizzato', 'Congelato', 'Addormentato', 'Confuso', 'Indebolito', 'Stordito'];
                              attacker.statuses = attacker.statuses.filter(s => !negatives.includes(s.type));
                              updateStatusUI(player, charTeamIdx);
                              events.push({ type: 'text', text: `${gameState.players[player]} usa ${itemDef.name}! Gli status di ${attacker.name} sono curati.` });
                          }
                      }
                  }
                  continue;
              }

              if (action.type === 'switch') {
                  const fieldPos = workingField[player].indexOf(charTeamIdx);
                  if (fieldPos !== -1) {
                      attacker.atk = attacker.baseAtk;
                      attacker.def = attacker.baseDef;
                      attacker.spd = attacker.baseSpd;
                      attacker.consecutiveProtect = 0;

                      workingField[player][fieldPos] = action.toIdx;
                      events.push({ type: 'switch', player, pos: fieldPos, newIdx: action.toIdx, text: `${gameState.players[player]} ritira ${attacker.name} e manda in campo ${workingTeams[player][action.toIdx].name}!` });
                  }
                  continue;
              }

              let canAttack = true;

              let stunIdx = attacker.statuses.findIndex(s => s.type === 'Stordito');
              if (stunIdx !== -1) {
                  attacker.statuses[stunIdx].turns -= 1;
                  events.push({ type: 'text', text: `${attacker.name} è stordito e salta il turno!` });
                  if (attacker.statuses[stunIdx].turns <= 0) {
                      attacker.statuses.splice(stunIdx, 1);
                  }
                  updateStatusUI(player, charTeamIdx);
                  canAttack = false;
              }

              if (!canAttack) continue;

              let ricIdx = attacker.statuses.findIndex(s => s.type === 'Ricarica');
              if (ricIdx !== -1) {
                  events.push({ type: 'text', text: `${attacker.name} deve ricaricarsi dopo l'ultimo attacco!` });
                  attacker.statuses.splice(ricIdx, 1);
                  updateStatusUI(player, charTeamIdx);
                  canAttack = false;
              }

              if (!canAttack) continue;

              let sleepIdx = attacker.statuses.findIndex(s => s.type === 'Addormentato');
              if (sleepIdx !== -1) {
                  attacker.statuses[sleepIdx].turns -= 1;
                  if (attacker.statuses[sleepIdx].turns > 0) {
                      events.push({ type: 'text', text: `${attacker.name} dorme profondamente e non può attaccare...` });
                      updateStatusUI(player, charTeamIdx);
                      canAttack = false;
                  } else {
                      events.push({ type: 'text', text: `${attacker.name} si è svegliato!` });
                      attacker.statuses.splice(sleepIdx, 1);
                      updateStatusUI(player, charTeamIdx);
                  }
              }

              if (!canAttack) continue;

              let frozenIdx = attacker.statuses.findIndex(s => s.type === 'Congelato');
              if (frozenIdx !== -1) {
                  if (Math.random() < 0.5) {
                      applyDamage(attacker, 3, player, charTeamIdx, `${attacker.name} è congelato! Subisce 3 danni dal freddo.`);
                      canAttack = false;
                  } else {
                      events.push({ type: 'text', text: `${attacker.name} rompe il ghiaccio e si libera!` });
                      attacker.statuses.splice(frozenIdx, 1);
                      updateStatusUI(player, charTeamIdx);
                  }
              }

              if (!canAttack || attacker.hp <= 0) continue;

              if (attacker.statuses.some(s => s.type === 'Elettrizzato')) {
                  if (Math.random() < 0.3) {
                      events.push({ type: 'text', text: `${attacker.name} è paralizzato dall'elettricità!` });
                      canAttack = false;
                  }
              }

              if (!canAttack) continue;

              if (attacker.statuses.some(s => s.type === 'Infatuato')) {
                  if (Math.random() < 0.5) {
                      events.push({ type: 'text', text: `${attacker.name} è troppo infatuato e manca il bersaglio!` });
                      canAttack = false; 
                  }
              }

              if (!canAttack) continue;

              let confIdx = attacker.statuses.findIndex(s => s.type === 'Confuso');
              if (confIdx !== -1) {
                  if (Math.random() < 0.25) {
                      events.push({ type: 'text', text: `${attacker.name} non è più confuso!` });
                      attacker.statuses.splice(confIdx, 1);
                      updateStatusUI(player, charTeamIdx);
                  } else {
                      events.push({ type: 'text', text: `${attacker.name} è confuso!` });
                      if (Math.random() < 0.4) {
                          const pwr = (move && move.power > 0) ? move.power : 40;
                          const baseDmg = ((2 * 50 / 5 + 2) * pwr * (attacker.atk / attacker.def)) / 50 + 2;
                          const selfDmg = Math.max(1, Math.floor(baseDmg * 0.25));
                          
                          applyDamage(attacker, selfDmg, player, charTeamIdx, `${attacker.name} si colpisce da solo nella confusione! Infligge ${selfDmg} danni a se stesso.`);
                          canAttack = false;
                      }
                  }
              }

              if (!canAttack || attacker.hp <= 0) continue;

              if (action.type === 'attack' && move) {
                if (move.remainingUses !== null && move.remainingUses !== undefined) {
                    move.remainingUses -= 1;
                }

                if (move.isProtect) {
                    let consec = attacker.consecutiveProtect || 0;
                    let successChance = 1 / Math.pow(2, consec); 
                    if (Math.random() < successChance) {
                        let pStatus = move.protectStatus || 'Protetto';
                        attacker.statuses.push({ type: pStatus, turns: 1 });
                        events.push({ type: 'text', text: `${attacker.name} assume una posizione difensiva e si protegge!` });
                        updateStatusUI(player, charTeamIdx);
                        attacker.consecutiveProtect = consec + 1;
                    } else {
                        events.push({ type: 'text', text: `${attacker.name} usa ${move.name}, ma la protezione fallisce!` });
                        attacker.consecutiveProtect = 0;
                    }
                    continue;
                } else {
                    attacker.consecutiveProtect = 0; 
                }

                if (move.isSummon) {
                    const summonIds = Array.isArray(move.isSummon) ? move.isSummon : [move.isSummon];
                    let summonedNames = [];
                    
                    summonIds.forEach(summonId => {
                        const baseChar = CHARACTERS.find(c => c.id === summonId);
                        if (baseChar) {
                            const newSummon = {
                                ...JSON.parse(JSON.stringify(baseChar)), 
                                statuses: [],
                                consecutiveProtect: 0,
                                baseAtk: baseChar.atk,
                                baseDef: baseChar.def,
                                baseSpd: baseChar.spd
                            };
                            newSummon.moves.forEach(m => {
                                if (m.maxUses !== undefined) m.remainingUses = m.maxUses;
                            });

                            workingTeams[player].push(newSummon);
                            const newCharTeamIdx = workingTeams[player].length - 1;
                            workingField[player].push(newCharTeamIdx);
                            
                            summonedNames.push(newSummon.name);
                            events.push({ type: 'summon', text: `${attacker.name} ha evocato ${newSummon.name}!`, player: player, newChar: newSummon, fieldIdx: newCharTeamIdx });
                        }
                    });
                    
                    if (summonedNames.length > 1) {
                         // Modifica il testo se sono state fatte evocazioni multiple per renderlo più leggibile
                         events[events.length - 1].text = `${attacker.name} ha evocato ${summonedNames.join(' e ')}!`;
                    }
                    continue;
                }

                if (move.accuracy && Math.random() > move.accuracy) {
                    events.push({ type: 'text', text: `${attacker.name} usa ${move.name}, ma manca clamorosamente il bersaglio!` });
                    continue;
                }

                if (move.target === 'self') {
                    let text = `${attacker.name} usa ${move.name}!`;
                    let didSomething = false;
                    
                    if (move.heal) {
                        const healAmount = Math.floor(attacker.maxHp * move.heal);
                        attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmount);
                        text += ` Recupera ${healAmount} HP!`;
                        events.push({ type: 'damage', text, targetPlayer: player, targetIdx: charTeamIdx, newHp: attacker.hp });
                        didSomething = true;
                    } 
                    if (move.statBuff || move.targetStatBuff) {
                        const buff = move.statBuff || move.targetStatBuff;
                        let statTexts = [];
                        if (buff.atk) { attacker.atk = Math.floor(attacker.atk * buff.atk); statTexts.push("Attacco"); }
                        if (buff.def) { attacker.def = Math.floor(attacker.def * buff.def); statTexts.push("Difesa"); }
                        if (buff.spd) { attacker.spd = Math.floor(attacker.spd * buff.spd); statTexts.push("Velocità"); }
                        if (statTexts.length > 0) {
                            text += ` Aumenta ${statTexts.join(" e ")}!`;
                            events.push({ type: 'text', text });
                            didSomething = true;
                        }
                    }
                    if (move.statusEffect) {
                        attacker.statuses.push({ type: move.statusEffect.type, turns: move.statusEffect.turns || 1 });
                        updateStatusUI(player, charTeamIdx);
                        events.push({ type: 'text', text: `${attacker.name} ottiene lo status ${move.statusEffect.type}!` });
                        didSomething = true;
                    }
                    if (!didSomething) events.push({ type: 'text', text });
                    continue;
                }

                if (move.targetMode === 'team') {
                    const aliveAllies = workingField[player].filter(idx => workingTeams[player][idx].hp > 0);
                    events.push({ type: 'text', text: `${attacker.name} usa ${move.name} su tutto il team!` });
                    for (let aIdx of aliveAllies) {
                        let ally = workingTeams[player][aIdx];
                        let didSomething = false;
                        
                        if (move.statusEffect) {
                            const existingIdx = ally.statuses.findIndex(s => s.type === move.statusEffect.type);
                            if(existingIdx === -1) {
                                ally.statuses.push({ type: move.statusEffect.type, turns: move.statusEffect.turns || 1 });
                            } else {
                                ally.statuses[existingIdx].turns = move.statusEffect.turns || 1;
                            }
                            updateStatusUI(player, aIdx);
                            events.push({ type: 'text', text: `${ally.name} ottiene lo status ${move.statusEffect.type}!` });
                            didSomething = true;
                        }
                        if (move.removeNegativeStatuses) {
                            const negatives = ['Avvelenato', 'Scottato', 'Elettrizzato', 'Congelato', 'Addormentato', 'Confuso', 'Indebolito', 'Stordito'];
                            const filtered = ally.statuses.filter(s => !negatives.includes(s.type));
                            if (filtered.length < ally.statuses.length) {
                                ally.statuses = filtered;
                                updateStatusUI(player, aIdx);
                                events.push({ type: 'text', text: `Gli status negativi di ${ally.name} svaniscono!` });
                                didSomething = true;
                            }
                        }
                    }
                    continue;
                }

                if (move.targetMode === 'team_smart_heal') {
                    const aliveAllies = workingField[player].filter(idx => workingTeams[player][idx].hp > 0);
                    if (aliveAllies.length > 1) {
                        for (let aIdx of aliveAllies) {
                            let ally = workingTeams[player][aIdx];
                            const healAmount = Math.floor(ally.maxHp * move.healTeam);
                            ally.hp = Math.min(ally.maxHp, ally.hp + healAmount);
                            events.push({ type: 'damage', text: `${attacker.name} usa ${move.name} e cura ${ally.name} di ${healAmount} HP!`, targetPlayer: player, targetIdx: aIdx, newHp: ally.hp });
                        }
                    } else {
                        const healAmount = Math.floor(attacker.maxHp * move.healAlone);
                        attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmount);
                        events.push({ type: 'damage', text: `${attacker.name} usa ${move.name} e recupera ${healAmount} HP!`, targetPlayer: player, targetIdx: charTeamIdx, newHp: attacker.hp });
                    }
                    continue;
                }

                if (move.targetMode === 'ally') {
                    let targetPlayer = action.targetPlayer;
                    let targetIdx = action.targetIdx;
                    let target = workingTeams[targetPlayer]?.[targetIdx];

                    if (!target || target.hp <= 0) {
                       events.push({ type: 'text', text: `${attacker.name} prova ad usare ${move.name}, ma il bersaglio non c'è più!` });
                       continue;
                    }

                    if (move.specificAlly && target.name !== move.specificAlly) {
                        events.push({ type: 'text', text: `${attacker.name} usa ${move.name}, ma non ha effetto su ${target.name}!` });
                        continue;
                    }

                    let text = `${attacker.name} usa ${move.name} su ${target.name}!`;
                    let didSomething = false;

                    if (move.healFlat) {
                        target.hp = Math.min(target.maxHp, target.hp + move.healFlat);
                        events.push({ type: 'damage', text: `${text} Lo cura di ${move.healFlat} HP!`, targetPlayer, targetIdx, newHp: target.hp });
                        didSomething = true;
                    }
                    if (move.heal) {
                        const healAmount = Math.floor(target.maxHp * move.heal);
                        target.hp = Math.min(target.maxHp, target.hp + healAmount);
                        events.push({ type: 'damage', text: `${text} Lo cura di ${healAmount} HP!`, targetPlayer, targetIdx, newHp: target.hp });
                        didSomething = true;
                    }
                    if (move.targetStatBuff) {
                        let statTexts = [];
                        if (move.targetStatBuff.atk) { target.atk = Math.floor(target.atk * move.targetStatBuff.atk); statTexts.push("Attacco"); }
                        if (move.targetStatBuff.def) { target.def = Math.floor(target.def * move.targetStatBuff.def); statTexts.push("Difesa"); }
                        if (move.targetStatBuff.spd) { target.spd = Math.floor(target.spd * move.targetStatBuff.spd); statTexts.push("Velocità"); }
                        events.push({ type: 'text', text: `${text} Aumenta ${statTexts.join(" e ")} di ${target.name}!` });
                        didSomething = true;
                    }
                    if (move.removeNegativeStatuses) {
                        const negatives = ['Avvelenato', 'Scottato', 'Elettrizzato', 'Congelato', 'Addormentato', 'Confuso', 'Indebolito', 'Stordito'];
                        const filtered = target.statuses.filter(s => !negatives.includes(s.type));
                        if (filtered.length < target.statuses.length) {
                            target.statuses = filtered;
                            events.push({ type: 'text', text: `Gli status negativi di ${target.name} svaniscono!` });
                            didSomething = true;
                            updateStatusUI(targetPlayer, targetIdx);
                        }
                    }
                    
                    if (!didSomething) {
                        events.push({ type: 'text', text: text });
                    }
                    continue;
                }

                if (move.targetMode === 'revive') {
                    const deadAllyIdx = workingTeams[player].findIndex(c => c.hp <= 0 && !c.isSummonOnly);
                    if (deadAllyIdx !== -1) {
                        let ally = workingTeams[player][deadAllyIdx];
                        const healAmount = Math.floor(ally.maxHp * move.heal);
                        ally.hp = healAmount;
                        ally.statuses = [];
                        events.push({ type: 'damage', text: `${attacker.name} usa ${move.name}! ${ally.name} è tornato in vita con ${healAmount} HP!`, targetPlayer: player, targetIdx: deadAllyIdx, newHp: ally.hp });
                    } else {
                        events.push({ type: 'text', text: `${attacker.name} usa ${move.name}, ma non ci sono alleati da rianimare!` });
                    }
                    continue;
                }

                let resolvedTargets = [];

                // GESTIONE NUOVI BERSAGLI MULTIPLI AUTOMATICI
                if (action.autoTargetCount) {
                    resolvedTargets = [];
                    let enemyTeams = [];
                    
                    if (gameState.gameMode === 'multipla') {
                        enemyTeams = ['p1', 'p2'].includes(player) ? ['p3', 'p4'] : ['p1', 'p2'];
                    } else if (gameState.gameMode === 'torneo') {
                        enemyTeams = [activeMatchPlayers.find(p => p !== player)];
                    } else {
                        enemyTeams = [player === 'p1' ? 'p2' : 'p1'];
                    }

                    let possibleTargets = [];
                    enemyTeams.forEach(ePlayer => {
                        if (ePlayer && workingField[ePlayer]) {
                            workingField[ePlayer].forEach((eIdx, eFieldIdx) => {
                                const eChar = workingTeams[ePlayer][eIdx];
                                if (eChar && eChar.hp > 0) {
                                    possibleTargets.push({ player: ePlayer, idx: eIdx, fieldIdx: eFieldIdx, char: eChar });
                                }
                            });
                        }
                    });

                    // Seleziona un numero di bersagli a caso pari a autoTargetCount
                    for(let i=0; i<action.autoTargetCount && possibleTargets.length > 0; i++) {
                        const randIdx = Math.floor(Math.random() * possibleTargets.length);
                        resolvedTargets.push(possibleTargets.splice(randIdx, 1)[0]);
                    }

                } else if (action.targetPlayer && action.targetIdx !== undefined) {
                    resolvedTargets.push({ 
                        player: action.targetPlayer, 
                        idx: action.targetIdx, 
                        fieldIdx: action.targetFieldIdx, 
                        char: workingTeams[action.targetPlayer][action.targetIdx] 
                    });
                }

                let attackSucceeded = false;

                for (let t of resolvedTargets) {
                    if (t.char.hp <= 0) continue;

                    // Protezione
                    if (t.char.statuses.some(s => s.type === 'Protetto' || s.type === 'Rashield') && !move.ignoreDefBuffs && move.power > 0) {
                        if (t.char.statuses.some(s => s.type === 'Rashield')) {
                            events.push({ type: 'text', text: `${attacker.name} usa ${move.name} su ${t.char.name}, ma si protegge e riflette il danno!` });
                            let pwr = move.power;
                            if (move.speedScaling) pwr += Math.floor(attacker.spd / 3);
                            let defValue = t.char.baseDef;
                            const baseDamage = ((2 * 50 / 5 + 2) * pwr * (attacker.atk / defValue)) / 50 + 2;
                            const reflectDmg = Math.max(1, Math.floor(baseDamage * 0.25));
                            if (reflectDmg > 0) {
                                applyDamage(attacker, reflectDmg, player, charTeamIdx, `${attacker.name} subisce ${reflectDmg} danni di riflesso!`);
                            }
                        } else {
                            events.push({ type: 'text', text: `${attacker.name} usa ${move.name} su ${t.char.name}, ma si protegge dai danni!` });
                        }
                        continue;
                    }

                    let isMagnetic = false;
                    if (move.type === 'Elettro') {
                        const magIdx = t.char.statuses.findIndex(s => s.type === 'Magnetico');
                        if (magIdx !== -1) {
                            isMagnetic = true;
                            t.char.statuses.splice(magIdx, 1);
                            updateStatusUI(t.player, t.idx);
                        }
                    }

                    const multiplier = getMultiplier(move.type, t.char.types);
                    
                    let effectivenessText = "";
                    if (multiplier > 1) effectivenessText = " È superefficace!";
                    if (multiplier > 0 && multiplier < 1) effectivenessText = " Non è molto efficace...";
                    if (multiplier === 0) effectivenessText = " Non ha alcun effetto!";
                    
                    if (multiplier === 0) {
                        events.push({ type: 'text', text: `${attacker.name} usa ${move.name} su ${t.char.name}!${effectivenessText}` });
                        continue;
                    }

                    if (move.power > 0) {
                        let hits = 1;
                        if (move.multiHit) {
                            hits = Math.floor(Math.random() * (move.multiHit.max - move.multiHit.min + 1)) + move.multiHit.min;
                        }

                        let totalDmg = 0;
                        let actualHits = 0;
                        for (let i = 0; i < hits; i++) {
                            let hitDmg = calculateDamage(attacker, t.char, move, multiplier);
                            if (isMagnetic) hitDmg *= 2;
                            totalDmg += hitDmg;
                            actualHits++;
                            if (t.char.hp - totalDmg <= 0) break;
                        }

                        attackSucceeded = true;

                        let hitText = hits > 1 ? ` Colpisce ${actualHits} volte!` : '';
                        let magText = isMagnetic ? ` Lo stato Magnetico raddoppia i danni!` : '';
                        applyDamage(t.char, totalDmg, t.player, t.idx, `${attacker.name} usa ${move.name} su ${t.char.name}!${effectivenessText}${hitText}${magText} Infligge ${totalDmg} danni.`);
                        
                        // Riflesso Danno
                        if (t.char.statuses.some(s => s.type === 'Riflesso') && totalDmg > 0 && attacker.hp > 0 && !move.ignoreDefBuffs) {
                            let recoil = Math.max(1, Math.floor(totalDmg * 0.3));
                            applyDamage(attacker, recoil, player, charTeamIdx, `${t.char.name} respinge l'attacco! ${attacker.name} subisce ${recoil} danni di riflesso!`);
                        }

                        if (move.drain && totalDmg > 0 && attacker.hp > 0) {
                            const healAmount = Math.max(1, Math.floor(totalDmg * move.drain));
                            attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmount);
                            events.push({ type: 'damage', text: `${attacker.name} assorbe energia e recupera ${healAmount} HP!`, targetPlayer: player, targetIdx: charTeamIdx, newHp: attacker.hp });
                        }

                        if (move.targetStatDebuff && t.char.hp > 0) {
                            let statTexts = [];
                            if (move.targetStatDebuff.atk) { t.char.atk = Math.floor(t.char.atk * move.targetStatDebuff.atk); statTexts.push("Attacco"); }
                            if (move.targetStatDebuff.def) { t.char.def = Math.floor(t.char.def * move.targetStatDebuff.def); statTexts.push("Difesa"); }
                            if (move.targetStatDebuff.spd) { t.char.spd = Math.floor(t.char.spd * move.targetStatDebuff.spd); statTexts.push("Velocità"); }
                            if (statTexts.length > 0) {
                                events.push({ type: 'text', text: `${statTexts.join(" e ")} di ${t.char.name} diminuisce!` });
                            }
                        }
                    } else {
                        attackSucceeded = true;
                        events.push({ type: 'text', text: `${attacker.name} usa ${move.name} su ${t.char.name}!` });
                        
                        if (move.targetStatDebuff && t.char.hp > 0) {
                            let statTexts = [];
                            if (move.targetStatDebuff.atk) { t.char.atk = Math.floor(t.char.atk * move.targetStatDebuff.atk); statTexts.push("Attacco"); }
                            if (move.targetStatDebuff.def) { t.char.def = Math.floor(t.char.def * move.targetStatDebuff.def); statTexts.push("Difesa"); }
                            if (move.targetStatDebuff.spd) { t.char.spd = Math.floor(t.char.spd * move.targetStatDebuff.spd); statTexts.push("Velocità"); }
                            if (statTexts.length > 0) {
                                events.push({ type: 'text', text: `${statTexts.join(" e ")} di ${t.char.name} diminuisce!` });
                            }
                        }
                    }

                    if (t.char.hp > 0) {
                        let effects = move.statusEffects || (move.statusEffect ? [move.statusEffect] : []);
                        for (let effect of effects) {
                            if (Math.random() < effect.chance) {
                                const existingIdx = t.char.statuses.findIndex(s => s.type === effect.type);
                                let turns = effect.turns || 1;
                                if (effect.type === 'Addormentato' && !effect.turns) turns = Math.floor(Math.random() * 3) + 2;
                                if (existingIdx === -1) {
                                    t.char.statuses.push({ type: effect.type, turns: turns });
                                    updateStatusUI(t.player, t.idx);
                                    events.push({ type: 'text', text: `${t.char.name} è ${effect.type === 'Addormentato' ? 'caduto addormentato' : 'stato ' + effect.type.toLowerCase()}!` });
                                } else {
                                    t.char.statuses[existingIdx].turns = turns;
                                    events.push({ type: 'text', text: `Lo status ${effect.type} di ${t.char.name} è stato ripristinato!` });
                                }
                            }
                        }
                    }
                }
                
                if (attackSucceeded && move.selfStatBuff && attacker.hp > 0) {
                    let statTexts = [];
                    if (move.selfStatBuff.spd) { attacker.spd = Math.floor(attacker.spd * move.selfStatBuff.spd); statTexts.push("Velocità"); }
                    if (statTexts.length > 0) {
                        events.push({ type: 'text', text: `La ${statTexts.join(" e ")} di ${attacker.name} aumenta per via dell'attacco!` });
                    }
                }

                if (attackSucceeded && move.selfHeal && attacker.hp > 0) {
                    const healAmount = Math.floor(attacker.maxHp * move.selfHeal);
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmount);
                    events.push({ type: 'damage', text: `${attacker.name} assorbe energia vitale e recupera ${healAmount} HP!`, targetPlayer: player, targetIdx: charTeamIdx, newHp: attacker.hp });
                }

                if (move.recharge && attackSucceeded && attacker.hp > 0) {
                    attacker.statuses.push({ type: 'Ricarica', turns: 1 });
                    updateStatusUI(player, charTeamIdx);
                }
            }
        } // Fine ciclo coda dei turni

        let eotTargets = [];
        activeMatchPlayers.forEach(p => {
            workingField[p].forEach(idx => eotTargets.push({ player: p, charTeamIdx: idx }));
        });

        for (let target of eotTargets) {
            let char = workingTeams[target.player]?.[target.charTeamIdx];
            if (!char || char.hp <= 0 || !char.statuses) continue;

            let shieldIdx = char.statuses.findIndex(s => s.type === 'Scudo Team');
            if (shieldIdx !== -1) {
                char.statuses[shieldIdx].turns -= 1;
                if (char.statuses[shieldIdx].turns <= 0) {
                    char.statuses.splice(shieldIdx, 1);
                    updateStatusUI(target.player, target.charTeamIdx);
                    events.push({ type: 'text', text: `Lo Scudo protettivo su ${char.name} svanisce!` });
                }
            }

            let protIdx = char.statuses.findIndex(s => s.type === 'Protetto');
            if (protIdx !== -1) {
                char.statuses.splice(protIdx, 1);
                updateStatusUI(target.player, target.charTeamIdx);
            }

            let rashieldIdx = char.statuses.findIndex(s => s.type === 'Rashield');
            if (rashieldIdx !== -1) {
                char.statuses.splice(rashieldIdx, 1);
                updateStatusUI(target.player, target.charTeamIdx);
            }

            let rifIdx = char.statuses.findIndex(s => s.type === 'Riflesso');
            if (rifIdx !== -1) {
                char.statuses[rifIdx].turns -= 1;
                if (char.statuses[rifIdx].turns <= 0) {
                    char.statuses.splice(rifIdx, 1);
                    updateStatusUI(target.player, target.charTeamIdx);
                    events.push({ type: 'text', text: `La barriera di vento di ${char.name} svanisce!` });
                }
            }

            let indebIdx = char.statuses.findIndex(s => s.type === 'Indebolito');
            if (indebIdx !== -1) {
                char.statuses[indebIdx].turns -= 1;
                if (char.statuses[indebIdx].turns <= 0) {
                    char.statuses.splice(indebIdx, 1);
                    updateStatusUI(target.player, target.charTeamIdx);
                    events.push({ type: 'text', text: `${char.name} non è più indebolito!` });
                }
            }

            let burnIdx = char.statuses.findIndex(s => s.type === 'Scottato');
            if (burnIdx !== -1) { 
                const burnDmg = Math.max(5, Math.floor(char.maxHp * 0.10)); // 10% degli HP Max
                applyDamage(char, burnDmg, target.player, target.charTeamIdx, `${char.name} subisce ${burnDmg} danni dalla scottatura!`); 
            }
            if (char.hp <= 0) continue;

            let psnIdx = char.statuses.findIndex(s => s.type === 'Avvelenato');
            if (psnIdx !== -1) {
                const turnsActive = char.statuses[psnIdx].turns;
                const percentage = Math.min(0.25, 0.05 * turnsActive); // 5%, 10%, 15%, max 25%
                const psnDmg = Math.max(5, Math.floor(char.maxHp * percentage));
                
                applyDamage(char, psnDmg, target.player, target.charTeamIdx, `${char.name} subisce ${psnDmg} danni a causa del veleno!`);
                char.statuses[psnIdx].turns += 1;
                updateStatusUI(target.player, target.charTeamIdx);
            }
        }

        let nextStatus = 'battling';
        let winner = null;
        let tResults = { ...gameState.tournamentResults };
        let newScores = { ...gameState.playerScores };

        if (gameState.gameMode === 'multipla') {
            const team1Alive = workingTeams.p1.some(c=>c.hp>0) || workingTeams.p2.some(c=>c.hp>0);
            const team2Alive = workingTeams.p3.some(c=>c.hp>0) || workingTeams.p4.some(c=>c.hp>0);
            if (!team1Alive && !team2Alive) { nextStatus = 'gameover'; winner = 'Pareggio'; }
            else if (!team1Alive) { nextStatus = 'gameover'; winner = `${gameState.players.p3} & ${gameState.players.p4}`; }
            else if (!team2Alive) { nextStatus = 'gameover'; winner = `${gameState.players.p1} & ${gameState.players.p2}`; }
        } 
        else if (gameState.gameMode === 'classica') {
            const p1Alive = workingTeams.p1.some(c=>c.hp>0);
            const p2Alive = workingTeams.p2.some(c=>c.hp>0);
            if (!p1Alive && !p2Alive) { nextStatus = 'gameover'; winner = 'Pareggio'; }
            else if (!p1Alive) { nextStatus = 'gameover'; winner = gameState.players.p2; }
            else if (!p2Alive) { nextStatus = 'gameover'; winner = gameState.players.p1; }
        }
        else if (gameState.gameMode === 'torneo') {
            const pA = activeMatchPlayers[0];
            const pB = activeMatchPlayers[1];
            const pA_Alive = workingTeams[pA].some(c=>c.hp>0);
            const pB_Alive = workingTeams[pB].some(c=>c.hp>0);
            
            if (!pA_Alive || !pB_Alive) {
                const mWinner = pA_Alive ? pA : (pB_Alive ? pB : 'Draw(P1_default)');
                const mLoser = pA_Alive ? pB : (pB_Alive ? pA : 'Draw(P2_default)');
                
                tResults[gameState.tournamentMatch] = { winner: mWinner, loser: mLoser };
                
                if (gameState.tournamentMatch === 'final') {
                    nextStatus = 'gameover';
                    winner = gameState.players[mWinner];
                } else {
                    nextStatus = 'intermission';
                }
            }
        }
        else if (gameState.gameMode === 'torneo_punti') {
            const pA = activeMatchPlayers[0];
            const pB = activeMatchPlayers[1];
            const pA_Alive = workingTeams[pA].some(c=>c.hp>0);
            const pB_Alive = workingTeams[pB].some(c=>c.hp>0);
            
            if (!pA_Alive || !pB_Alive) {
                if (pA_Alive) newScores[pA] += 1;
                else if (pB_Alive) newScores[pB] += 1;
                
                if (gameState.currentMatchIdx >= gameState.roundRobinMatches.length - 1) {
                    nextStatus = 'gameover';
                    let maxScore = -1;
                    let bestP = null;
                    Object.keys(newScores).forEach(p => {
                        if (gameState.players[p] && newScores[p] > maxScore) {
                            maxScore = newScores[p];
                            bestP = p;
                        }
                    });
                    winner = gameState.players[bestP];
                } else {
                    nextStatus = 'intermission';
                }
            }
        }

        let pendingSwitches = { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0, p7: 0, p8: 0 };
        let hasPendingSwitches = false;

        if (nextStatus !== 'gameover' && nextStatus !== 'intermission') {
            activeMatchPlayers.forEach(p => {
                 const mainCharsOnField = workingField[p].filter(idx => !workingTeams[p][idx].isSummonOnly).length;
                 const aliveBench = workingTeams[p].filter((c, i) => c.hp > 0 && !workingField[p].includes(i) && !c.isSummonOnly).length;
                 
                 let targetFieldSize = gameState.settings.fieldSize;
                 if (gameState.gameMode === 'multipla') targetFieldSize = 1;
                 
                 const missing = targetFieldSize - mainCharsOnField;
                 if (missing > 0 && aliveBench > 0) {
                     pendingSwitches[p] = Math.min(missing, aliveBench);
                     hasPendingSwitches = true;
                 }
            });

            if (hasPendingSwitches) {
                nextStatus = 'switching_phase';
            }
        }

        // AGGIORNAMENTO STATISTICHE DI FINE PARTITA
        if (nextStatus === 'gameover' && playerName.trim()) {
            if (matchStartTimeRef.current) {
                const playTimeSecs = Math.floor((Date.now() - matchStartTimeRef.current) / 1000);
                updateLocalStats({ playtime: playTimeSecs });
            }
            
            // Salva l'inventario rimasto a fine partita
            const myKey = Object.keys(gameState.players).find(k => gameState.players[k] === playerName);
            if (myKey && workingInventory[myKey]) {
                updateLocalStats({ overwriteInventory: workingInventory[myKey] });
            }

            // Controllo Vittoria e Ricompensa Monete
            if (myKey) {
                let coinsToReward = 0;
                let won = false;

                if (gameState.gameMode === 'torneo') {
                    if (tResults.final && tResults.final.winner === myKey) { coinsToReward = 200; won = true; }
                    else if (tResults.final && tResults.final.loser === myKey) { coinsToReward = 100; }
                    else if (tResults.bronze && tResults.bronze.winner === myKey) { coinsToReward = 70; }
                    else if (tResults.bronze && tResults.bronze.loser === myKey) { coinsToReward = 50; }
                    else { coinsToReward = 50; }
                } else {
                    if (gameState.gameMode === 'multipla') {
                         if (winner && winner.includes(playerName)) won = true;
                    } else if (winner === playerName) {
                         won = true;
                    }
                    coinsToReward = won ? 100 : 50;
                }
                
                // CALCOLO BONUS TEAM SIZE
                const teamSizeBonus = Math.max(0, (gameState.settings.teamSize - 4) * 5);
                coinsToReward += teamSizeBonus;

                if (won) {
                     updateLocalStats({ win: true });
                }
                if (coinsToReward > 0) {
                     updateLocalStats({ addCoins: coinsToReward });
                }
            }
        }

        updateState({
          status: 'executing', 
          postExecStatus: nextStatus,
          winner,
          teams: workingTeams,
          field: workingField,
          startOfTurnTeams: startOfTurnTeams, // Mantiene i dati intatti per la suspense!
          startOfTurnField: startOfTurnField,
          events: events,
          actions: { p1: {}, p2: {}, p3: {}, p4: {}, p5: {}, p6: {}, p7: {}, p8: {} },
          inventory: workingInventory,
          pendingSwitches: pendingSwitches,
          switchActions: { p1: [], p2: [], p3: [], p4: {}, p5: [], p6: [], p7: [], p8: [] },
          tournamentResults: tResults,
          playerScores: newScores
        });
    };

    const handleNextTournamentMatch = () => {
        let healedTeams = JSON.parse(JSON.stringify(gameState.teams));
        ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].forEach(p => {
            if (healedTeams[p]) {
                healedTeams[p].forEach(char => {
                    char.hp = char.maxHp;
                    char.statuses = [];
                    char.consecutiveProtect = 0;
                    char.atk = char.baseAtk;
                    char.def = char.baseDef;
                    char.spd = char.baseSpd;
                    char.moves.forEach(m => {
                        if (m.maxUses !== undefined) m.remainingUses = m.maxUses;
                    });
                });
            }
        });

        if (gameState.gameMode === 'torneo_punti') {
            const nextIdx = gameState.currentMatchIdx + 1;
            const nextMatch = gameState.roundRobinMatches[nextIdx];
            
            let newField = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [], p8: [] };
            [nextMatch.pA, nextMatch.pB].forEach(p => {
                newField[p] = healedTeams[p].slice(0, gameState.settings.fieldSize).map((_, i) => i);
            });

            updateState({
                status: 'pre_battle', 
                currentMatchIdx: nextIdx,
