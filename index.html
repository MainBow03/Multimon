                         }} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:-translate-y-0.5 mb-3">
                             <BookOpen size={20}/> Campagna: Crisi del Varco
                         </button>
                         <button onClick={handleVsCpuStart} className="w-full mb-3 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:-translate-y-0.5">
                             <Target size={20}/> Gioca vs CPU (Bot IA)
                        </button>
                         <button onClick={handleLocalStart} className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5">
                             <Users size={20}/> Gioca in Locale (Stesso PC)
                        </button>
                        <div className="grid grid-cols-2 gap-3 mt-4">
                            <button onClick={() => setAppMode('catalog')} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <BookOpen size={20}/> Catalogo
                            </button>
                            <button onClick={() => setAppMode('type_chart')} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <GridIcon size={20}/> Tabella Tipi
                            </button>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mt-3">
                            <button onClick={() => { if(!playerName.trim()) setSystemAlert("Inserisci il tuo nome per usare lo Shop!"); else setAppMode('shop'); }} className="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <ShoppingCart size={20}/> Negozio
                            </button>
                            <button onClick={() => { if(!playerName.trim()) setSystemAlert("Inserisci il tuo nome per vedere le tue statistiche!"); else setAppMode('stats'); }} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5 text-sm shadow-md">
                                 <BarChart size={20}/> Statistiche
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }
    
    if (appMode === 'campaign_intro') {
        return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-6 relative overflow-hidden">
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-900/40 via-slate-950 to-black pointer-events-none opacity-60"></div>
                 <div className="bg-slate-900/80 p-8 rounded-3xl max-w-2xl text-center border border-emerald-500/30 z-10 shadow-2xl">
                      <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-4">La Crisi del Varco Corrotto</h1>
                      <h2 className="text-xl text-emerald-400 font-bold mb-6">Prologo: L'Eclissi di Cell</h2>
                      <p className="text-slate-300 mb-4 text-left leading-relaxed">
                          Un'entità proveniente da un futuro distorto, Cell Perfetto (Corrotto), ha utilizzato una tecnologia rubata per fondere le dimensioni.
                      </p>
                      <p className="text-slate-300 mb-8 text-left leading-relaxed">
                          Ha emesso una "Frequenza di Sottomissione" che ha lavato il cervello al 90% degli eroi, trasformandoli nei suoi Burattini Perfetti. Solo Finn l'Umano e Topolino sono sfuggiti. Ora devono formare la Resistenza Finale!
                      </p>
                      
                      <div className="flex justify-center gap-4 mb-8">
                          <button onClick={() => setCampaignState(p => ({...p, difficulty: 'Normal'}))} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${campaignState.difficulty === 'Normal' ? 'border-blue-500 bg-blue-500/20 text-blue-400' : 'border-slate-700 text-slate-500'}`}>Normale</button>
                          <button onClick={() => setCampaignState(p => ({...p, difficulty: 'Insane'}))} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${campaignState.difficulty === 'Insane' ? 'border-rose-500 bg-rose-500/20 text-rose-400' : 'border-slate-700 text-slate-500'}`}>Multiverso Folle</button>
                      </div>
                      
                      <button onClick={() => {
                          setCampaignState(p => ({...p, isStarted: true}));
                          setAppMode('campaign_map');
                      }} className="bg-gradient-to-r from-emerald-500 to-teal-600 px-10 py-4 rounded-full font-black text-xl hover:scale-105 transition-transform">Inizia Avventura</button>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_map') {
        const sector = CAMPAIGN_DATA.sectors[campaignState.sectorIdx] || CAMPAIGN_DATA.sectors[0];
        const mission = sector.missions[campaignState.missionIdx] || sector.missions[0];
        
        // Calcolo per l'avviso salute
        const aliveHeroes = campaignState.roster.filter(id => campaignState.rosterStats[id] > 0);
        const totalHpPercentage = aliveHeroes.reduce((acc, id) => acc + (campaignState.rosterStats[id] / CHARACTERS.find(c=>c.id===id).maxHp), 0) / Math.max(1, aliveHeroes.length);
        const lowHealthWarning = aliveHeroes.length > 0 && totalHpPercentage < 0.4;
        
        return (
            <div className={`min-h-screen flex flex-col p-6 text-white ${sector.bg} relative overflow-hidden`}>
                <button onClick={() => setAppMode('menu')} className="absolute top-6 left-6 flex items-center gap-2 text-slate-300 hover:text-white transition-colors bg-black/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-white/20 z-20">
                     <ArrowLeft size={20} /> Abbandona Campagna
                </button>
                <button onClick={() => { 
                    const finn = CHARACTERS.find(c=>c.id==='finn');
                    const topo = CHARACTERS.find(c=>c.id==='topolino');
                    setCampaignSelectedTeam([]); // FIX: Svuota la squadra
                    setCampaignState({
                        isStarted: false,
                        sectorIdx: 0,
                        missionIdx: 0,
                        roster: ['finn', 'topolino'],
                        rosterStats: { 'finn': finn ? finn.maxHp : 100, 'topolino': topo ? topo.maxHp : 100 },
                        coins: 50,
                        difficulty: 'Normal',
                        currentBossState: null
                    });
                    setAppMode('menu'); 
                }} className="absolute top-6 right-6 flex items-center gap-2 text-rose-400 hover:text-white transition-colors bg-black/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-rose-500/50 z-20 text-sm font-bold shadow-lg">
                     Resetta Progressi
                </button>
                <div className="flex justify-center items-center bg-black/50 p-4 rounded-2xl mb-4 backdrop-blur-md border border-white/10 mt-14 max-w-4xl mx-auto w-full relative">
                    <div className="absolute -top-3 left-4 bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-slate-400">
                        Difficoltà: <span className={campaignState.difficulty === 'Insane' ? 'text-rose-400' : 'text-blue-400'}>{campaignState.difficulty === 'Insane' ? 'Folle' : 'Normale'}</span>
                    </div>
                    <div className="flex-1 text-center">
                        <h2 className="text-3xl font-black text-emerald-400">{sector.name}</h2>
                        <p className="text-slate-300 text-sm">{sector.description}</p>
                        
                        {/* BARRA DI PROGRESSO SETTORE */}
                        <div className="flex justify-center items-center gap-2 mt-3">
                            {sector.missions.map((m, i) => (
                                <div key={i} className="flex items-center">
                                    <div className={`w-3 h-3 rounded-full border-2 ${i < campaignState.missionIdx ? 'bg-emerald-500 border-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : i === campaignState.missionIdx ? 'bg-yellow-400 border-yellow-200 animate-pulse shadow-[0_0_10px_rgba(250,204,21,0.8)]' : 'bg-slate-800 border-slate-600'}`} title={`Missione ${i+1}`}></div>
                                    {i < sector.missions.length - 1 && <div className={`w-4 h-0.5 ${i < campaignState.missionIdx ? 'bg-emerald-500/50' : 'bg-slate-700'}`}></div>}
                                </div>
                            ))}
                            <div className="flex items-center ml-1">
                                <div className="w-4 h-0.5 bg-slate-700"></div>
                                <div className={`w-4 h-4 rounded border-2 rotate-45 ml-1 ${campaignState.missionIdx >= sector.missions.length ? 'bg-amber-500 border-amber-300' : 'bg-slate-800 border-slate-600'}`} title="Accampamento / Negozio"></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-xl border border-yellow-500/50 absolute right-8">
                        <Coins className="text-yellow-400" size={24} />
                        <span className="font-bold text-yellow-400 text-xl">{campaignState.coins}</span>
                    </div>
                </div>
                
                {lowHealthWarning && (
                    <div className="max-w-4xl mx-auto w-full bg-rose-900/40 border border-rose-500/50 text-rose-200 p-2 rounded-xl text-center text-sm font-bold animate-pulse mb-4">
                        ⚠️ Attenzione: La salute media della squadra è molto bassa! Sfrutta i curatori o sii cauto!
                    </div>
                )}
                
                <div className="flex-1 flex flex-col md:flex-row gap-8 max-w-6xl w-full mx-auto">
                    <div className="flex-1 bg-black/40 rounded-3xl p-8 border border-white/10 flex flex-col justify-center items-center text-center relative">
                        <h3 className="text-sm text-slate-400 font-bold uppercase tracking-widest mb-2">Prossima Missione</h3>
                        <h1 className="text-5xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">{mission.title}</h1>
                        <div className="flex flex-col items-center justify-center gap-4 mb-8 bg-black/30 p-4 rounded-2xl w-full">
                            <div className="flex items-center justify-center gap-4">
                                <span className="text-slate-400 font-bold uppercase tracking-widest text-sm mr-2">Boss:</span>
                                {(() => {
                                    let activeBosses = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.length > 0 ? campaignState.anomalyTargets : mission.boss;
                                    if (mission.isAnomaly && mission.id === 'm12_5' && activeBosses.includes('dynamic_anomaly_1')) activeBosses = ['scheletro'];
                                    return activeBosses.map((bId, idx) => {
                                        const b = CHARACTERS.find(c=>c.id===bId);
                                        return b ? <img key={`${bId}-${idx}`} src={b.img} className={`w-16 h-16 rounded-full border-2 ${mission.isAnomaly ? 'border-fuchsia-500 shadow-[0_0_15px_rgba(217,70,239,0.8)] filter sepia-[0.3] hue-rotate-[280deg]' : 'border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.5)]'} object-cover`} title={b.name} alt={b.name} /> : null;
                                    });
                                })()}
                            </div>
                            
                            {/* ANTEPRIMA TIPI BOSS */}
                            <div className="flex gap-2 justify-center flex-wrap mt-1">
                                {(() => {
                                    let activeBosses = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.length > 0 ? campaignState.anomalyTargets : mission.boss;
                                    if (mission.isAnomaly && mission.id === 'm12_5' && activeBosses.includes('dynamic_anomaly_1')) activeBosses = ['scheletro'];
                                    
                                    const allTypes = new Set();
                                    activeBosses.forEach(bId => {
                                        const b = CHARACTERS.find(c=>c.id===bId);
                                        if (b) b.types.forEach(t => allTypes.add(t));
                                    });
                                    
                                    return Array.from(allTypes).map(t => (
                                        <span key={t} className={`text-[10px] font-black px-2 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                    ));
                                })()}
                            </div>
                        </div>
                        <button onClick={() => { setCampaignDialogueIdx(0); setAppMode('campaign_dialogue'); }} className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl font-bold text-xl flex items-center gap-2 shadow-lg hover:-translate-y-1 transition-all">Avvia Missione <ArrowLeft className="rotate-180"/></button>
                    </div>
                    
                    <div className="w-full md:w-1/3 bg-black/40 rounded-3xl p-6 border border-white/10 flex flex-col">
                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-400"><Users size={20}/> La Tua Resistenza</h3>
                        <div className="space-y-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2 flex-1">
                            {campaignState.roster.map(id => {
                                const char = CHARACTERS.find(c=>c.id===id);
                                const hp = campaignState.rosterStats[id];
                                if(!char) return null;
                                return (
                                    <div key={id} className={`bg-slate-900/80 p-3 rounded-xl border ${hp <= 0 ? 'border-rose-900 grayscale opacity-75' : 'border-slate-700/50'} flex items-center gap-3`}>
                                        <img src={char.img} className="w-12 h-12 rounded-full border border-slate-600 object-cover" />
                                        <div className="flex-1">
                                            <div className="font-bold text-sm truncate">{char.name} {hp <= 0 && <span className="text-rose-500 text-[10px] ml-1">(Esausto)</span>}</div>
                                            {renderHealthBar(hp, char.maxHp)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_dialogue') {
        const sector = activeSector;
        const mission = activeMission;
        
        const fullDialogue = campaignDialogueMemo;

        const dialogue = fullDialogue[campaignDialogueIdx];
        
        const nextDialogue = () => {
            if (dialogue && campaignDialogueIdx < fullDialogue.length - 1) {
                setCampaignDialogueIdx(p => p + 1);
            } else {
                setAppMode('campaign_team_select');
            }
        };

        if (!dialogue) {
             setTimeout(nextDialogue, 0);
             return <div className="min-h-screen bg-slate-950"></div>;
        }

        const speakerName = dialogue.s.replace(' (Corrotto)', '').replace(' (Corrotta)', '');
        let speakerChar = CHARACTERS.find(c => c.name === speakerName);
        if (!speakerChar) speakerChar = CHARACTERS.find(c => c.name.includes(speakerName));
        
        return (
            <div className={`min-h-screen flex flex-col justify-end p-8 ${sector.bg} relative overflow-hidden`} onClick={nextDialogue}>
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-yellow-500/20 via-transparent to-transparent pointer-events-none opacity-50"></div>
                 {speakerChar && (
                     <div className={`absolute bottom-0 left-4 md:left-24 transition-all duration-500 pointer-events-none drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]`}>
                         <img src={speakerChar.img} className="w-48 h-48 md:w-80 md:h-80 object-cover rounded-t-full border-t-4 border-x-4 border-emerald-500 opacity-100" />
                     </div>
                 )}
                 <div className="bg-slate-900/95 border-2 border-emerald-400 p-8 rounded-2xl max-w-4xl w-full mx-auto z-10 cursor-pointer shadow-[0_0_40px_rgba(16,185,129,0.2)] relative mb-12 animate-fade-in">
                      <div className={`absolute -top-4 left-6 px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest shadow-md bg-emerald-500 text-white`}>{dialogue.s}</div>
                      <p className="text-xl md:text-2xl mt-4 leading-relaxed font-medium text-white italic">"{dialogue.t}"</p>
                      <p className="text-right text-xs text-emerald-400 mt-4 animate-pulse font-bold">Clicca per continuare...</p>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_post_dialogue') {
        const sector = activeSector;
        const mission = activeMission;
        
        const fullDialogue = campaignPostDialogueMemo;

        const dialogue = fullDialogue[campaignDialogueIdx];
        
        const nextDialogue = () => {
            if (dialogue && campaignDialogueIdx < fullDialogue.length - 1) {
                setCampaignDialogueIdx(p => p + 1);
            } else {
                if (mission.choiceUnlock) {
                    setAppMode('campaign_choice');
                } else {
                    advanceCampaign(150);
                }
            }
        };

        if (!dialogue) {
             setTimeout(nextDialogue, 0);
             return <div className="min-h-screen bg-slate-950"></div>;
        }

        const speakerName = dialogue.s.replace(' (Corrotto)', '').replace(' (Corrotta)', '');
        let speakerChar = CHARACTERS.find(c => c.name === speakerName);
        if (!speakerChar) speakerChar = CHARACTERS.find(c => c.name.includes(speakerName));
        
        return (
            <div className={`min-h-screen flex flex-col justify-end p-8 ${sector.bg} relative overflow-hidden`} onClick={nextDialogue}>
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-500/20 via-transparent to-transparent pointer-events-none opacity-50"></div>
                 {speakerChar && (
                     <div className={`absolute bottom-0 left-4 md:left-24 transition-all duration-500 pointer-events-none drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]`}>
                         <img src={speakerChar.img} className="w-48 h-48 md:w-80 md:h-80 object-cover rounded-t-full border-t-4 border-x-4 border-cyan-500 opacity-100" />
                     </div>
                 )}
                 <div className="bg-slate-900/95 border-2 border-cyan-400 p-8 rounded-2xl max-w-4xl w-full mx-auto z-10 cursor-pointer shadow-[0_0_40px_rgba(34,211,238,0.2)] relative mb-12 animate-fade-in">
                      <div className={`absolute -top-4 left-6 px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest shadow-md bg-cyan-500 text-black`}>{dialogue.s}</div>
                      <p className="text-xl md:text-2xl mt-4 leading-relaxed font-medium text-white italic">"{dialogue.t}"</p>
                      <p className="text-right text-xs text-cyan-400 mt-4 animate-pulse font-bold">Clicca per continuare...</p>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_choice') {
        const sector = activeSector;
        const mission = activeMission;

        const handleChoice = (pickedId) => {
            const resDialogues = mission.choiceDialogues[pickedId];
            setResolutionDialogues(resDialogues);
            setResolutionDialogueIdx(0);

            const newRoster = [...campaignState.roster, pickedId];
            const newRosterStats = { ...campaignState.rosterStats };
            newRosterStats[pickedId] = CHARACTERS.find(c=>c.id===pickedId).maxHp;

            setCampaignState(prev => ({
                ...prev,
                roster: newRoster,
                rosterStats: newRosterStats
            }));
            updateLocalStats({ unlockChar: pickedId });

            setAppMode('campaign_resolution_dialogue');
        };

        return (
            <div className={`min-h-screen flex flex-col p-6 text-white ${sector.bg} relative overflow-hidden items-center justify-center`}>
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-0"></div>
                <div className="relative z-10 text-center max-w-5xl w-full">
                    <h2 className="text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 drop-shadow-md">Scegli chi Reclutare!</h2>
                    <p className="text-xl text-slate-300 mb-12 font-medium">Puoi accogliere solo uno di loro nella Resistenza.<br/>L'altro tornerà alla sua dimensione d'origine.</p>
                    
                    <div className="flex flex-col md:flex-row gap-8 justify-center items-stretch w-full">
                        {mission.choiceUnlock.map(id => {
                            const char = CHARACTERS.find(c => c.id === id);
                            if(!char) return null;
                            return (
                                <div key={id} onClick={() => handleChoice(id)} className="bg-slate-900/80 border-2 border-slate-600 hover:border-emerald-400 hover:bg-slate-800 p-8 rounded-3xl cursor-pointer transition-all duration-300 transform hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(16,185,129,0.3)] flex-1 flex flex-col items-center group">
                                    <img src={char.img} className="w-32 h-32 md:w-48 md:h-48 rounded-full object-cover border-4 border-slate-700 group-hover:border-emerald-400 transition-colors mb-6 shadow-xl" alt={char.name} />
                                    <h3 className="text-3xl font-black text-white mb-4">{char.name}</h3>
                                    <div className="flex gap-2 justify-center mb-6">
                                        {char.types.map(t => (
                                            <span key={t} className={`text-xs font-black px-3 py-1 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                        ))}
                                    </div>
                                    <div className="w-full grid grid-cols-2 gap-3 text-sm font-mono bg-black/40 p-4 rounded-xl border border-slate-700/50 mt-auto">
                                        <div className="text-emerald-400">HP: {char.maxHp}</div>
                                        <div className="text-rose-400">ATK: {char.atk}</div>
                                        <div className="text-blue-400">DEF: {char.def}</div>
                                        <div className="text-amber-400">SPD: {char.spd}</div>
                                    </div>
                                    <button className="mt-8 bg-emerald-600 group-hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-colors w-full uppercase tracking-widest text-sm">Scegli {char.name}</button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_resolution_dialogue') {
        const sector = activeSector;
        const dialogue = resolutionDialogues[resolutionDialogueIdx];
        
        const nextDialogue = () => {
            if (dialogue && resolutionDialogueIdx < resolutionDialogues.length - 1) {
                setResolutionDialogueIdx(p => p + 1);
            } else {
                advanceCampaign(150);
            }
        };

        if (!dialogue) {
             setTimeout(nextDialogue, 0);
             return <div className="min-h-screen bg-slate-950"></div>;
        }

        const speakerName = dialogue.s;
        let speakerChar = CHARACTERS.find(c => c.name === speakerName);
        if (!speakerChar) speakerChar = CHARACTERS.find(c => c.name.includes(speakerName));
        
        return (
            <div className={`min-h-screen flex flex-col justify-end p-8 ${sector.bg} relative overflow-hidden`} onClick={nextDialogue}>
                 <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-500/20 via-transparent to-transparent pointer-events-none opacity-50"></div>
                 {speakerChar && (
                     <div className={`absolute bottom-0 left-4 md:left-24 transition-all duration-500 pointer-events-none drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]`}>
                         <img src={speakerChar.img} className="w-48 h-48 md:w-80 md:h-80 object-cover rounded-t-full border-t-4 border-x-4 border-amber-500 opacity-100" />
                     </div>
                 )}
                 <div className="bg-slate-900/95 border-2 border-amber-400 p-8 rounded-2xl max-w-4xl w-full mx-auto z-10 cursor-pointer shadow-[0_0_40px_rgba(245,158,11,0.2)] relative mb-12 animate-fade-in">
                      <div className={`absolute -top-4 left-6 px-4 py-1 rounded-full font-black text-sm uppercase tracking-widest shadow-md bg-amber-500 text-white`}>{dialogue.s}</div>
                      <p className="text-xl md:text-2xl mt-4 leading-relaxed font-medium text-white italic">"{dialogue.t}"</p>
                      <p className="text-right text-xs text-amber-400 mt-4 animate-pulse font-bold">Clicca per continuare...</p>
                 </div>
            </div>
        );
    }

    if (appMode === 'campaign_team_select') {
        const isFinalRaid = campaignState.sectorIdx >= CAMPAIGN_DATA.sectors.length - 1;
        const maxTeamSize = isFinalRaid ? 20 : 4;
        const sector = CAMPAIGN_DATA.sectors[campaignState.sectorIdx] || CAMPAIGN_DATA.sectors[0];
        const mission = sector.missions[campaignState.missionIdx] || sector.missions[0];
        const activeBosses = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.length > 0 ? campaignState.anomalyTargets : mission.boss;

        const toggleChar = (id) => {
            const isAnomalyTarget = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.includes(id);
            if (isAnomalyTarget) {
                setSystemAlert("Questo personaggio è stato infettato dall'Anomalia e non può essere schierato! Lo affronterai a breve!");
                return;
            }

            if (campaignSelectedTeam.includes(id)) {
                setCampaignSelectedTeam(campaignSelectedTeam.filter(c => c !== id));
            } else {
                if (campaignSelectedTeam.length < maxTeamSize) setCampaignSelectedTeam([...campaignSelectedTeam, id]);
            }
        };
        
        const handleStartCampaignBattle = () => {
            if (campaignSelectedTeam.length === 0) return setSystemAlert("Seleziona almeno un personaggio!");
            
            const activeBosses = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.length > 0 ? campaignState.anomalyTargets : mission.boss;
            
            const p1Team = campaignSelectedTeam.map(id => {
                const baseChar = CHARACTERS.find(c => c.id === id);
                if (!baseChar) return null; // FIX: Previene crash fatali
                const hp = campaignState.rosterStats[id] || 100;
                return {
                    ...JSON.parse(JSON.stringify(baseChar)), hp: hp, statuses: [], consecutiveProtect: 0,
                    baseAtk: baseChar.atk, baseDef: baseChar.def, baseSpd: baseChar.spd,
                    moves: baseChar.moves.filter(Boolean).map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
                };
            }).filter(Boolean); // Rimuove i null per sicurezza

            let p2Team = [];
            let isValidSavedBoss = false;

            if (campaignState.currentBossState && campaignState.currentBossState.length > 0) {
                // FIX CRITICO: Ignora il salvataggio vecchio se avevi già perso contro Groot e Snorlax PRIMA dell'aggiornamento
                const isOldM24Save = mission.id === 'm24' && campaignState.currentBossState.length <= 2 && !campaignState.currentBossState.some(c => ['piantacarnivora', 'cespugliomaledetto', 'alberto', 'fioretenebroso'].includes(c.id));
                
                if (!isOldM24Save) {
                    isValidSavedBoss = (mission.isAnomaly && mission.id === 'm12_5') || campaignState.currentBossState.some(c => activeBosses.includes(c.id));
                }
            }

            if (isValidSavedBoss) {
                p2Team = campaignState.currentBossState.map(savedC => {
                    let baseChar = CHARACTERS.find(c => c.id === savedC.id);
                    if (!baseChar) baseChar = CHARACTERS.find(c => c.id === 'scheletro');
                    
                    let charInst = {
                        ...JSON.parse(JSON.stringify(baseChar)), 
                        hp: savedC.hp, 
                        maxHp: savedC.maxHp, 
                        statuses: savedC.statuses || [], 
                        consecutiveProtect: 0,
                        atk: savedC.atk, 
                        baseAtk: savedC.atk, 
                        def: savedC.def, 
                        baseDef: savedC.def, 
                        spd: savedC.spd, 
                        baseSpd: savedC.spd,
                        moves: baseChar.moves.filter(Boolean).map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
                    };

                    // Riassegna il filtro immagine
                    if (!isFinalRaid) {
                         charInst.imageFilter = mission.isAnomaly ? 'sepia(0.3) hue-rotate(280deg) saturate(3) brightness(0.6) contrast(1.5) drop-shadow(0 0 15px rgba(217,70,239,0.9))' : 'sepia(0.6) hue-rotate(250deg) saturate(3) brightness(0.7) contrast(1.3) drop-shadow(0 0 10px rgba(168,85,247,0.8))';
                    } else {
                         charInst.imageFilter = 'drop-shadow(0 0 20px rgba(220,38,38,1))'; 
                    }

                    return charInst;
                });
            } else {
                // Calcolo scaling progressivo (ogni settore aumenta HP del 5% e Stat del 3%)
                let progressiveScale = 1 + (campaignState.sectorIdx * 0.05);

                p2Team = activeBosses.map(id => {
                    let baseChar = CHARACTERS.find(c => c.id === id);
                    
                    // FIX CRITICO: Se l'id del boss manca (es. anomalia non salvata bene), usa uno scheletro per evitare lo SCHERMO NERO
                    if (!baseChar) {
                        baseChar = CHARACTERS.find(c => c.id === 'scheletro');
                    }
                    
                    let hpMultiplier = progressiveScale;
                    if (isFinalRaid) hpMultiplier = 25; // Aumentato da 15 a 25 per resistere a 20 PG
                    else if (campaignState.difficulty === 'Insane') hpMultiplier *= 1.5; 
                    
                    let hp = Math.floor(baseChar.maxHp * hpMultiplier);
                    
                    let charInst = {
                        ...JSON.parse(JSON.stringify(baseChar)), hp: hp, maxHp: hp, statuses: [], consecutiveProtect: 0,
                        baseAtk: baseChar.atk, baseDef: baseChar.def, baseSpd: baseChar.spd,
                        moves: baseChar.moves.filter(Boolean).map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))
                    };
                    
                    // Buff Alle Statistiche (Attacco e Difesa scalano in base al settore)
                    if (!isFinalRaid) {
                         charInst.atk = Math.floor(charInst.atk * (1 + (campaignState.sectorIdx * 0.03)));
                         charInst.baseAtk = charInst.atk;
                         charInst.def = Math.floor(charInst.def * (1 + (campaignState.sectorIdx * 0.03)));
                         charInst.baseDef = charInst.def;
                         if (baseChar.imageFilter) {
                             charInst.imageFilter = baseChar.imageFilter; // Mantieni il colore base per i Cell Jr
                         } else {
                             charInst.imageFilter = mission.isAnomaly ? 'sepia(0.3) hue-rotate(280deg) saturate(3) brightness(0.6) contrast(1.5) drop-shadow(0 0 15px rgba(217,70,239,0.9))' : 'sepia(0.6) hue-rotate(250deg) saturate(3) brightness(0.7) contrast(1.3) drop-shadow(0 0 10px rgba(168,85,247,0.8))';
                         }
                    } else {
                         charInst.atk = Math.floor(charInst.atk * 1.5); // Final raid buff
                         charInst.baseAtk = charInst.atk;
                         charInst.def = Math.floor(charInst.def * 1.2);
                         charInst.baseDef = charInst.def;
                         charInst.imageFilter = 'drop-shadow(0 0 20px rgba(220,38,38,1))'; // Aura rossa oscura per i boss finali
                    }

                    if (campaignState.difficulty === 'Insane' || isFinalRaid) {
                        charInst.statuses.push({ type: 'Protetto', turns: 1 });
                        charInst.statuses.push({ type: 'Scudo Team', turns: 2 });
                    }
                    
                    // Buff Alle Statistiche dei Super Boss
                    if (isFinalRaid) {
                         charInst.atk = Math.floor(charInst.atk * 2.0); // Aumentato da 1.5 a 2.0
                         charInst.baseAtk = charInst.atk;
                         charInst.def = Math.floor(charInst.def * 1.5); // Aumentato da 1.2 a 1.5
                         charInst.baseDef = charInst.def;
                         charInst.imageFilter = 'drop-shadow(0 0 20px rgba(220,38,38,1))'; // Aura rossa oscura per i boss finali
                         
                         // Aggiunta meccanica Scudo da Raid per Trigon e Gaster
                         if (charInst.id === 'trigon' || charInst.id === 'gaster') {
                             charInst.juggShieldHpThresholds = [0.75, 0.50, 0.25];
                             charInst.juggHitsRemaining = 0;
                             charInst.shieldGrantedHits = 15; // Aumentato da 1 a 15 colpi
                             charInst.isJuggernaut = true; // Attiva la purificazione passiva ogni 2 turni
                         }
                    }

                    return charInst;
                });
            }

            const state = initialGameState();
            state.gameMode = 'classica';
            state.isCampaignBattle = true;
            let fSize = Math.min(4, Math.max(p1Team.length > 4 ? 4 : p1Team.length, p2Team.length));
            if (mission.forceFieldSize) fSize = mission.forceFieldSize;
            state.settings = { teamSize: p1Team.length, fieldSize: fSize };
            
            state.players.p1 = playerName || "Resistenza";
            state.playerAvatars.p1 = p1Team.length > 0 ? p1Team[0].img : '';
            state.isBot.p1 = false;
            
            state.players.p2 = mission.isAnomaly && mission.id === 'm12_5' ? "Team Infetto" : activeBosses.map(id => {
                 const b = CHARACTERS.find(c=>c.id===id);
                 return b ? b.name : "Sconosciuto";
            }).join(" & ");
            state.playerAvatars.p2 = p2Team.length > 0 ? p2Team[0].img : '';
            state.isBot.p2 = true;

            state.teams = { p1: p1Team, p2: p2Team, p3: [], p4: [] };
            state.field = { 
                p1: p1Team.slice(0, state.settings.fieldSize).map((_, i) => i), 
                p2: p2Team.slice(0, state.settings.fieldSize).map((_, i) => i),
                p3: [], p4: []
            };
            state.field.p1.forEach(idx => { if(state.teams.p1[idx]) state.teams.p1[idx].revealed = true; });
            state.field.p2.forEach(idx => { if(state.teams.p2[idx]) state.teams.p2[idx].revealed = true; });
            state.status = 'pre_battle';
            
            setGameState(state);
            setPlayerRole('p1');
            setAppMode('local_room');
        };

        return (
            <div className={`min-h-screen flex flex-col p-6 text-white ${sector.bg} relative overflow-hidden`}>
                <div className="flex-1 flex flex-col items-center justify-center mt-6 w-full z-10">
                    <h2 className="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 text-center">Seleziona la tua Resistenza ({campaignSelectedTeam.length}/{maxTeamSize})</h2>
                    
                    {/* HINT TIPI NEMICI NELLA SELEZIONE */}
                    <div className="mb-6 bg-slate-900/80 px-6 py-2 rounded-full border border-rose-500/30 flex items-center gap-3 backdrop-blur-md shadow-lg">
                        <span className="text-xs text-slate-300 font-bold uppercase tracking-widest">Tipi Nemici:</span>
                        <div className="flex gap-1.5">
                            {(() => {
                                let bossesToEval = activeBosses;
                                if (mission.isAnomaly && mission.id === 'm12_5' && activeBosses.includes('dynamic_anomaly_1')) bossesToEval = ['scheletro'];
                                const allTypes = new Set();
                                bossesToEval.forEach(bId => {
                                    const b = CHARACTERS.find(c=>c.id===bId);
                                    if (b) b.types.forEach(t => allTypes.add(t));
                                });
                                return Array.from(allTypes).map(t => (
                                    <span key={t} className={`text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                ));
                            })()}
                        </div>
                    </div>
                
                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-6 max-w-5xl w-full max-h-[50vh] overflow-y-auto custom-scrollbar p-2">
                    {campaignState.roster.map(id => {
                        const char = CHARACTERS.find(c => c.id === id);
                        if (!char) return null;
                        
                        const hp = campaignState.rosterStats[id] || 0;
                        const isDead = hp <= 0;
                        const isSelected = campaignSelectedTeam.includes(id);
                        const isAnomalyTarget = mission.isAnomaly && mission.id === 'm12_5' && campaignState.anomalyTargets && campaignState.anomalyTargets.includes(id);

                        return (
                            <div 
                                key={id} 
                                onClick={() => {
                                    if (isDead) {
                                        setSystemAlert("Questo personaggio è esausto! Curarlo all'accampamento prima di poterlo schierare in battaglia.");
                                        return;
                                    }
                                    toggleChar(id);
                                }}
                                className={`relative overflow-hidden bg-slate-900/80 backdrop-blur-md border rounded-2xl p-4 text-center transition-all duration-300 ${isDead ? 'opacity-50 grayscale border-rose-900 cursor-not-allowed' : isAnomalyTarget ? 'border-fuchsia-500 opacity-50 cursor-not-allowed' : isSelected ? 'border-emerald-400 bg-emerald-900/30 scale-105 shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'border-slate-700/50 hover:border-cyan-500/50 hover:-translate-y-1 cursor-pointer shadow-lg'}`}
                            >
                                <img src={char.img} alt={char.name} className={`w-16 h-16 rounded-full object-cover mx-auto mb-3 border-2 ${isSelected ? 'border-emerald-400' : 'border-slate-600/50'}`} />
                                <h4 className="font-bold text-sm mb-2 truncate text-slate-100">{char.name}</h4>
                                <div className="flex flex-wrap gap-1 justify-center mb-3">
                                    {char.types.map(t => (
                                        <span key={t} className={`text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                    ))}
                                </div>
                                {renderHealthBar(hp, char.maxHp)}
                                
                                {isSelected && (
                                    <div className="absolute top-2 right-2 bg-emerald-500 text-white rounded-full w-5 h-5 flex items-center justify-center font-black text-xs shadow-md">✓</div>
                                )}
                                {isAnomalyTarget && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-fuchsia-900/80 backdrop-blur-sm z-10">
                                        <span className="text-white font-black text-[10px] uppercase -rotate-12 border-2 border-white px-2 py-1 bg-black/50 rounded shadow-lg">Infetto</span>
                                    </div>
                                )}
                                {isDead && !isAnomalyTarget && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-rose-900/60 backdrop-blur-sm z-10">
                                        <span className="text-white font-black text-[10px] uppercase -rotate-12 border-2 border-white px-2 py-1 bg-black/50 rounded shadow-lg">Esausto</span>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
                <button onClick={handleStartCampaignBattle} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 px-12 py-5 rounded-full font-black text-2xl shadow-[0_10px_30px_rgba(59,130,246,0.4)] hover:-translate-y-1 transition-all flex items-center gap-3">
                    <Swords size={28}/> Inizia Battaglia!
                </button>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_shop') {
        const buyFullHeal = () => {
            if (campaignState.coins >= 600) {
                const newStats = {...campaignState.rosterStats};
                campaignState.roster.forEach(id => {
                    newStats[id] = CHARACTERS.find(c=>c.id===id).maxHp;
                });
                setCampaignState(p => ({...p, coins: p.coins - 600, rosterStats: newStats}));
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        const buyRevive = (id) => {
            if (campaignState.coins >= 100) {
                const newStats = {...campaignState.rosterStats};
                const maxHp = CHARACTERS.find(c=>c.id===id).maxHp;
                newStats[id] = Math.floor(maxHp * 0.5);
                setCampaignState(p => ({...p, coins: p.coins - 100, rosterStats: newStats}));
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        const buyPotion = (id) => {
            if (campaignState.coins >= 50) {
                const newStats = {...campaignState.rosterStats};
                const maxHp = CHARACTERS.find(c=>c.id===id).maxHp;
                newStats[id] = Math.min(maxHp, newStats[id] + Math.floor(maxHp * 0.5));
                setCampaignState(p => ({...p, coins: p.coins - 50, rosterStats: newStats}));
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-6 relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-orange-900/40 via-amber-950 to-black pointer-events-none opacity-80"></div>
                
                {/* Animazione Fuoco di bivacco nello sfondo */}
                <div className="absolute bottom-10 left-1/2 -translate-x-1/2 text-9xl opacity-10 animate-pulse pointer-events-none blur-sm filter">🔥</div>

                <div className="bg-slate-900/90 border border-orange-500/50 p-8 rounded-3xl max-w-2xl w-full text-center shadow-[0_0_50px_rgba(249,115,22,0.15)] z-10 max-h-[95vh] flex flex-col">
                    <div className="shrink-0">
                        <div className="flex items-center justify-center gap-3 mb-2">
                            <span className="text-4xl">⛺</span>
                            <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">Accampamento</h2>
                            <span className="text-4xl animate-pulse">🔥</span>
                        </div>
                        <p className="text-orange-200/70 text-sm mb-4 font-medium">Riposa, cura le ferite e organizza la squadra prima del prossimo settore.</p>
                        
                        <div className="flex items-center justify-center gap-3 mb-6 text-xl font-black bg-black/40 py-2 rounded-xl border border-slate-800">
                            Bilancio: <Coins className="text-yellow-400" size={24} /> <span className="text-yellow-400">{campaignState.coins} Monete</span>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-6 flex justify-between items-center shadow-inner">
                             <div className="text-left flex items-center gap-4">
                                 <div className="bg-emerald-500/20 p-2 rounded-xl text-emerald-400"><Heart size={24}/></div>
                                 <div>
                                     <div className="font-black text-lg text-white">Cura Totale Squadra</div>
                                     <div className="text-xs text-slate-400 mt-1">Ripristina tutti gli HP al massimo</div>
                                 </div>
                             </div>
                             <button onClick={buyFullHeal} className="bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 text-white font-black px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg hover:-translate-y-0.5 transition-all"><Coins size={16}/> 600</button>
                        </div>
                    </div>
                    
                    <div className="text-left text-sm font-bold text-slate-400 mb-2 px-2">Cure Individuali:</div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 mb-6 space-y-3 text-left">
                        {campaignState.roster.map(id => {
                            const char = CHARACTERS.find(c=>c.id===id);
                            const hp = campaignState.rosterStats[id] || 0;
                            if(!char) return null;
                            const isDead = hp <= 0;
                            const isFull = hp >= char.maxHp;

                            return (
                                <div key={id} className={`bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 flex items-center gap-3`}>
                                    <img src={char.img} className={`w-12 h-12 rounded-full border border-slate-600 object-cover ${isDead ? 'grayscale' : ''}`} />
                                    <div className="flex-1 min-w-0">
                                        <div className="font-bold text-sm truncate">{char.name} {isDead && <span className="text-rose-500 text-[10px] ml-1">(Esausto)</span>}</div>
                                        {renderHealthBar(hp, char.maxHp)}
                                    </div>
                                    <div className="shrink-0 flex gap-2">
                                        {isDead ? (
                                            <button onClick={() => buyRevive(id)} className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 text-xs shadow-md transition-all">
                                                <Heart size={12}/> Revitalizza <Coins size={10}/> 100
                                            </button>
                                        ) : (
                                            <button disabled={isFull} onClick={() => buyPotion(id)} className={`font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 text-xs shadow-md transition-all ${isFull ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}>
                                                <Heart size={12}/> Pozione (+50%) <Coins size={10}/> 50
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    <button onClick={() => setAppMode('campaign_map')} className="w-full shrink-0 bg-blue-600 hover:bg-blue-500 py-4 rounded-full font-black text-xl transition-all shadow-lg hover:-translate-y-1">Avanza al Prossimo Settore</button>
                </div>
            </div>
        );
    }

    if (appMode === 'campaign_ending') {
        return (
            <div className="min-h-screen bg-gradient-to-t from-blue-950 to-slate-950 text-white flex flex-col items-center justify-center p-6 text-center">
                <Trophy size={80} className="text-yellow-400 mb-6 drop-shadow-[0_0_30px_rgba(234,179,8,0.8)] animate-bounce" />
                <h1 className="text-6xl md:text-8xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 drop-shadow-md tracking-tighter">IL MULTIVERSO È LIBERO!</h1>
                <p className="text-xl md:text-2xl text-slate-300 max-w-3xl mb-12 font-medium leading-relaxed">
                    Cell Perfetto è stato sconfitto e il suo influsso spezzato. Il varco rimane aperto, ma ora eroi e cattivi di ogni dimensione possono convivere in pace. Hai salvato innumerevoli mondi!
                </p>
                <div className="bg-slate-900/50 p-6 rounded-3xl border border-white/10 mb-12 w-full max-w-4xl backdrop-blur-md">
                    <h3 className="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-6">La Resistenza Finale</h3>
                    <div className="flex flex-wrap justify-center gap-4">
                         {campaignState.roster.map(id => {
                              const char = CHARACTERS.find(c=>c.id===id);
                              if(!char) return null;
                              return <img key={id} src={char.img} className="w-16 h-16 rounded-full border-2 border-emerald-500 object-cover shadow-lg" title={char.name} alt={char.name} />;
                         })}
                    </div>
                </div>
                <button onClick={() => { 
                    const finn = CHARACTERS.find(c=>c.id==='finn');
                    const topo = CHARACTERS.find(c=>c.id==='topolino');
                    setCampaignSelectedTeam([]); // FIX: Svuota la squadra
                    setCampaignState({
                        isStarted: false,
                        sectorIdx: 0,
                        missionIdx: 0,
                        roster: ['finn', 'topolino'],
                        rosterStats: { 'finn': finn ? finn.maxHp : 100, 'topolino': topo ? topo.maxHp : 100 },
                        coins: 50,
                        difficulty: 'Normal',
                        currentBossState: null
                    });
                    setAppMode('menu'); 
                }} className="bg-white text-black px-12 py-5 rounded-full font-black text-xl hover:scale-105 transition-transform shadow-[0_0_40px_rgba(255,255,255,0.4)]">Torna al Menu Principale</button>
            </div>
        );
    }

    if (appMode === 'shop') {
        const playerData = getPlayerData();
        
        const handleBuyItem = (itemDef) => {
            if (playerData.coins >= itemDef.price) {
                updateLocalStats({ spendCoins: itemDef.price, buyItem: itemDef.id });
                // Forza un re-render cambiando un po' lo stato locale, o basterà il prossimo ciclo
                setGameState({...gameState}); 
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        const handleBuyChar = (char) => {
            if (playerData.coins >= char.price) {
                updateLocalStats({ spendCoins: char.price, unlockChar: char.id });
                setGameState({...gameState}); 
            } else {
                setSystemAlert("Non hai abbastanza monete!");
            }
        };

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/40 via-slate-950 to-black pointer-events-none opacity-60"></div>
                
                <div className="relative z-10 w-full max-w-5xl bg-slate-900/80 backdrop-blur-xl border border-amber-700/50 rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center mb-6 border-b border-amber-800/50 pb-6 shrink-0">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-amber-400 transition-colors font-bold bg-slate-950/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 text-center flex-1 flex items-center justify-center gap-3">
                            <ShoppingCart size={32} className="text-amber-500" /> Negozio
                        </h2>
                        <div className="flex items-center gap-2 bg-black/50 px-5 py-2 rounded-full border border-amber-500/50">
                            <Coins size={24} className="text-yellow-400" />
                            <span className="font-black text-xl text-yellow-400">{playerData.coins}</span>
                        </div>
                    </div>

                    <div className="flex gap-4 mb-6 shrink-0">
                         <button onClick={() => setShopTab('items')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${shopTab === 'items' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg border border-amber-500' : 'bg-slate-950/50 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}><BookOpen size={20}/> Oggetti e Cure</button>
                         <button onClick={() => setShopTab('chars')} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${shopTab === 'chars' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg border border-amber-500' : 'bg-slate-950/50 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}><Users size={20}/> Personaggi Sbloccabili</button>
                    </div>

                    {shopTab === 'items' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar p-2">
                            {Object.values(ITEMS_DB).map(item => {
                                const owned = playerData.inventory[item.id] || 0;
                                const canAfford = playerData.coins >= item.price;
                                
                                return (
                                    <div key={item.id} className="bg-slate-950/80 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between hover:border-amber-500/50 transition-colors group shadow-lg relative">
                                        <div className="absolute top-3 right-3 bg-slate-800 text-xs font-bold px-2 py-1 rounded text-slate-400 border border-slate-600">
                                            Posseduti: {owned}
                                        </div>
                                        <div>
                                            <div className="text-4xl mb-3 mt-2">{item.icon}</div>
                                            <h3 className="text-lg font-black text-white mb-1">{item.name}</h3>
                                            <p className="text-xs text-slate-400 h-10 leading-tight">{item.desc}</p>
                                        </div>
                                        <button 
                                            onClick={() => handleBuyItem(item)}
                                            disabled={!canAfford}
                                            className={`mt-4 w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${canAfford ? 'bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white shadow-lg hover:-translate-y-0.5' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}`}
                                        >
                                            Compra - <Coins size={16}/> {item.price}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {shopTab === 'chars' && (
                        <>
                            <div className="mb-4 shrink-0 px-2">
                                <input
                                    type="text"
                                    placeholder="🔍 Cerca personaggio da sbloccare..."
                                    value={shopCharSearch}
                                    onChange={e => setShopCharSearch(e.target.value)}
                                    className="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none transition-all placeholder-slate-500 shadow-inner"
                                />
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto custom-scrollbar p-2">
                                {CHARACTERS.filter(c => c.price && !c.isSummonOnly && c.name.toLowerCase().includes(shopCharSearch.toLowerCase())).sort((a,b) => a.price - b.price).map(char => {
                                    const isUnlocked = playerData.unlockedChars.includes(char.id);
                                    const canAfford = playerData.coins >= char.price;
                                    
                                    return (
                                        <div key={char.id} className={`bg-slate-950/80 border ${isUnlocked ? 'border-emerald-500/50' : 'border-slate-700'} rounded-2xl p-4 flex flex-col justify-between transition-colors shadow-lg relative hover:-translate-y-1`}>
                                            <img src={char.img} alt={char.name} className={`w-20 h-20 rounded-full object-cover mx-auto mb-3 border-2 ${isUnlocked ? 'border-emerald-500/50' : 'border-slate-600/50'} transition-all`} />
                                            <h4 className="font-bold text-center text-sm mb-2 text-slate-100">{char.name}</h4>
                                            <div className="flex flex-wrap gap-1 justify-center mb-4">
                                                {char.types.map(t => (
                                                    <span key={t} className={`text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                                ))}
                                            </div>

                                        {isUnlocked ? (
                                            <button disabled className="w-full py-2 rounded-xl font-bold flex items-center justify-center gap-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs cursor-default">
                                                <Unlock size={14}/> Sbloccato
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => handleBuyChar(char)}
                                                disabled={!canAfford}
                                                className={`w-full py-2 rounded-xl font-bold flex items-center justify-center gap-1 transition-all text-xs ${canAfford ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}`}
                                            >
                                                <Lock size={14}/> {char.price} <Coins size={12}/>
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    }

    if (appMode === 'stats') {
        const stats = getPlayerData();

        const getMostUsed = (obj) => {
            if (!obj || Object.keys(obj).length === 0) return { name: "Nessuno", count: 0 };
            const best = Object.keys(obj).reduce((a, b) => obj[a] > obj[b] ? a : b);
            return { name: best, count: obj[best] };
        };

        const favChar = getMostUsed(stats.chars);
        const favMove = getMostUsed(stats.moves);
        
        const formatTime = (secs) => {
            if (secs < 60) return `${secs} secondi`;
            const m = Math.floor(secs / 60);
            const h = Math.floor(m / 60);
            if (h > 0) return `${h}h ${m % 60}m`;
            return `${m}m ${secs % 60}s`;
        };

        const winRate = stats.matches > 0 ? Math.round((stats.wins / stats.matches) * 100) : 0;

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>
                
                <div className="relative z-10 w-full max-w-3xl bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
                    <div className="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-950/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 text-center flex-1">Statistiche di {playerName || 'Giocatore'}</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {/* Panoramica */}
                        <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 shadow-inner">
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 flex items-center gap-2"><Trophy size={16} className="text-yellow-500"/> Carriera</h3>
                            
                            <div className="space-y-4">
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Partite Giocate</span>
                                    <span className="text-2xl font-black text-white">{stats.matches}</span>
                                </div>
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Vittorie</span>
                                    <span className="text-2xl font-black text-emerald-400">{stats.wins}</span>
                                </div>
                                <div className="flex justify-between items-end border-b border-slate-800/50 pb-2">
                                    <span className="text-slate-300 font-medium">Win Rate</span>
                                    <span className="text-2xl font-black text-blue-400">{winRate}%</span>
                                </div>
                                <div className="flex justify-between items-end">
                                    <span className="text-slate-300 font-medium">Tempo in Battaglia</span>
                                    <span className="text-xl font-bold text-amber-400">{formatTime(stats.playtime)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Preferenze */}
                        <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-6 shadow-inner flex flex-col justify-center">
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-4 flex items-center gap-2"><Target size={16} className="text-rose-500"/> I Tuoi Preferiti</h3>
                            
                            <div className="bg-slate-900 border border-slate-700/50 rounded-xl p-4 mb-4 flex items-center gap-4">
                                <div className="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center shrink-0 border border-slate-600">
                                    <Users size={24} className="text-cyan-400"/>
                                </div>
                                <div className="overflow-hidden w-full">
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Personaggio Più Usato</div>
                                    <div className="text-lg font-black text-white truncate w-full">{favChar.name}</div>
                                    <div className="text-xs text-slate-500">Schierato {favChar.count} volte</div>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-700/50 rounded-xl p-4 flex items-center gap-4">
                                <div className="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center shrink-0 border border-slate-600">
                                    <Swords size={24} className="text-rose-400"/>
                                </div>
                                <div className="overflow-hidden w-full">
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Mossa Più Usata</div>
                                    <div className="text-lg font-black text-white truncate w-full">{favMove.name}</div>
                                    <div className="text-xs text-slate-500">Eseguita {favMove.count} volte</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p className="text-center text-slate-500 text-xs mt-4">
                        I dati vengono salvati localmente su questo browser associandoli al profilo globale.
                    </p>
                </div>
            </div>
        );
    }

    if (appMode === 'type_chart') {
        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>
                <div className="relative z-10 flex flex-col h-full max-w-7xl mx-auto w-full">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
                        <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 hidden sm:block">Tabella Efficacia Tipi</h2>
                        <div className="w-[100px] hidden sm:block"></div>
                    </div>

                    <div className="flex flex-wrap gap-4 justify-center mb-6 text-sm font-bold bg-slate-900/60 p-3 rounded-2xl border border-slate-700/50 backdrop-blur-md">
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-green-500 rounded border border-green-400"></div> 2x (Superefficace)</span>
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-red-500 rounded border border-red-400"></div> ½x (Poco efficace)</span>
                        <span className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-700 rounded border border-gray-500"></div> 0x (Nessun effetto)</span>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar border border-slate-700/50 rounded-2xl bg-slate-900/80 backdrop-blur-md shadow-2xl relative">
                        <table className="w-full text-center border-collapse">
                            <thead>
                                <tr>
                                    <th className="p-3 border-b-2 border-r-2 border-slate-700 bg-slate-950 sticky top-0 left-0 z-30 shadow-sm min-w-[120px]">
                                        <div className="text-xs text-slate-400 text-right pr-2">Difensore ➔</div>
                                        <div className="text-xs text-slate-400 text-left pl-2 mt-1">Attaccante ⬇</div>
                                    </th>
                                    {TYPES.map(t => (
                                        <th key={t} className="p-2 border-b-2 border-slate-700 sticky top-0 bg-slate-950 z-20 w-12 sm:w-16 shadow-sm">
                                            <div className="flex justify-center h-24 items-end pb-2">
                                                <span className={`text-[10px] font-black px-1.5 py-1 rounded uppercase tracking-wider ${TYPE_STYLES[t] || 'bg-gray-500'} transform -rotate-180 whitespace-nowrap`} style={{ writingMode: 'vertical-rl' }}>
                                                    {t}
                                                </span>
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {TYPES.map(atkType => (
                                    <tr key={atkType} className="hover:bg-slate-800/50 transition-colors">
                                        <td className="p-2 border-b border-r-2 border-slate-700 bg-slate-900 sticky left-0 z-10 font-bold min-w-[120px] text-right pr-4">
                                            <div className="flex items-center justify-end gap-2">
                                                <span className="text-slate-300">{atkType}</span>
                                                <span className={`w-3 h-3 rounded-full ${TYPE_STYLES[atkType]?.split(' ')[0] || 'bg-gray-500'}`}></span>
                                            </div>
                                        </td>
                                        {TYPES.map(defType => {
                                            const mult = TYPE_CHART[atkType]?.[defType];
                                            let content = "1";
                                            let cellClass = "p-2 border-b border-slate-700/50";
                                            
                                            if (mult === 2) {
                                                content = "2";
                                                cellClass += " bg-green-900/30 text-green-400 font-black shadow-[inset_0_0_8px_rgba(34,197,94,0.2)]";
                                            } else if (mult === 0.5) {
                                                content = "½";
                                                cellClass += " bg-red-900/30 text-red-400 font-bold";
                                            } else if (mult === 0) {
                                                content = "0";
                                                cellClass += " bg-gray-900/50 text-gray-500";
                                            } else {
                                                cellClass += " text-slate-600 font-medium text-[10px]";
                                            }

                                            return (
                                                <td key={defType} className={cellClass}>
                                                    {content}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    }

    if (appMode === 'catalog') {
        let displayedChars = [...CHARACTERS];
        if (catalogFilter === 'Evocazioni') {
            displayedChars = displayedChars.filter(c => c.isSummonOnly);
        } else {
            displayedChars = displayedChars.filter(c => !c.isSummonOnly);
            if (catalogFilter !== 'Tutti') {
                displayedChars = displayedChars.filter(c => c.types.includes(catalogFilter));
            }
        }
        if (catalogSearch.trim() !== '') {
            const searchLower = catalogSearch.toLowerCase();
            displayedChars = displayedChars.filter(c => c.name.toLowerCase().includes(searchLower));
        }
        if (catalogSort === 'alpha') {
            displayedChars.sort((a, b) => a.name.localeCompare(b.name));
        } else if (catalogSort === 'type') {
            displayedChars.sort((a, b) => a.types[0].localeCompare(b.types[0]));
        }

        return (
            <div className="min-h-screen bg-slate-950 text-white p-6 flex flex-col relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>

                <div className="relative z-10 flex flex-col h-full max-w-7xl mx-auto w-full">
                    <div className="flex justify-between items-center mb-8">
                        <button onClick={() => setAppMode('menu')} className="flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors font-bold bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50">
                            <ArrowLeft size={20} /> Menu
                        </button>
