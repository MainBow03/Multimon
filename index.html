                                                    <span className={`${TYPE_STYLES[m.type]} px-1 py-0.5 rounded text-[8px]`}>{m.type}</span>
                                                </div>
                                                <div className="flex justify-between text-slate-500 text-[9px] font-bold">
                                                    <span>{m.power > 0 ? `Pot: ${m.power}` : (m.heal || m.healFlat || m.targetMode === 'team_smart_heal' || m.targetMode === 'team' || m.selfHeal ? 'Cura' : (m.isProtect ? 'Difesa' : (m.isSummon ? 'Evoca' : 'Stato')))}</span>
                                                    {m.accuracy && <span>Prec: {m.accuracy * 100}%</span>}
                                                    {m.maxUses && <span>Usi max: {m.maxUses}</span>}
                                                    {m.multiHit && <span>{m.multiHit.min}-{m.multiHit.max} Colpi</span>}
                                                </div>
                                                <p className="text-slate-400 italic text-[9px] mt-1 leading-tight">{m.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    if (gameState.status === 'lobby') {
        const isHost = playerRole === 'p1';
        const reqPlayers = getRequiredPlayers(gameState.gameMode, gameState.settings);
        const canStartDraft = isAllPlayersJoined();

        return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 relative">
                <button onClick={leaveRoom} className="absolute top-6 left-6 flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-800/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-slate-700/50 z-20">
                     <ArrowLeft size={20} /> Torna al Menu
                </button>
                <div className="bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl w-full max-w-xl border border-slate-700/50 text-center shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                    <h2 className="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Lobby Partita</h2>
                    
                    {appMode === 'online_room' && (
                        <div className="mb-6 p-4 bg-slate-950/50 rounded-xl font-mono text-xl border border-slate-700/50 flex flex-col items-center gap-2">
                            <span className="text-sm text-slate-400">CODICE STANZA</span>
                            <span className="text-emerald-400 font-bold tracking-widest text-3xl">{roomId}</span>
                        </div>
                    )}

                    {isHost && (
                         <div className="mb-6 bg-slate-950/50 p-4 rounded-xl border border-slate-700/30 flex justify-between items-center">
                                 <span className="font-semibold text-slate-300">Modalità Gioco:</span>
                                 <select value={gameState.gameMode} onChange={e => updateState({ gameMode: e.target.value })} className="bg-slate-800 text-white font-bold p-2 rounded-lg outline-none border border-slate-600 focus:border-cyan-500">
                                         <option value="classica">Sfida Classica (1v1)</option>
                                         <option value="torneo">Torneo (4 Giocatori)</option>
                                         <option value="torneo_punti">Torneo a Punti (Tutti vs Tutti)</option>
                                         <option value="multipla">Multipla (2v2)</option>
                                 </select>
                         </div>
                    )}

                    {!isHost && (
                         <div className="mb-6 text-xl font-bold text-cyan-400">Modalità: {gameState.gameMode.toUpperCase()}</div>
                    )}

                    <div className="grid grid-cols-2 gap-4 mb-8">
                         {['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].slice(0, reqPlayers).map(slot => (
                             <div key={slot} className="bg-slate-950/50 rounded-2xl p-4 border border-slate-700/50 flex flex-col items-center justify-center min-h-[140px] relative">
                                 <div className="absolute top-2 left-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">{slot}</div>
                                 {gameState.players[slot] ? (
                                     <>
                                         <img src={gameState.playerAvatars[slot] || getDefaultAvatar(gameState.players[slot])} className="w-16 h-16 rounded-full border-2 border-cyan-500 mb-2 object-cover bg-slate-900" alt="Avatar" />
                                         <div className="font-bold text-lg text-white text-center w-full truncate px-2 flex items-center justify-center gap-2">
                                             {gameState.players[slot]} {gameState.isBot[slot] && <span className="bg-rose-600 text-white text-[10px] px-1.5 py-0.5 rounded-md">BOT</span>}
                                         </div>
                                         {isHost && (
                                             <button onClick={() => handleRemovePlayer(slot)} className="text-xs text-rose-400 hover:text-rose-300 mt-2 transition-colors">
                                                 Rimuovi
                                             </button>
                                         )}
                                     </>
                                 ) : (
                                     <div className="font-bold text-lg text-white text-center flex flex-col items-center w-full">
                                         <Loader2 className="animate-spin text-slate-600 mb-2" size={24}/> 
                                         <span className="text-slate-600 text-sm mb-3">In attesa...</span>
                                         {isHost && appMode === 'online_room' && (
                                             <button onClick={() => handleAddBot(slot)} className="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-3 py-1.5 rounded-lg w-full transition-colors">
                                                 + Aggiungi CPU
                                             </button>
                                         )}
                                         {isHost && appMode === 'local_room' && (
                                             <div className="flex gap-2 w-full mt-2">
                                                 <button onClick={() => {
                                                     const num = Object.keys(gameState.players).filter(k => gameState.players[k] && !gameState.isBot[k]).length + 1;
                                                     updateState({
                                                         [`players.${slot}`]: `Gioc. ${num}`,
                                                         [`playerAvatars.${slot}`]: getDefaultAvatar(`Gioc. ${num}`),
                                                         [`isBot.${slot}`]: false,
                                                         [`inventory.${slot}`]: getPlayerData(`Gioc. ${num}`).inventory
                                                     });
                                                 }} className="text-[10px] flex-1 bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/50 px-2 py-1.5 rounded-lg transition-colors">+ Umano</button>
                                                 <button onClick={() => handleAddBot(slot)} className="text-[10px] flex-1 bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500/50 px-2 py-1.5 rounded-lg transition-colors">+ CPU</button>
                                             </div>
                                         )}
                                     </div>
                                 )}
                             </div>
                         ))}
                    </div>

                    {isHost ? (
                        <div className="space-y-4 text-left">
                            <h3 className="text-slate-400 font-bold uppercase tracking-widest text-sm mb-4">Regole</h3>
                            {gameState.gameMode === 'torneo_punti' && (
                                <div className="flex justify-between items-center bg-slate-950/50 p-4 rounded-xl border border-slate-700/30 mb-4">
                                    <span className="font-semibold text-slate-300">Numero Giocatori (Max):</span>
                                    <input type="number" min="2" max="8" value={gameState.settings.maxPlayers} onChange={e => updateState({ settings: { ...gameState.settings, maxPlayers: Math.min(8, Math.max(2, parseInt(e.target.value) || 2)) } })} className="bg-slate-800 text-center w-20 p-2 rounded-lg outline-none font-bold" />
                                </div>
                            )}
                            <div className="flex justify-between items-center bg-slate-950/50 p-4 rounded-xl border border-slate-700/30">
                                <span className="font-semibold text-slate-300">Dimensione Squadra:</span>
                                <input type="number" min="1" max="10" value={gameState.settings.teamSize} onChange={e => updateState({ settings: { ...gameState.settings, teamSize: parseInt(e.target.value) || 1 } })} className="bg-slate-800 text-center w-20 p-2 rounded-lg outline-none font-bold" />
                            </div>
                            <div className="flex justify-between items-center bg-slate-950/50 p-4 rounded-xl border border-slate-700/30">
                                <span className="font-semibold text-slate-300">Personaggi in Campo:</span>
                                {gameState.gameMode === 'multipla' ? (
                                        <span className="text-emerald-400 font-bold">1 (Fisso in 2v2)</span>
                                ) : (
                                        <input type="number" min="1" max="4" value={gameState.settings.fieldSize} onChange={e => updateState({ settings: { ...gameState.settings, fieldSize: Math.min(4, parseInt(e.target.value) || 1) } })} className="bg-slate-800 text-center w-20 p-2 rounded-lg outline-none font-bold" />
                                )}
                            </div>
                            <button disabled={!canStartDraft} onClick={() => {
                                let hasBots = false;
                                const draftable = CHARACTERS.filter(c => !c.isSummonOnly);
                                const newDraft = { ...gameState.draft };
                                const req = getRequiredPlayers(gameState.gameMode, gameState.settings);
                                
                                ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].slice(0, req).forEach(p => {
                                    if (gameState.isBot[p]) {
                                        const cpuDraft = [];
                                        const shuffled = [...draftable].sort(() => 0.5 - Math.random());
                                        for(let i=0; i<gameState.settings.teamSize; i++) {
                                            let c = {...shuffled[i], statuses: [], consecutiveProtect: 0, baseAtk: shuffled[i].atk, baseDef: shuffled[i].def, baseSpd: shuffled[i].spd, moves: shuffled[i].moves.map(m => ({ ...m, remainingUses: m.maxUses !== undefined ? m.maxUses : null }))};
                                            cpuDraft.push(c);
                                        }
                                        newDraft[p] = cpuDraft;
                                        hasBots = true;
                                    }
                                });

                                if (hasBots) {
                                     updateState({ status: 'drafting', draft: newDraft });
                                } else {
                                     updateState({ status: 'drafting' });
                                }
                            }} className="w-full bg-gradient-to-r from-emerald-500 to-green-600 disabled:opacity-50 disabled:grayscale text-white font-bold py-4 rounded-xl mt-6 shadow-lg text-lg">
                                Procedi alla Scelta Personaggi
                            </button>
                        </div>
                    ) : (
                         <div className="text-slate-400 italic p-6 bg-slate-950/30 rounded-xl">L'host sta configurando le regole...</div>
                    )}
                </div>
            </div>
        );
    }

    if (gameState.status === 'drafting') {
        const activeReqPlayers = getRequiredPlayers(gameState.gameMode, gameState.settings);
        const activePlayersList = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].filter(p => gameState.players[p]);
        const draftLimitToCheck = gameState.gameMode === 'torneo_punti' ? activePlayersList : ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'].slice(0, activeReqPlayers);
        
        const myDraft = gameState.draft[playerRole] || [];
        const isReady = myDraft.length === gameState.settings.teamSize;
        
        let allReady = true;
        let readyCount = 0;
        draftLimitToCheck.forEach(p => {
                if (gameState.draft[p] && gameState.draft[p].length === gameState.settings.teamSize) readyCount++;
                else allReady = false;
        });

        const currentPlayerName = gameState.players[playerRole] || "Player";
        const myUnlocked = getPlayerData(currentPlayerName).unlockedChars || [];
        const draftableChars = CHARACTERS.filter(c => !c.isSummonOnly && (!c.price || myUnlocked.includes(c.id)));

        return (
            <div className="min-h-screen bg-slate-900 text-white p-6 flex flex-col relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black pointer-events-none opacity-40"></div>
                
                <div className="flex justify-between items-center mb-6 z-10">
                    <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Scegli la tua Squadra ({myDraft.length}/{gameState.settings.teamSize})</h2>
                    <div className="text-slate-300 bg-slate-950/80 px-6 py-3 rounded-xl border border-slate-700/50 shadow-inner font-bold flex items-center gap-3">
                         {appMode === 'vs_cpu' ? (
                             <span>Scegli il tuo Team!</span>
                         ) : (
                             <>Giocatori Pronti: <span className={allReady ? "text-emerald-400" : "text-amber-400"}>{readyCount}/{draftLimitToCheck.length}</span></>
                         )}
                    </div>
                </div>

                <div className="flex gap-4 mb-6 z-10 min-h-[80px] overflow-x-auto pb-2 custom-scrollbar">
                     {myDraft.map((char, i) => (
                         <div key={i} className="relative group cursor-pointer flex-shrink-0 animate-fade-in" onClick={() => updateState({ draft: { ...gameState.draft, [playerRole]: myDraft.filter((_, idx) => idx !== i) } })}>
                             <img src={char.img} alt={char.name} className="w-20 h-20 rounded-full object-cover border-4 border-emerald-400" />
                             <div className="absolute inset-0 bg-red-600/90 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm"><span className="font-black text-xl">X</span></div>
                         </div>
                     ))}
                </div>

                {isReady ? (
                    <div className="flex-1 flex flex-col items-center justify-center bg-slate-950/60 rounded-3xl z-10 border border-slate-800/50 backdrop-blur-sm">
                         <h3 className="text-5xl text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 font-black mb-8 drop-shadow-md">Squadra Pronta!</h3>
                         
                         {appMode === 'local_room' && !allReady && (() => {
                                 const humans = draftLimitToCheck.filter(p => !gameState.isBot[p]);
                                 const nextIdx = humans.indexOf(playerRole) + 1;
                                 const nextHuman = humans[nextIdx];
                                 
                                 return nextHuman ? (
                                     <button onClick={() => setPlayerRole(nextHuman)} className="bg-gradient-to-r from-blue-600 to-indigo-600 px-10 py-5 rounded-2xl font-black text-2xl shadow-[0_10px_30px_rgba(59,130,246,0.3)] hover:-translate-y-1 transition-all">
                                            Passa il turno al Giocatore {nextHuman.replace('p', '')}
                                     </button>
                                 ) : null;
                         })()}
                         
                         {appMode === 'online_room' && !allReady && (
                                 <p className="text-slate-400 animate-pulse flex items-center gap-3 text-xl bg-slate-900/50 px-8 py-4 rounded-xl"><Loader2 className="animate-spin text-cyan-400"/> In attesa degli altri...</p>
                         )}

                         {allReady && (appMode === 'local_room' || playerRole === 'p1') && (
                                 <button onClick={startBattle} className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 px-10 py-5 rounded-2xl font-black text-2xl shadow-[0_10px_30px_rgba(16,185,129,0.3)] hover:-translate-y-1 transition-all flex items-center gap-3"><Swords /> Inizia Lotta!</button>
                         )}

                         {allReady && appMode === 'online_room' && playerRole !== 'p1' && (
                                 <p className="text-emerald-400 animate-pulse flex items-center gap-3 text-xl bg-slate-900/50 px-8 py-4 rounded-xl"><Loader2 className="animate-spin"/> Tutti pronti! In attesa dell'Host...</p>
                         )}
                    </div>
                ) : (
                    <div className="flex-1 bg-slate-950/60 rounded-3xl p-8 overflow-y-auto border border-slate-800/50 z-10 custom-scrollbar">
                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6">
                            {draftableChars.map(char => {
                                const isSelected = myDraft.some(c => c.id === char.id);
                                return (
                                    <div 
                                        key={char.id} 
                                        onMouseEnter={() => setDraftHoverInfo(char.id)}
                                        onMouseLeave={() => { setDraftHoverInfo(null); draftLongPressRef.current = false; }}
                                        onTouchStart={() => {
                                            draftLongPressRef.current = false;
                                            draftPressTimerRef.current = setTimeout(() => {
                                                draftLongPressRef.current = true;
                                                setDraftHoverInfo(char.id);
                                            }, 400); 
                                        }}
                                        onTouchEnd={() => {
                                            clearTimeout(draftPressTimerRef.current);
                                            if (draftLongPressRef.current) {
                                                setDraftHoverInfo(null);
                                            }
                                        }}
                                        onTouchMove={() => {
                                            clearTimeout(draftPressTimerRef.current);
                                            setDraftHoverInfo(null);
                                        }}
                                        onClick={() => {
                                            if (draftLongPressRef.current) {
                                                draftLongPressRef.current = false;
                                                return; // Impedisce di selezionare il char se stavi solo tenendo premuto
                                            }
                                            handlePick(char);
                                        }}
                                        className={`relative overflow-hidden bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 text-center cursor-pointer transition-all duration-300 ${isSelected ? 'opacity-30 grayscale scale-95 border-slate-800' : 'hover:bg-slate-800 hover:border-cyan-500/50 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(6,182,212,0.15)] shadow-lg'}`}>
                                        
                                        <img src={char.img} alt={char.name} className="w-20 h-20 rounded-full object-cover mx-auto mb-4 border-2 border-slate-600/50 relative z-10" />
                                        <h4 className="font-bold text-sm mb-3 truncate text-slate-100 relative z-10">{char.name}</h4>
                                        <div className="flex flex-wrap gap-1.5 justify-center relative z-10">
                                            {char.types.map(t => (
                                                <span key={t} className={`text-[9px] font-black px-2 py-0.5 rounded-md uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                                            ))}
                                        </div>

                                        {/* OVERLAY MOSSE CON GRADIENTE */}
                                        {draftHoverInfo === char.id && (
                                            <div className="absolute inset-0 z-20 bg-gradient-to-t from-slate-950 via-slate-900/95 to-slate-900/90 p-3 flex flex-col overflow-y-auto custom-scrollbar animate-fade-in text-left">
                                                <h5 className="font-black text-cyan-400 text-xs mb-2 border-b border-cyan-500/30 pb-1 sticky top-0 bg-slate-950/80 backdrop-blur-sm z-10">{char.name} - Mosse</h5>
                                                <div className="space-y-2 pb-1">
                                                    {char.moves.map((m, i) => (
                                                        <div key={i} className="flex flex-col gap-0.5 bg-slate-800/50 p-1.5 rounded border border-slate-700/50">
                                                            <div className="flex justify-between items-center">
                                                                <span className="font-bold text-gray-200 text-[9px] truncate mr-1">{m.name}</span>
                                                                <span className={`text-[7px] px-1 rounded uppercase ${TYPE_STYLES[m.type] || 'bg-gray-500'}`}>{m.type}</span>
                                                            </div>
                                                            <span className="text-[8px] text-slate-400 leading-tight">{m.desc}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    if (gameState.status === 'pre_battle') {
        let team1 = [];
        let team2 = [];
        if (gameState.gameMode === 'multipla') {
                team1 = ['p1', 'p2'].filter(p => gameState.players[p]);
                team2 = ['p3', 'p4'].filter(p => gameState.players[p]);
        } else {
                const active = getActivePlayers();
                team1 = [active[0]];
                team2 = [active[1]];
        }

        const renderPreBattleTeam = (teamArr, isTop) => {
                return (
                        <div className={`flex flex-col items-center justify-center w-full h-full relative z-10 ${isTop ? 'bg-gradient-to-b from-rose-950 via-red-900/40 to-slate-950' : 'bg-gradient-to-t from-blue-950 via-cyan-900/40 to-slate-950'}`}>
                                <div className="flex justify-center gap-12 mb-6">
                                        {teamArr.map(p => (
                                                <div key={p} className="flex flex-col items-center transform transition-all duration-500 ease-out animate-[scale-in_0.5s_ease-out]">
                                                        <img src={gameState.playerAvatars[p] || getDefaultAvatar(gameState.players[p])} className={`w-32 h-32 rounded-full border-4 object-cover shadow-[0_0_40px_rgba(0,0,0,0.8)] ${isTop ? 'border-rose-400' : 'border-cyan-400'}`} alt="Avatar" />
                                                        <h2 className="text-4xl font-black mt-4 text-white drop-shadow-lg tracking-widest">{gameState.players[p]}</h2>
                                                </div>
                                        ))}
                                </div>
                                
                                <div className="flex gap-4 items-center justify-center flex-wrap max-w-4xl min-h-[100px]">
                                        {teamArr.map(p => gameState.teams[p].slice(0, introCharIdx).map((char, i) => (
                                                <div key={`${p}-${i}`} className="animate-[bounce-in_0.3s_ease-out] flex flex-col items-center">
                                                        <img src={char.img} className={`w-20 h-20 rounded-full border-2 shadow-xl object-cover ${isTop ? 'border-rose-300/80' : 'border-cyan-300/80'}`} alt={char.name} />
                                                </div>
                                        )))}
                                </div>
                        </div>
                );
        };

        return (
                <div className="min-h-screen bg-slate-950 flex flex-col overflow-hidden relative">
                        <div className="h-1/2 w-full">{renderPreBattleTeam(team2, true)}</div>
                        
                        <div className="absolute top-1/2 left-1/2 z-30 animate-[pulse-vs_1s_ease-in-out_infinite]" style={{ transform: 'translate(-50%, -50%)' }}>
                                <div className="bg-slate-950 w-24 h-24 rounded-full flex items-center justify-center border-4 border-yellow-500 shadow-[0_0_50px_rgba(234,179,8,0.8)]">
                                        <span className="text-4xl font-black italic text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 to-yellow-600">VS</span>
                                </div>
                        </div>
                        
                        <div className="absolute top-1/2 inset-x-0 h-2 bg-gradient-to-r from-transparent via-yellow-500 to-transparent shadow-[0_0_20px_rgba(234,179,8,0.5)] z-20" style={{ transform: 'translateY(-50%)' }}></div>
                        
                        <div className="h-1/2 w-full">{renderPreBattleTeam(team1, false)}</div>
                </div>
        );
    }

    if (gameState.status === 'intermission') {
        const isHost = playerRole === 'p1';
        
        if (gameState.gameMode === 'torneo_punti') {
            const sortedPlayers = Object.keys(gameState.playerScores)
                .filter(p => gameState.players[p])
                .sort((a, b) => gameState.playerScores[b] - gameState.playerScores[a]);
            const nextMatch = gameState.roundRobinMatches[gameState.currentMatchIdx + 1];

            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
                    <div className="bg-slate-800/80 backdrop-blur-xl p-10 rounded-3xl w-full max-w-2xl border border-slate-700/50 text-center shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                        <Trophy className="mx-auto text-yellow-400 mb-4" size={64} />
                        <h2 className="text-5xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">Classifica Torneo</h2>
                        
                        <div className="flex flex-col gap-3 mb-8">
                            {sortedPlayers.map((p, idx) => (
                                <div key={p} className={`flex justify-between items-center p-4 rounded-xl border ${idx === 0 ? 'bg-yellow-500/20 border-yellow-500/50' : 'bg-slate-950/50 border-slate-700/50'}`}>
                                    <div className="flex items-center gap-3">
                                        <span className={`font-black text-xl ${idx === 0 ? 'text-yellow-400' : 'text-slate-400'}`}>#{idx + 1}</span>
                                        <img src={gameState.playerAvatars[p] || getDefaultAvatar(gameState.players[p])} className="w-10 h-10 rounded-full object-cover border-2 border-slate-600" />
                                        <span className="font-bold text-lg">{gameState.players[p]}</span>
                                    </div>
                                    <div className="font-black text-2xl text-emerald-400">{gameState.playerScores[p]} pt</div>
                                </div>
                            ))}
                        </div>

                        <div className="bg-slate-950/80 border border-cyan-500/50 p-4 rounded-2xl mb-8">
                            <h4 className="text-cyan-400 font-bold uppercase tracking-widest text-sm mb-2">Prossimo Scontro</h4>
                            <div className="text-2xl font-black flex items-center justify-center gap-4">
                                <span>{gameState.players[nextMatch.pA]}</span>
                                <span className="text-rose-500 italic text-xl">VS</span>
                                <span>{gameState.players[nextMatch.pB]}</span>
                            </div>
                        </div>

                        {isHost ? (
                            <button onClick={handleNextTournamentMatch} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 px-8 rounded-full shadow-[0_10px_30px_rgba(59,130,246,0.3)] transition-all">
                                Avvia Prossimo Match
                            </button>
                        ) : (
                            <div className="text-slate-400 animate-pulse font-bold text-xl"><Loader2 className="animate-spin inline mr-2"/> In attesa dell'Host...</div>
                        )}
                    </div>
                </div>
            );
        }

        const bracket = gameState.tournamentBracket || ['p1', 'p2', 'p3', 'p4'];
        return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
                <div className="bg-slate-800/80 backdrop-blur-xl p-10 rounded-3xl w-full max-w-2xl border border-slate-700/50 text-center shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                    <Trophy className="mx-auto text-yellow-400 mb-4" size={64} />
                    <h2 className="text-5xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">Risultati Torneo</h2>
                    
                    <div className="grid grid-cols-2 gap-8 mb-8 text-left">
                        <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-700/50">
                            <h4 className="text-slate-400 font-bold mb-2">Semifinale 1</h4>
                            <p className="text-xs text-slate-500 mb-2 font-mono bg-slate-900 px-2 py-1 rounded">{gameState.players[bracket[0]]} vs {gameState.players[bracket[1]]}</p>
                            <div className="font-bold text-lg text-emerald-400">Vincitore: {gameState.tournamentResults.semi1 ? gameState.players[gameState.tournamentResults.semi1.winner] : 'In attesa...'}</div>
                        </div>
                        <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-700/50">
                            <h4 className="text-slate-400 font-bold mb-2">Semifinale 2</h4>
                            <p className="text-xs text-slate-500 mb-2 font-mono bg-slate-900 px-2 py-1 rounded">{gameState.players[bracket[2]]} vs {gameState.players[bracket[3]]}</p>
                            <div className="font-bold text-lg text-emerald-400">Vincitore: {gameState.tournamentResults.semi2 ? gameState.players[gameState.tournamentResults.semi2.winner] : 'In attesa...'}</div>
                        </div>
                    </div>

                    <p className="text-xl text-slate-300 mb-8">Preparati per il prossimo scontro!</p>

                    {isHost ? (
                        <button onClick={handleNextTournamentMatch} className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 px-8 rounded-full shadow-[0_10px_30px_rgba(59,130,246,0.3)] transition-all">
                            Avvia Prossimo Match
                        </button>
                    ) : (
                        <div className="text-slate-400 animate-pulse font-bold text-xl"><Loader2 className="animate-spin inline mr-2"/> In attesa dell'Host...</div>
                    )}
                </div>
            </div>
        );
    }

    if (gameState.status === 'switching_phase') {
        const isMyTurnToSwitch = !gameState.isBot[playerRole] && (gameState.pendingSwitches[playerRole] || 0) > (gameState.switchActions[playerRole]?.length || 0);

        return (
            <div className="min-h-screen bg-slate-900 flex flex-col font-sans text-white p-6 relative overflow-hidden items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-black pointer-events-none opacity-60"></div>
                
                <div className="bg-slate-800/90 backdrop-blur-xl p-8 rounded-3xl w-full max-w-3xl border border-slate-700/50 shadow-2xl text-center z-10">
                    <h2 className="text-4xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">Sostituzione Personaggio</h2>
                    
                    {isMyTurnToSwitch ? (
                        <>
                            <p className="text-lg text-slate-300 mb-6">Un tuo personaggio è esausto! Scegli chi mandare in campo.</p>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {gameState.teams[playerRole].map((char, i) => {
                                    const isAliveBench = char.hp > 0 && !gameState.field[playerRole].includes(i) && !char.isSummonOnly && !(gameState.switchActions[playerRole] || []).includes(i);
                                    if (!isAliveBench) return null;
                                    return (
                                        <button key={i} onClick={() => {
                                            const currentActions = gameState.switchActions[playerRole] || [];
                                            const newActions = [...currentActions, i];
                                            updateState({
                                                switchActions: { ...gameState.switchActions, [playerRole]: newActions }
                                            }).then(() => {
                                                if (appMode === 'local_room') {
                                                    const nextActive = getActivePlayers().filter(p => !gameState.isBot[p] && (p === playerRole ? newActions.length < gameState.pendingSwitches[p] : gameState.pendingSwitches[p] > (gameState.switchActions[p]?.length || 0)));
                                                    if (nextActive.length > 0) {
                                                        setPlayerRole(nextActive[0]);
                                                    }
                                                }
                                            });
                                        }} className="bg-slate-900/80 hover:bg-slate-700/80 border-2 border-emerald-500/50 hover:border-emerald-400 p-4 rounded-xl flex flex-col items-center gap-2 transition-all cursor-pointer shadow-lg hover:-translate-y-1">
                                            <img src={char.img} className="w-16 h-16 rounded-full object-cover border-2 border-emerald-400" />
                                            <span className="font-bold text-sm truncate w-full text-center">{char.name}</span>
                                            {renderHealthBar(char.hp, char.maxHp)}
                                        </button>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <div className="text-2xl text-slate-400 animate-pulse font-bold flex flex-col items-center gap-4">
                            <Loader2 className="animate-spin" size={48} />
                            In attesa degli altri giocatori...
                        </div>
                    )}
                </div>
            </div>
        );
    }

    if (gameState.status === 'battling' || gameState.status === 'executing') {
        const activeMatchPlayers = getActivePlayers();
        
        let bottomPlayers = [];
        let topPlayers = [];

        if (gameState.gameMode === 'multipla') {
                if (playerRole === 'p1' || playerRole === 'p2') { bottomPlayers = ['p1', 'p2']; topPlayers = ['p3', 'p4']; }
                else { bottomPlayers = ['p3', 'p4']; topPlayers = ['p1', 'p2']; }
        } else if (gameState.gameMode === 'torneo') {
                if (playerRole === activeMatchPlayers[0] || playerRole === activeMatchPlayers[1]) {
                        bottomPlayers = [playerRole];
                        topPlayers = [playerRole === activeMatchPlayers[0] ? activeMatchPlayers[1] : activeMatchPlayers[0]];
                } else {
                        bottomPlayers = [activeMatchPlayers[0]];
                        topPlayers = [activeMatchPlayers[1]];
                }
        } else {
                bottomPlayers = [playerRole === 'p2' ? 'p2' : 'p1'];
                topPlayers = [playerRole === 'p2' ? 'p1' : 'p2'];
        }

        const isSpectator = !bottomPlayers.includes(playerRole) && !topPlayers.includes(playerRole);
        const isMyTurn = gameState.status === 'battling' && !isSpectator && !gameState.isBot[playerRole] && commandingIdx >= 0 && commandingIdx < gameState.field[playerRole].length;
        const activeCommandCharIdx = isMyTurn ? gameState.field[playerRole][commandingIdx] : null;
        const activeCommandChar = activeCommandCharIdx !== null ? gameState.teams[playerRole][activeCommandCharIdx] : null;

        const currentField = (displayField.p1 && displayField.p1.length > 0) ? displayField : gameState.field;

        const renderStatuses = (statuses) => {
            if (!statuses || statuses.length === 0) return null;
            return (
                <div className="flex gap-1 justify-center mt-1 flex-wrap">
                    {statuses.map((s, i) => {
                        const colors = { 'Confuso': 'bg-fuchsia-500 text-white', 'Protetto': 'bg-sky-400 text-black', 'Riflesso': 'bg-gray-300 text-black', 'Scudo Team': 'bg-teal-400 text-black', 'Stordito': 'bg-amber-600 text-white', 'Infatuato': 'bg-pink-400', 'Elettrizzato': 'bg-yellow-400 text-black', 'Scottato': 'bg-red-500', 'Avvelenato': 'bg-purple-500', 'Congelato': 'bg-cyan-400 text-black', 'Addormentato': 'bg-slate-400', 'Indebolito': 'bg-stone-500 text-white', 'Ricarica': 'bg-orange-500 text-white', 'Magnetico': 'bg-indigo-500 text-white', 'Rashield': 'bg-yellow-200 text-black' };
                        return <span key={i} className={`text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm uppercase ${colors[s.type] || 'bg-gray-500'}`}>{s.type.substring(0, 3)}</span>;
                    })}
                </div>
            );
        };

        const renderFieldCharacter = (teamPlayer, fieldIdx, charTeamIdx, isEnemySide) => {
            const char = displayTeams[teamPlayer]?.[charTeamIdx] || gameState.teams[teamPlayer]?.[charTeamIdx];
            if (!char) return null; 
            
            const isDead = char.hp <= 0;
            
            let isTargetable = false;
            if (targetingMoveIdx !== null && !isDead && activeCommandChar) {
                    const move = activeCommandChar.moves[targetingMoveIdx];
                    if (move.targetMode === 'ally' || move.targetMode === 'team') {
                            isTargetable = teamPlayer === playerRole;
                    } else {
                            const myTeam = gameState.gameMode === 'multipla' 
                                     ? (['p1', 'p2'].includes(playerRole) ? ['p1', 'p2'] : ['p3', 'p4']) 
                                     : [playerRole];
                            isTargetable = !myTeam.includes(teamPlayer);
                    }
            }

            const isBeingCommanded = isMyTurn && teamPlayer === playerRole && fieldIdx === commandingIdx;
            
            let borderClass = isEnemySide ? 'border-red-500/50' : 'border-blue-500/50';
            
            if (isTargetable) {
                borderClass = 'border-yellow-400 animate-pulse cursor-pointer shadow-[0_0_15px_rgba(250,204,21,0.5)]';
            }
            if (isBeingCommanded) borderClass = 'border-white shadow-[0_0_20px_rgba(255,255,255,0.6)] scale-105 z-10';

            let effectivenessBadge = null;
            if (isTargetable && targetingMoveIdx !== null && activeCommandChar) {
                    const move = activeCommandChar.moves[targetingMoveIdx];
                    if (move && move.power > 0 && move.type && !move.targetMode && !move.isProtect && !move.isSummon) {
                            const multiplier = getMultiplier(move.type, char.types);
                            if (multiplier > 1) {
                                    effectivenessBadge = <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-green-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(34,197,94,0.8)] border border-green-300 z-30 animate-bounce whitespace-nowrap">SUPER EFFICACE!</div>;
                            } else if (multiplier < 1 && multiplier > 0) {
                                    effectivenessBadge = <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(220,38,38,0.8)] border border-red-400 z-30 whitespace-nowrap">POCO EFFICACE</div>;
                            } else if (multiplier === 0) {
                                    effectivenessBadge = <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-gray-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(75,85,99,0.8)] border border-gray-400 z-30 whitespace-nowrap">NESSUN EFFETTO</div>;
                            }
                    }
            }
            
            return (
                <div key={`${teamPlayer}-${charTeamIdx}`} className={`flex flex-col items-center w-36 transition-all ${isDead ? 'opacity-0 scale-0 absolute' : 'opacity-100'}`} onClick={() => isTargetable && handleSelectMoveTarget(teamPlayer, fieldIdx)}>
                    <div className="bg-slate-800/80 p-2 rounded-lg w-full mb-2 backdrop-blur-sm text-center shadow-lg z-10">
                        <div className="font-bold text-xs truncate text-gray-400 uppercase tracking-widest">{gameState.players[teamPlayer]}</div>
                        <div className="font-bold text-sm truncate text-gray-100 mb-1">{char.name}</div>
                        
                        <div className="flex gap-1 justify-center mb-1 flex-wrap">
                            {char.types.map(t => (
                                <span key={t} className={`text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t}</span>
                            ))}
                        </div>

                        {renderHealthBar(char.hp, char.maxHp)}
                        {renderStatuses(char.statuses)}
                    </div>
                    <div className="relative">
                        <img src={char.img} style={{ filter: char.imageFilter || 'none' }} className={`w-28 h-28 object-cover rounded-xl border-4 ${borderClass} transition-all`} alt="" />
                        {isTargetable && <Target className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-yellow-400 drop-shadow-[0_0_8px_rgba(0,0,0,0.8)] z-20 pointer-events-none" size={48} />}
                        {effectivenessBadge}
                    </div>
                </div>
            );
        };

        const renderPlayerBanners = (players, isTop) => {
                return (
                        <div className={`flex gap-6 ${isTop ? 'mb-4' : 'mt-4'} drop-shadow-md z-20 w-full justify-center relative`}>
                                {players.map(p => {
                                        const team = (displayTeams[p] && displayTeams.p1 && displayTeams.p1.length > 0) ? displayTeams[p] : (gameState.teams[p] || []);
                                        const currentFieldForPlayer = (displayField[p] && displayField.p1 && displayField.p1.length > 0) ? displayField[p] : (gameState.field[p] || []);
                                        
                                        // LOGICA SCUDO TEAM VISIVO GLOBALE
                                        const hasScudoTeam = currentFieldForPlayer.some(fIdx => {
                                            const c = team[fIdx];
                                            return c && c.hp > 0 && c.statuses && c.statuses.some(s => s.type === 'Scudo Team');
                                        });

                                        return (
                                                <div key={p} className="flex flex-col items-center gap-1.5 relative">
                                                        {hasScudoTeam && (
                                                            <div className="absolute inset-0 bg-teal-500/20 rounded-full blur-xl scale-150 animate-pulse z-0"></div>
                                                        )}
                                                        <div className="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-700/50 backdrop-blur-md relative z-10">
                                                                {hasScudoTeam && <Shield size={20} className="text-teal-400 drop-shadow-[0_0_8px_rgba(45,212,191,1)]" />}
                                                                <img src={gameState.playerAvatars[p] || getDefaultAvatar(gameState.players[p])} className={`w-8 h-8 rounded-full border-2 ${isTop ? 'border-rose-400' : 'border-cyan-400'} object-cover bg-slate-950`} style={{ filter: (gameState.isCampaignBattle && gameState.isBot[p]) ? 'sepia(0.6) hue-rotate(250deg) saturate(3) brightness(0.7) contrast(1.3)' : 'none' }} alt="" />
                                                                <span className={`font-bold text-sm uppercase tracking-widest ${isTop ? 'text-rose-300' : 'text-cyan-300'}`}>{gameState.players[p]}</span>
                                                        </div>
                                                        {/* INDICATORE PERSONAGGI VIVI/MORTI */}
                                                        <div className="flex gap-1.5 bg-black/60 px-3 py-1.5 rounded-full border border-slate-700/50 backdrop-blur-sm relative z-10">
                                                                {team.filter(c => !c.isSummonOnly).map((c, i) => (
                                                                        <div key={i} className={`w-2.5 h-2.5 rounded-full shadow-inner border border-black/50 ${c.hp > 0 ? (isTop ? 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]' : 'bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.6)]') : 'bg-slate-700 opacity-50'}`}></div>
                                                                ))}
                                                        </div>
                                                </div>
                                        );
                                })}
                        </div>
                );
        }

        return (
            <div className="min-h-screen bg-slate-900 flex flex-col font-sans text-white overflow-hidden">
                
                {/* EVENT PLAYBACK OVERLAY */}
                {isPlayingEvents && (
                    <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 z-50 pointer-events-none flex items-center justify-center transition-all duration-300">
                        <div className="bg-black/85 w-full py-5 border-y-4 border-yellow-500/60 shadow-[0_0_40px_rgba(0,0,0,0.8)] text-center">
                             <h2 className="text-3xl md:text-4xl font-black italic text-yellow-400 drop-shadow-[0_3px_3px_rgba(0,0,0,1)] tracking-wider px-4">
                                    {eventPlaybackText}
                             </h2>
                        </div>
                    </div>
                )}

                {/* BATTLE ARENA */}
                <div className="flex-1 p-4 flex flex-col relative overflow-hidden bg-slate-950">
                    
                    {/* Top Info Bar per Torneo */}
                    {gameState.gameMode === 'torneo' && (
                         <div className="absolute top-2 left-1/2 -translate-x-1/2 z-20 bg-slate-900/80 backdrop-blur-md px-6 py-2 rounded-full border border-yellow-500/50 shadow-lg text-yellow-400 font-black tracking-widest uppercase">
                                {gameState.tournamentMatch === 'semi1' ? 'Semifinale 1' : gameState.tournamentMatch === 'semi2' ? 'Semifinale 2' : gameState.tournamentMatch === 'bronze' ? 'Finale 3° Posto' : 'Finalissima'}
                         </div>
                    )}

                    {/* Opponent Side (TOP) */}
                    <div className="h-1/2 flex flex-col items-center justify-start pt-6 relative bg-gradient-to-b from-rose-900/60 via-red-900/20 to-transparent rounded-b-3xl">
                         {renderPlayerBanners(topPlayers, true)}
                         <div className="flex justify-center gap-6 flex-wrap relative w-full h-full mt-2">
                                {topPlayers.map(p => currentField[p]?.map((charIdx, fIdx) => renderFieldCharacter(p, fIdx, charIdx, true)))}
                         </div>
                    </div>

                    <div className="absolute inset-x-0 top-1/2 h-1 bg-gradient-to-r from-transparent via-white/10 to-transparent z-10"></div>

                    {/* Player Side (BOTTOM) */}
                    <div className="h-1/2 flex flex-col items-center justify-end pb-6 relative bg-gradient-to-t from-blue-900/60 via-cyan-900/20 to-transparent rounded-t-3xl">
                         <div className="flex justify-center gap-6 flex-wrap relative w-full h-full items-end mb-2">
                                {bottomPlayers.map(p => currentField[p]?.map((charIdx, fIdx) => renderFieldCharacter(p, fIdx, charIdx, false)))}
                         </div>
                         {renderPlayerBanners(bottomPlayers, false)}
                    </div>

                    <div className="h-20 mb-2 w-full flex flex-col items-center justify-center max-w-2xl mx-auto relative">
                         
                         {(!isPlayingEvents && isMyTurn && activeCommandChar && targetingMoveIdx === null && !hoveredMove) && (
                                 <div className="flex gap-3 justify-center mb-2 z-10">
                                         <button onClick={() => setActionMenuMode('moves')} className={`px-5 py-1.5 rounded-full text-xs font-black tracking-widest uppercase transition-all ${actionMenuMode === 'moves' ? 'bg-cyan-500 text-black shadow-[0_0_15px_rgba(6,182,212,0.5)]' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`}>Mosse</button>
                                         <button onClick={() => setActionMenuMode('items')} className={`px-5 py-1.5 rounded-full text-xs font-black tracking-widest uppercase transition-all ${actionMenuMode === 'items' ? 'bg-amber-500 text-black shadow-[0_0_15px_rgba(245,158,11,0.5)]' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`}>Zaino</button>
                                         <button onClick={() => setActionMenuMode('switch')} className={`px-5 py-1.5 rounded-full text-xs font-black tracking-widest uppercase transition-all ${actionMenuMode === 'switch' ? 'bg-emerald-500 text-black shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`}>Cambia (Squadra)</button>
                                 </div>
                         )}

                         {/* TOOLTIP DINAMICO MOVES */}
                         {hoveredMove ? (
                                <div className="animate-fade-in text-left bg-slate-900/90 p-3 rounded-xl border border-cyan-500/50 w-full shadow-lg absolute inset-0 flex flex-col justify-center">
                                        <div className="flex justify-between items-end mb-1">
                                                <span className="font-bold text-cyan-300 text-lg">{hoveredMove.name}</span>
                                                <span className="text-xs text-slate-400 font-mono font-bold">
                                                        {hoveredMove.power > 0 ? `Potenza: ${hoveredMove.power} | ` : ''}
                                                        {hoveredMove.accuracy ? `Prec: ${hoveredMove.accuracy * 100}% | ` : ''}
                                                        {hoveredMove.remainingUses !== undefined && hoveredMove.remainingUses !== null ? `Usi: ${hoveredMove.remainingUses}/${hoveredMove.maxUses}` : ''}
                                                </span>
                                        </div>
                                        <p className="text-sm text-slate-300 leading-tight">{hoveredMove.desc}</p>
                                </div>
                         ) : (
                                <h3 className="text-xl text-blue-300 font-bold text-center">
                                    {!isPlayingEvents && isMyTurn && activeCommandChar && (
                                        targetingMoveIdx === null 
                                            ? (actionMenuMode === 'moves' ? `Cosa deve fare ${activeCommandChar.name}?` : (actionMenuMode === 'items' ? 'Seleziona un oggetto da usare' : 'Seleziona un compagno da mandare in campo'))
                                            : `Seleziona il bersaglio per ${activeCommandChar.moves[targetingMoveIdx].name}!`
                                    )}
                                </h3>
                         )}
                    </div>

                    <div className="w-full flex-1 flex items-start justify-center overflow-y-auto custom-scrollbar">
                        
                        {isSpectator ? (
                                <div className="bg-slate-900/80 p-6 rounded-2xl border border-yellow-500/30 flex flex-col items-center justify-center gap-4 mt-8 shadow-lg w-full max-w-xl mx-auto">
                                    <div className="text-2xl text-yellow-400 font-black tracking-widest flex items-center gap-3">
                                        <Trophy size={28} /> MODALITÀ SPETTATORE
                                    </div>
                                    <p className="text-slate-300 font-medium text-center text-lg">
                                        Scontro in corso tra <br/><span className="font-black text-white text-2xl">{gameState.players[topPlayers[0]]}</span> e <span className="font-black text-white text-2xl">{gameState.players[bottomPlayers[0]]}</span>
                                    </p>
                                    <div className="flex gap-2 items-center mt-2 bg-black/40 px-4 py-2 rounded-lg">
                                        <Loader2 className="animate-spin text-slate-500" size={20} />
                                        <span className="text-slate-400 text-sm font-bold">In attesa che i giocatori scelgano le mosse...</span>
                                    </div>
                                </div>
                        ) : (!isPlayingEvents && isMyTurn && activeCommandChar) ? (
                            <div className="w-full max-w-2xl">
                                {targetingMoveIdx === null ? (
                                    <>
                                        {actionMenuMode === 'moves' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                {activeCommandChar.moves.map((move, idx) => {
                                                    const isDisabled = move.remainingUses === 0;
                                                    return (
                                                        <button
                                                            key={idx}
                                                            disabled={isDisabled}
                                                            onMouseEnter={() => setHoveredMove(move)}
                                                            onMouseLeave={() => { setHoveredMove(null); isLongPressRef.current = false; }}
                                                            onTouchStart={() => {
                                                                    isLongPressRef.current = false;
                                                                    pressTimerRef.current = setTimeout(() => {
                                                                            isLongPressRef.current = true;
                                                                            setHoveredMove(move);
                                                                    }, 400); 
                                                            }}
                                                            onTouchEnd={(e) => {
                                                                    clearTimeout(pressTimerRef.current);
                                                                    if (isLongPressRef.current) {
                                                                            setHoveredMove(null);
                                                                    }
                                                            }}
                                                            onTouchMove={() => {
                                                                    clearTimeout(pressTimerRef.current);
                                                                    setHoveredMove(null);
                                                            }}
                                                            onClick={(e) => {
                                                                    if (isLongPressRef.current) {
                                                                            e.preventDefault();
                                                                            e.stopPropagation();
                                                                            return; 
                                                                    }
                                                                    
                                                                    if (move.target === 'self' || move.isSummon || move.targetMode === 'team_smart_heal' || move.targetMode === 'team') {
                                                                            commitAction({
                                                                                    type: 'attack',
                                                                                    moveIdx: idx,
                                                                                    targetPlayer: playerRole,
                                                                                    targetIdx: gameState.field[playerRole][commandingIdx]
                                                                            });
                                                                    } else if (move.targetCount > 1) { 
                                                                            // Tutte le mosse ad area o a più bersagli colpiscono in automatico
                                                                            commitAction({
                                                                                    type: 'attack',
                                                                                    moveIdx: idx,
                                                                                    autoTargetCount: move.targetCount
                                                                            });
                                                                    } else {
                                                                            setTargetingMoveIdx(idx);
                                                                    }
                                                            }} 
                                                            className={`select-none bg-slate-800/80 backdrop-blur-md border border-slate-600 rounded-xl p-4 flex justify-between items-center transition-all duration-300 ${isDisabled ? 'opacity-50 grayscale cursor-not-allowed' : 'hover:bg-slate-700 hover:-translate-y-1 hover:shadow-lg'}`}
                                                    >
                                                            <div className="flex flex-col items-start pointer-events-none">
                                                                    <span className="font-bold text-lg drop-shadow-sm">{move.name}</span>
                                                                    {move.maxUses !== undefined && <span className="text-[10px] text-slate-400 font-bold mt-1">Usi: {move.remainingUses}/{move.maxUses}</span>}
                                                            </div>
                                                            <div className="flex flex-col items-end pointer-events-none">
                                                                 <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${TYPE_STYLES[move.type] || 'bg-gray-500'}`}>{move.type}</span>
                                                                 <span className="text-xs text-gray-400 mt-1 font-mono">{move.power > 0 ? `Potenza: ${move.power}` : (move.heal || move.healFlat || move.targetMode === 'team_smart_heal' || move.selfHeal || move.targetMode === 'team' ? 'Cura' : (move.isProtect ? 'Difesa' : (move.isSummon ? 'Evoca' : 'Stato')))}</span>
                                                            </div>
                                                    </button>
                                            );
                                        })}
                                            </div>
                                        )}

                                        {actionMenuMode === 'items' && (() => {
                                            const myInventory = gameState.inventory?.[playerRole] || {};
                                            const itemsToRender = Object.keys(myInventory).filter(itemId => myInventory[itemId] > 0);
                                            
                                            if (itemsToRender.length === 0) {
                                                return <div className="flex justify-center items-center h-full pt-4 text-slate-400 font-bold">Il tuo zaino è vuoto! Fai acquisti nel Negozio.</div>;
                                            }

                                            return (
                                                <div className="grid grid-cols-2 gap-4">
                                                    {itemsToRender.map(itemId => {
                                                        const itemDef = ITEMS_DB[itemId];
                                                        const qty = myInventory[itemId];
                                                        
                                                        // Se è un revit, abilita solo se ci sono morti
                                                        let isUsable = true;
                                                        if (itemDef.type === 'revive') {
                                                            const hasDead = gameState.teams[playerRole].some(c => c.hp <= 0 && !c.isSummonOnly);
                                                            if (!hasDead) isUsable = false;
                                                        } else {
                                                            // Altri oggetti si usano sul pg in campo. Se è morto non può usarli.
                                                            if (activeCommandChar.hp <= 0) isUsable = false;
                                                        }

                                                        return (
                                                            <button key={itemId} disabled={!isUsable} onClick={() => {
                                                                commitAction({ type: 'use_item', itemId: itemId, targetIdx: activeCommandCharIdx });
                                                            }} className={`bg-amber-600/20 p-3 rounded-xl border flex items-center justify-between transition-all text-left ${!isUsable ? 'opacity-50 grayscale border-slate-600 cursor-not-allowed' : 'border-amber-500/50 hover:bg-amber-500/30 hover:border-amber-400 hover:scale-[1.02] shadow-md'}`}>
                                                                <div>
                                                                    <div className="font-bold text-amber-400 text-lg flex items-center gap-2">
                                                                        <span className="text-2xl">{itemDef.icon}</span> {itemDef.name}
                                                                    </div>
                                                                    <div className="text-[10px] text-amber-200/80 leading-tight mt-1 pr-2">{itemDef.desc}</div>
                                                                </div>
                                                                <div className="text-sm font-black bg-black/60 px-3 py-1 rounded-full text-white shrink-0 shadow-inner">
                                                                    x{qty}
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })()}

                                        {actionMenuMode === 'switch' && (() => {
                                            const benchedChars = gameState.teams[playerRole].map((c, i) => ({...c, originalIdx: i})).filter((c, i) => !gameState.field[playerRole].includes(i) && c.hp > 0 && !c.isSummonOnly);
                                            return (
                                                <div className="grid grid-cols-2 gap-4">
                                                    {benchedChars.length === 0 ? <div className="col-span-2 text-center text-slate-400 font-bold mt-4">Nessun compagno disponibile per il cambio.</div> : null}
                                                    {benchedChars.map(char => (
                                                        <button key={char.originalIdx} onClick={() => {
                                                            commitAction({ type: 'switch', fromIdx: activeCommandCharIdx, toIdx: char.originalIdx });
                                                        }} className="bg-slate-800/80 p-3 rounded-xl border border-emerald-500/50 flex items-center gap-4 hover:bg-slate-700 hover:border-emerald-400 transition-all shadow-md group">
                                                            <img src={char.img} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-500/30 group-hover:border-emerald-400" />
                                                            <div className="text-left flex-1 overflow-hidden">
                                                                <div className="font-bold text-sm truncate text-white">{char.name}</div>
                                                                {renderHealthBar(char.hp, char.maxHp)}
                                                            </div>
                                                        </button>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </>
                                ) : (
                                    <button onClick={() => setTargetingMoveIdx(null)} className="mt-4 bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-lg font-bold w-full mx-auto block max-w-xs transition-colors shadow-md">
                                         Annulla Selezione
                                    </button>
                                )}
                            </div>
                        ) : (!isPlayingEvents && !isMyTurn) && (
                            <div className="text-2xl text-gray-500 animate-pulse font-bold flex items-center gap-3 mt-4">
                                 <Loader2 className="animate-spin" /> In attesa degli altri giocatori...
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    if (gameState.status === 'gameover') {
        if (gameState.isCampaignBattle) {
            const isWin = gameState.winner === gameState.players.p1;
            
            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                    <div className={`absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] ${isWin ? 'from-emerald-900/40' : 'from-rose-900/40'} via-slate-950 to-black pointer-events-none`}></div>
                    <div className="relative z-10 bg-slate-900/80 p-12 rounded-3xl border border-slate-700/50 shadow-2xl backdrop-blur-xl">
                        <h1 className={`text-7xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r ${isWin ? 'from-emerald-400 to-teal-500' : 'from-rose-500 to-red-600'}`}>{isWin ? 'VITTORIA!' : 'SCONFITTA!'}</h1>
                        
                        {isWin ? (
                            <>
                                <p className="text-xl text-slate-300 mb-8 font-medium">Hai sconfitto i burattini di Cell e spezzato il controllo mentale!</p>
                                <button onClick={() => {
                                    const newRosterStats = { ...campaignState.rosterStats };
                                    const faintedThisBattle = [];
                                    
                                    gameState.teams.p1.forEach(c => {
                                        newRosterStats[c.id] = c.hp;
                                        if (c.hp <= 0 && !c.isSummonOnly) {
                                            faintedThisBattle.push(c.name);
                                        }
                                    });
                                    
                                    const mission = CAMPAIGN_DATA.sectors[campaignState.sectorIdx].missions[campaignState.missionIdx];
                                    const newRoster = [...campaignState.roster];
                                    mission.unlock.forEach(id => {
                                        if (!newRoster.includes(id)) {
                                            newRoster.push(id);
                                            newRosterStats[id] = CHARACTERS.find(c=>c.id===id).maxHp;
                                        }
                                    });

                                    setCampaignState(prev => ({
                                        ...prev,
                                        rosterStats: newRosterStats,
                                        roster: newRoster,
                                        faintedInLastBattle: faintedThisBattle // Salva i personaggi andati KO
                                    }));
                                    setCampaignDialogueIdx(0);
                                    setAppMode('campaign_post_dialogue');
                                }} className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 px-10 py-5 rounded-full font-black text-2xl transition-all shadow-[0_10px_30px_rgba(16,185,129,0.4)] hover:-translate-y-1">Continua e Vedi Epilogo</button>
                            </>
                        ) : (
                            <>
                                <p className="text-xl text-slate-300 mb-8 font-medium">La tua squadra è caduta... ma la resistenza non si arrende!</p>
                                <button onClick={() => {
                                    const newRosterStats = { ...campaignState.rosterStats };
                                    campaignState.roster.forEach(id => {
                                        if (newRosterStats[id] <= 0) newRosterStats[id] = 1; 
                                    });
                                    setCampaignState(p => ({...p, rosterStats: newRosterStats}));
                                    setAppMode('campaign_map');
                                }} className="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 px-10 py-5 rounded-full font-black text-2xl transition-all shadow-[0_10px_30px_rgba(225,29,72,0.4)] hover:-translate-y-1">Ritirata Strategica (Riprova)</button>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        let rewardText = "";
        let rankText = "";
        
        if (playerName.trim()) {
            let coins = 0;
            const myKey = Object.keys(gameState.players).find(k => gameState.players[k] === playerName);
            
            if (myKey) {
                if (gameState.gameMode === 'torneo') {
                    const tr = gameState.tournamentResults;
                    if (tr.final && tr.final.winner === myKey) { coins = 200; rankText = "1° Posto nel Torneo!"; }
                    else if (tr.final && tr.final.loser === myKey) { coins = 100; rankText = "2° Posto nel Torneo!"; }
                    else if (tr.bronze && tr.bronze.winner === myKey) { coins = 70; rankText = "3° Posto nel Torneo!"; }
                    else if (tr.bronze && tr.bronze.loser === myKey) { coins = 50; rankText = "4° Posto nel Torneo!"; }
                    else { coins = 50; }
                } else {
                    let won = false;
                    if (gameState.gameMode === 'multipla') {
                         if (gameState.winner && gameState.winner.includes(playerName)) won = true;
                    } else if (gameState.winner === playerName) {
                         won = true;
                    }
                    coins = won ? 100 : 50;
                    if (gameState.winner === 'Pareggio') coins = 50;
                }

                // CALCOLO BONUS TEAM SIZE
                const teamSizeBonus = Math.max(0, (gameState.settings.teamSize - 4) * 5);
                if (coins > 0) {
                    coins += teamSizeBonus;
                    if (teamSizeBonus > 0) {
                        rewardText = `+${coins} Monete ricevute! (+${teamSizeBonus} Bonus Squadra)`;
                    } else {
                        rewardText = `+${coins} Monete ricevute!`;
                    }
                }
            }
        }

        return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 text-center">
                <h1 className="text-7xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">FINE PARTITA</h1>
                <h2 className="text-4xl mb-2 font-bold">{gameState.winner === 'Pareggio' ? 'Pareggio Totale!' : `VITTORIA PER ${(gameState.winner || '').toUpperCase()}!`}</h2>
                {rankText && <h3 className="text-2xl font-bold text-emerald-400 mb-4">{rankText}</h3>}
                {rewardText && <p className="text-xl font-bold text-yellow-400 mb-12 flex items-center justify-center gap-2"><Coins size={24}/> {rewardText}</p>}
                <button onClick={() => window.location.reload()} className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-full font-bold text-xl flex items-center gap-2 shadow-[0_10px_30px_rgba(59,130,246,0.3)]">
                    <RotateCcw /> Torna al Menu Principale
                </button>
            </div>
        );
    }

        return null;
    }; // Fine renderView

    return (
        <>
            {systemAlert && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-amber-500/50 p-6 rounded-3xl max-w-sm w-full text-center shadow-[0_0_50px_rgba(245,158,11,0.2)] relative overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                        <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center justify-center gap-2">⚠️ Avviso</h3>
                        <p className="text-slate-300 mb-8 font-medium">{systemAlert}</p>
                        <button onClick={() => setSystemAlert(null)} className="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3 px-6 rounded-xl w-full transition-all shadow-lg hover:-translate-y-0.5">
                            Ho capito!
                        </button>
                    </div>
                </div>
            )}
            {renderView()}
        </>
    );
}
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
