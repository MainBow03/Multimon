                                                                                enemyTeams = playerRole === juggPlayer ? activeMatchPlayers.filter(p => p !== juggPlayer) : [juggPlayer];
                                                                            } else if (gameState.gameMode === 'torneo' || gameState.gameMode === 'torneo_punti') {
                                                                                enemyTeams = [activeMatchPlayers.find(p => p !== playerRole)];
                                                                            } else if (gameState.gameMode === 'battleroyale') {
                                                                                enemyTeams = activeMatchPlayers.filter(p => p !== playerRole);
                                                                            } else {
                                                                                enemyTeams = [playerRole === 'p1' ? 'p2' : 'p1'];
                                                                            }
                                                        
                                                                            let tPlayer = null;
                                                                            let tIdx = null;
                                                                            let tFieldIdx = null;
                                                        
                                                                            // Trova il primo nemico valido come bersaglio "ancora" (il motore poi colpirà tutti gli altri)
                                                                            for (let ep of enemyTeams) {
                                                                                if (ep && gameState.field[ep]) {
                                                                                    const aliveIdx = gameState.field[ep].findIndex(cIdx => gameState.teams[ep][cIdx].hp > 0);
                                                                                    if (aliveIdx !== -1) {
                                                                                        tPlayer = ep;
                                                                                        tIdx = gameState.field[ep][aliveIdx];
                                                                                        tFieldIdx = aliveIdx;
                                                                                        break;
                                                                                    }
                                                                                }
                                                                            }
                                                        
                                                                            commitAction({
                                                                                type: 'attack',
                                                                                moveIdx: idx,
                                                                                targetPlayer: tPlayer || (enemyTeams[0] || 'p2'),
                                                                                targetIdx: tIdx !== null ? tIdx : 0,
                                                                                targetFieldIdx: tFieldIdx !== null ? tFieldIdx : 0
                                                                            });
                                                                    } else {
                                                                            setTargetingMoveIdx(idx);
                                                                    }
                                                            }} 
                                                            className={`select-none bg-slate-800/80 backdrop-blur-md border border-slate-600 rounded-xl p-4 flex justify-between items-center transition-all duration-300 ${isDisabled ? 'opacity-50 grayscale cursor-not-allowed' : 'hover:bg-slate-700 hover:-translate-y-1 hover:shadow-lg'}`}
                                                    >
                                                            <div className="flex flex-col items-start pointer-events-none">
                                                                    <span className="font-bold text-lg drop-shadow-sm">{move.name}</span>
                                                                    {move.currentCooldown > 0 ? (
                                                                        <span className="text-[10px] text-rose-400 font-bold mt-1">In ricarica ({move.currentCooldown})</span>
                                                                    ) : (
                                                                        move.maxUses !== undefined && <span className="text-[10px] text-slate-400 font-bold mt-1">Usi: {move.remainingUses}/{move.maxUses}</span>
                                                                    )}
                                                        </div>
                                                        <div className="flex flex-col items-end pointer-events-none">
                                                             <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${TYPE_STYLES[move.type] || 'bg-gray-500'}`}>{move.type}</span>
                                                             <span className="text-xs text-gray-400 mt-1 font-mono">{move.power > 0 ? `Potenza: ${move.power}` : (move.heal || move.healFlat || move.targetMode === 'team_smart_heal' || move.selfHeal || move.targetMode === 'team' || move.healLastTurnDamage ? 'Cura' : (move.isProtect ? 'Difesa' : ((move.isSummon || move.randomSummon) ? 'Evoca' : 'Stato')))}</span>
                                                        </div>
                                                </button>
                                            );
                                        })}
                                            </div>
                                        )}

                                        {actionMenuMode === 'items' && (() => {
                                            const myInventory = gameState.inventory?.[playerRole] || {};
                                            const itemsToRender = Object.keys(myInventory).filter(itemId => myInventory[itemId] > 0);
                                            
                                            if (itemsToRender.length === 0) {
                                                return <div className="flex justify-center items-center h-full pt-4 text-slate-400 font-bold">Il tuo zaino è vuoto! Fai acquisti nel Negozio.</div>;
                                            }

                                            return (
                                                <div className="grid grid-cols-2 gap-4">
                                                    {itemsToRender.map(itemId => {
                                                        const itemDef = ITEMS_DB[itemId];
                                                        const qty = myInventory[itemId];
                                                        
                                                        // Se è un revit, abilita solo se ci sono morti
                                                        let isUsable = true;
                                                        if (itemDef.type === 'revive') {
                                                            const hasDead = gameState.teams[playerRole].some(c => c.hp <= 0 && !c.isSummonOnly);
                                                            if (!hasDead) isUsable = false;
                                                        } else {
                                                            // Altri oggetti si usano sul pg in campo. Se è morto non può usarli.
                                                            if (activeCommandChar.hp <= 0) isUsable = false;
                                                        }

                                                        return (
                                                            <button key={itemId} disabled={!isUsable} onClick={() => {
                                                                commitAction({ type: 'use_item', itemId: itemId, targetIdx: activeCommandCharIdx });
                                                            }} className={`bg-amber-600/20 p-3 rounded-xl border flex items-center justify-between transition-all text-left ${!isUsable ? 'opacity-50 grayscale border-slate-600 cursor-not-allowed' : 'border-amber-500/50 hover:bg-amber-500/30 hover:border-amber-400 hover:scale-[1.02] shadow-md'}`}>
                                                                <div>
                                                                    <div className="font-bold text-amber-400 text-lg flex items-center gap-2">
                                                                        <span className="text-2xl">{itemDef.icon}</span> {itemDef.name}
                                                                    </div>
                                                                    <div className="text-[10px] text-amber-200/80 leading-tight mt-1 pr-2">{itemDef.desc}</div>
                                                                </div>
                                                                <div className="text-sm font-black bg-black/60 px-3 py-1 rounded-full text-white shrink-0 shadow-inner">
                                                                    x{qty}
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })()}

                                        {actionMenuMode === 'switch' && (() => {
                                            const benchedChars = gameState.teams[playerRole].map((c, i) => ({...c, originalIdx: i})).filter((c, i) => !gameState.field[playerRole].includes(i) && c.hp > 0 && !c.isSummonOnly);
                                            return (
                                                <div className="grid grid-cols-2 gap-4">
                                                    {benchedChars.length === 0 ? <div className="col-span-2 text-center text-slate-400 font-bold mt-4">Nessun compagno disponibile per il cambio.</div> : null}
                                                    {benchedChars.map(char => (
                                                        <button key={char.originalIdx} onClick={() => {
                                                            commitAction({ type: 'switch', fromIdx: activeCommandCharIdx, toIdx: char.originalIdx });
                                                        }} className="bg-slate-800/80 p-3 rounded-xl border border-emerald-500/50 flex items-center gap-3 hover:bg-slate-700 hover:border-emerald-400 transition-all shadow-md group">
                                                            <img src={char.img} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-500/30 group-hover:border-emerald-400 shrink-0" />
                                                            <div className="text-left flex-1 min-w-0">
                                                                <div className="font-bold text-sm truncate text-white mb-1">{char.name}</div>
                                                                <div className="flex gap-1 mb-1.5 flex-wrap">
                                                                     {char.types.map(t => <span key={t} className={`text-[8px] font-black px-1 py-0.5 rounded uppercase ${TYPE_STYLES[t] || 'bg-gray-500'}`}>{t.substring(0,3)}</span>)}
                                                                </div>
                                                                {renderHealthBar(char.hp, char.maxHp)}
                                                            </div>
                                                        </button>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </>
                                ) : (
                                    <button onClick={() => { setTargetingMoveIdx(null); setSelectedMultiTargets([]); }} className="mt-4 bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-lg font-bold w-full mx-auto block max-w-xs transition-colors shadow-md">
                                         Annulla Selezione
                                    </button>
                                )}
                            </div>
                        ) : (!isPlayingEvents && !isMyTurn) && (
                            <div className="text-2xl text-gray-500 animate-pulse font-bold flex items-center gap-3 mt-4">
                                 <Loader2 className="animate-spin" /> In attesa degli altri giocatori...
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    if (gameState.status === 'gameover') {
        if (gameState.isCampaignBattle) {
            const isWin = gameState.winner === gameState.players.p1;
            
            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                    <div className={`absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] ${isWin ? 'from-emerald-900/40' : 'from-rose-900/40'} via-slate-950 to-black pointer-events-none`}></div>
                    <div className="relative z-10 bg-slate-900/80 p-12 rounded-3xl border border-slate-700/50 shadow-2xl backdrop-blur-xl">
                        <h1 className={`text-7xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r ${isWin ? 'from-emerald-400 to-teal-500' : 'from-rose-500 to-red-600'}`}>{isWin ? 'VITTORIA!' : 'SCONFITTA!'}</h1>
                        
                        {isWin ? (
                            <>
                                <p className="text-xl text-slate-300 mb-4 font-medium">Hai sconfitto i burattini di Cell e spezzato il controllo mentale!</p>
                                <p className="text-2xl font-bold text-yellow-400 mb-8 flex items-center justify-center gap-2"><Coins size={28}/> +20 Monete Globali!</p>
                                <button onClick={() => {
                                    const newRosterStats = { ...campaignState.rosterStats };
                                    const faintedThisBattle = [];
                                    
                                    if (gameState.teams && gameState.teams.p1) {
                                        gameState.teams.p1.forEach(c => {
                                            if (!c.isSummonOnly) {
                                                newRosterStats[c.id] = c.hp;
                                                if (c.hp <= 0) {
                                                    faintedThisBattle.push(c.name);
                                                }
                                            }
                                        });
                                    }
                                    
                                    const mission = CAMPAIGN_DATA.sectors[campaignState.sectorIdx].missions[campaignState.missionIdx];
                                    const newRoster = [...campaignState.roster];
                                    let unlockedThisTime = [];

                                    if (mission.randomUnlockCount) {
                                        const available = (mission.unlock || []).filter(id => !newRoster.includes(id));
                                        if (available.length > 0) {
                                            // Sceglie a caso solo 1 personaggio dalla lista (es. o Max o Chloe)
                                            const pickedId = available[Math.floor(Math.random() * available.length)];
                                            newRoster.push(pickedId);
                                            newRosterStats[pickedId] = CHARACTERS.find(c=>c.id===pickedId).maxHp;
                                            unlockedThisTime.push(pickedId);
                                            updateLocalStats({ unlockChar: pickedId });
                                        }
                                    } else if (!mission.choiceUnlock) {
                                        (mission.unlock || []).forEach(id => {
                                            if (!newRoster.includes(id)) {
                                                newRoster.push(id);
                                                newRosterStats[id] = CHARACTERS.find(c=>c.id===id).maxHp;
                                                unlockedThisTime.push(id);
                                            }
                                            updateLocalStats({ unlockChar: id });
                                        });
                                    }

                                    // GESTIONE RIMOZIONE PERSONAGGI (Es. Zuko che se ne va)
                                    if (mission.removeChars) {
                                        mission.removeChars.forEach(rId => {
                                            const indexToRemove = newRoster.indexOf(rId);
                                            if (indexToRemove !== -1) {
                                                newRoster.splice(indexToRemove, 1);
                                                delete newRosterStats[rId];
                                            }
                                        });
                                    }

                                    setCampaignSelectedTeam([]); // FIX: Svuota la squadra per la prossima missione
                                    setCampaignState(prev => ({
                                        ...prev,
                                        rosterStats: newRosterStats,
                                        roster: newRoster,
                                        faintedInLastBattle: faintedThisBattle, 
                                        lastUnlocked: unlockedThisTime,
                                        currentBossState: null // Pulisce lo stato del boss alla vittoria!
                                    }));
                                    setCampaignDialogueIdx(0);
                                    setAppMode('campaign_post_dialogue');
                                }} className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 px-10 py-5 rounded-full font-black text-2xl transition-all shadow-[0_10px_30px_rgba(16,185,129,0.4)] hover:-translate-y-1">Continua e Vedi Epilogo</button>
                            </>
                        ) : (
                            <>
                                {/* --- NUOVI DIALOGHI PERSONALIZZATI PER LA SCONFITTA (GAME OVER) --- */}
                                {(() => {
                                    const defeatQuotes = {
                                        'finn': "Ahi... che botta. Ma gli eroi si rialzano sempre!",
                                        'kratos': "Sconfitti... ma non piegati. Torneremo, e ci prenderemo la nostra vendetta.",
                                        'topolino': "Oh, mamma mia! Ci hanno battuto... ma la magia non si spegne così facilmente!",
                                        'goku': "Urca, sono fortissimi! Dobbiamo allenarci di più e riprovarci!",
                                        'ladybug': "Miraculous o no, oggi abbiamo perso. Ritiriamoci e pensiamo a un nuovo piano.",
                                        'stewie': "Vittoria calcolata male. È palesemente colpa vostra. Ritirata immediata!",
                                        'chatnoir': "Sembra che abbiamo finito le nostre sette vite... per oggi.",
                                        'spongebob': "Sono pronto... a scappare a gambe levate! Torniamo al Checkpoint!",
                                        'marceline': "Odio ammetterlo, ma ci hanno fatto a pezzi. Ripieghiamo.",
                                        'bowser': "BWAHAHAH... ohi ahi... il Re dei Koopa ha solo bisogno di un pisolino strategico!",
                                        'zuko': "La caduta fa parte del viaggio per ritrovare l'onore. Dobbiamo solo rialzarci.",
                                        'wario': "Wah! Abbiamo perso! Spero di non aver smarrito nessuna moneta d'oro cadendo!",
                                        'default': "La tua squadra è caduta... ma la Resistenza si rialzerà più forte!"
                                    };
                                    
                                    // Sceglie a caso un personaggio dal Roster come "Capitano" della schermata di sconfitta
                                    const speakerId = campaignState.roster.length > 0 ? campaignState.roster[Math.floor(Math.random() * campaignState.roster.length)] : 'default';
                                    const char = CHARACTERS.find(c => c.id === speakerId);
                                    const quote = defeatQuotes[speakerId] || defeatQuotes['default'];
                                    
                                    return (
                                        <div className="bg-slate-950/50 p-6 rounded-2xl border border-rose-900/50 mb-8 flex flex-col items-center shadow-lg relative max-w-xl mx-auto">
                                            {char && <img src={char.img} className="w-20 h-20 rounded-full border-2 border-rose-500 mb-4 object-cover grayscale opacity-80" />}
                                            <p className="text-2xl text-rose-200 font-medium italic text-center leading-relaxed">"{quote}"</p>
                                            {char && <span className="text-rose-500 font-black tracking-widest uppercase text-xs mt-3">- {char.name} -</span>}
                                        </div>
                                    );
                                })()}

                                <button onClick={() => {
                                    const newRosterStats = { ...campaignState.rosterStats };
                                    if (gameState.teams && gameState.teams.p1) {
                                        gameState.teams.p1.forEach(c => {
                                            if (!c.isSummonOnly) newRosterStats[c.id] = c.hp;
                                        });
                                    }

                                    let currentEnemyState = null;
                                    if (gameState.teams && gameState.teams.p2) {
                                        const aliveEnemies = gameState.teams.p2.filter(c => c.hp > 0);
                                        if (aliveEnemies.length > 0) {
                                            currentEnemyState = aliveEnemies.map(c => ({
                                                id: c.id,
                                                hp: c.hp,
                                                maxHp: c.maxHp,
                                                atk: c.atk,
                                                def: c.def,
                                                spd: c.spd,
                                                statuses: c.statuses
                                            }));
                                        }
                                    }

                                    // Prevenzione Soft-lock se tutto il Roster è morto
                                    const aliveCount = campaignState.roster.filter(id => newRosterStats[id] > 0).length;
                                    if (aliveCount === 0) {
                                        campaignState.roster.forEach(id => {
                                            const baseChar = CHARACTERS.find(c=>c.id===id);
                                            newRosterStats[id] = Math.max(1, Math.floor((baseChar ? baseChar.maxHp : 100) * 0.3)); 
                                        });
                                    }

                                    setCampaignSelectedTeam([]); // FIX: Svuota la squadra in modo da poterne scegliere una nuova
                                    setCampaignState(p => ({...p, rosterStats: newRosterStats, currentBossState: currentEnemyState}));
                                    setAppMode('campaign_map');
                                }} className="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 px-10 py-5 rounded-full font-black text-2xl transition-all shadow-[0_10px_30px_rgba(225,29,72,0.4)] hover:-translate-y-1">Ritirata Strategica (Riprova)</button>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        let rewardText = "";
        let rankText = "";
        
        if (playerName.trim()) {
            let coins = 0;
            const myKey = Object.keys(gameState.players).find(k => gameState.players[k] === playerName);
            
            if (myKey) {
                if (gameState.gameMode === 'torneo') {
                    const tr = gameState.tournamentResults;
                    if (tr.final && tr.final.winner === myKey) { coins = 200; rankText = "1° Posto nel Torneo!"; }
                    else if (tr.final && tr.final.loser === myKey) { coins = 100; rankText = "2° Posto nel Torneo!"; }
                    else if (tr.bronze && tr.bronze.winner === myKey) { coins = 70; rankText = "3° Posto nel Torneo!"; }
                    else if (tr.bronze && tr.bronze.loser === myKey) { coins = 50; rankText = "4° Posto nel Torneo!"; }
                    else { coins = 50; }
                } else {
                    let won = false;
                    if (gameState.gameMode === 'multipla') {
                         if (gameState.winner && gameState.winner.includes(playerName)) won = true;
                    } else if (gameState.winner === playerName) {
                         won = true;
                    }
                    coins = won ? 100 : 50;
                    if (gameState.winner === 'Pareggio') coins = 50;
                }

                // CALCOLO BONUS TEAM SIZE
                const teamSizeBonus = Math.max(0, (gameState.settings.teamSize - 4) * 5);
                if (coins > 0) {
                    coins += teamSizeBonus;
                    if (teamSizeBonus > 0) {
                        rewardText = `+${coins} Monete ricevute! (+${teamSizeBonus} Bonus Squadra)`;
                    } else {
                        rewardText = `+${coins} Monete ricevute!`;
                    }
                }
            }
        }

        return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 text-center">
                <h1 className="text-7xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">FINE PARTITA</h1>
                <h2 className="text-4xl mb-2 font-bold">{gameState.winner === 'Pareggio' ? 'Pareggio Totale!' : `VITTORIA PER ${(gameState.winner || '').toUpperCase()}!`}</h2>
                {rankText && <h3 className="text-2xl font-bold text-emerald-400 mb-4">{rankText}</h3>}
                {rewardText && <p className="text-xl font-bold text-yellow-400 mb-12 flex items-center justify-center gap-2"><Coins size={24}/> {rewardText}</p>}
                <button onClick={leaveRoom} className="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-full font-bold text-xl flex items-center gap-2 shadow-[0_10px_30px_rgba(59,130,246,0.3)] transition-all hover:-translate-y-1">
                    <RotateCcw /> Torna al Menu Principale
                </button>
            </div>
        );
    }

    if (gameState.status === 'intermission') {
        const isHostOrLocal = appMode === 'local_room' || playerRole === 'p1';
        return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-900/20 via-slate-900 to-black pointer-events-none"></div>
                <div className="relative z-10">
                    <Trophy size={80} className="text-yellow-500 mb-6 mx-auto animate-bounce drop-shadow-[0_0_20px_rgba(234,179,8,0.6)]"/>
                    <h2 className="text-5xl md:text-6xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 drop-shadow-md">Scontro Concluso!</h2>
                    <p className="text-xl text-slate-300 mb-12 font-medium">Preparati per la prossima fase del torneo...</p>
                    
                    {isHostOrLocal ? (
                        <button onClick={handleNextTournamentMatch} className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 px-12 py-5 rounded-full font-black text-2xl transition-all shadow-[0_10px_30px_rgba(6,182,212,0.4)] hover:-translate-y-1">
                            Avvia Prossimo Incontro <ChevronRight className="inline" />
                        </button>
                    ) : (
                        <div className="text-2xl text-cyan-400 animate-pulse font-bold flex items-center justify-center gap-4 bg-slate-800/50 py-4 px-8 rounded-full border border-cyan-500/30">
                            <Loader2 className="animate-spin" size={32}/> In attesa dell'Host...
                        </div>
                    )}
                </div>
            </div>
        );
    }

    if (gameState.status === 'pre_battle') {
        const activeMatchPlayers = getActivePlayers();

        if (gameState.gameMode === 'battleroyale') {
            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center relative overflow-hidden p-6">
                    <div className="absolute inset-0 shadow-[inset_0_0_150px_rgba(0,0,0,0.9)] pointer-events-none z-30"></div>
                    <div className={`z-20 bg-black text-amber-400 px-8 py-4 rounded-full font-black text-4xl md:text-6xl italic border-4 border-amber-500 shadow-[0_0_50px_rgba(245,158,11,0.8)] [animation:pulse-vs_1s_infinite_ease-in-out] absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? 'scale-50 opacity-0 -translate-y-48' : 'scale-100 opacity-100'}`}>
                        TUTTI VS TUTTI
                    </div>

                    <div className="w-full max-w-7xl h-full flex flex-wrap justify-center items-center gap-4 z-10">
                        {activeMatchPlayers.map((p, index) => {
                            const pName = gameState.players[p];
                            const pAvatar = gameState.playerAvatars[p] || getDefaultAvatar(pName);
                            const pTeam = gameState.teams[p] || [];
                            const theme = PLAYER_THEMES[p] || PLAYER_THEMES.p1;
                            
                            return (
                                <div key={p} className={`flex flex-col items-center justify-center p-4 rounded-3xl ${theme.bg} border border-slate-700/50 backdrop-blur-md transition-all duration-700 transform ${introCharIdx >= 1 ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}`} style={{ width: `calc(${100 / Math.ceil(activeMatchPlayers.length / 2)}% - 1rem)`, minWidth: '250px' }}>
                                    <img src={pAvatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(pName); }} className={`w-16 h-16 md:w-24 md:h-24 rounded-full border-4 ${theme.border} object-cover ${theme.shadow} mb-4 bg-slate-900`} alt={pName} />
                                    <h2 className={`text-xl font-black ${theme.text} text-center drop-shadow-md mb-4 uppercase tracking-widest`}>{pName}</h2>
                                    
                                    <div className="flex justify-center flex-wrap gap-2">
                                        {pTeam.filter(c => !c.isSummonOnly).map((char, i) => (
                                            <div key={i} className={`flex flex-col items-center transition-all duration-500 ease-out transform ${introCharIdx >= 2 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-50 translate-y-4'}`}>
                                                <img src={char.img} className={`w-10 h-10 md:w-14 md:h-14 rounded-full border-2 ${theme.border} object-cover shadow-lg mb-1`} alt={char.name}/>
                                                <span className={`text-[8px] md:text-[10px] font-bold text-white truncate w-14 text-center drop-shadow-md bg-black/60 px-1 py-0.5 rounded`}>{char.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        if (gameState.gameMode === 'multipla') {
            const p1Name = gameState.players.p1 || "Giocatore 1";
            const p2Name = gameState.players.p2 || "Giocatore 2";
            const p3Name = gameState.players.p3 || "Giocatore 3";
            const p4Name = gameState.players.p4 || "Giocatore 4";
            
            const p1Avatar = gameState.playerAvatars.p1 || getDefaultAvatar(p1Name);
            const p2Avatar = gameState.playerAvatars.p2 || getDefaultAvatar(p2Name);
            const p3Avatar = gameState.playerAvatars.p3 || getDefaultAvatar(p3Name);
            const p4Avatar = gameState.playerAvatars.p4 || getDefaultAvatar(p4Name);
            
            const p1Team = gameState.teams.p1 || [];
            const p2Team = gameState.teams.p2 || [];
            const p3Team = gameState.teams.p3 || [];
            const p4Team = gameState.teams.p4 || [];

            return (
                <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center relative overflow-hidden">
                    {/* Metà sinistra (Blu) - Team 1 */}
                    <div className="w-1/2 h-full absolute left-0 bg-gradient-to-br from-blue-900 to-slate-950 flex flex-col items-center justify-center p-8 [animation:slide-in-left_0.5s_ease-out]">
                        <div className={`flex flex-col items-center transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? '-translate-y-16 md:-translate-y-32 scale-75' : 'translate-y-0 scale-100'}`}>
                            <div className="flex gap-4 mb-4 z-10 relative">
                                <div className="relative">
                                    <img src={p1Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p1Name); }} className="w-20 h-20 md:w-32 md:h-32 rounded-full border-4 border-cyan-400 object-cover shadow-[0_0_50px_rgba(34,211,238,0.5)] bg-slate-900" alt="P1" />
                                </div>
                                <div className="relative">
                                    <img src={p2Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p2Name); }} className="w-20 h-20 md:w-32 md:h-32 rounded-full border-4 border-cyan-400 object-cover shadow-[0_0_50px_rgba(34,211,238,0.5)] bg-slate-900" alt="P2" />
                                </div>
                            </div>
                            <h2 className="text-xl md:text-4xl font-black text-white text-center drop-shadow-xl">{p1Name} & {p2Name}</h2>
                        </div>

                        {/* Squadre Sinistra */}
                        <div className="absolute top-[60%] left-0 w-full px-2 md:px-8 flex justify-center flex-wrap gap-2 md:gap-4 -translate-y-1/2">
                            {[...p1Team.filter(c => !c.isSummonOnly), ...p2Team.filter(c => !c.isSummonOnly)].map((char, i) => (
                                <div key={i} className={`flex flex-col items-center transition-all duration-500 ease-out transform ${introCharIdx >= Math.floor(i/2) + 3 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-50 translate-y-10'}`}>
                                    <img src={char.img} className="w-10 h-10 md:w-20 md:h-20 rounded-full border-2 md:border-4 border-cyan-300 object-cover shadow-[0_0_20px_rgba(34,211,238,0.4)] mb-1" alt={char.name}/>
                                    <span className="text-[7px] md:text-xs font-bold text-cyan-100 truncate w-16 md:w-24 text-center drop-shadow-md bg-slate-900/50 px-1 py-0.5 rounded-full">{char.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* Metà destra (Rossa) - Team 2 */}
                    <div className="w-1/2 h-full absolute right-0 bg-gradient-to-bl from-rose-900 to-slate-950 flex flex-col items-center justify-center p-8 [animation:slide-in-right_0.5s_ease-out]">
                        <div className={`flex flex-col items-center transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? '-translate-y-16 md:-translate-y-32 scale-75' : 'translate-y-0 scale-100'}`}>
                            <div className="flex gap-4 mb-4 z-10 relative">
                                <div className="relative">
                                    <img src={p3Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p3Name); }} className="w-20 h-20 md:w-32 md:h-32 rounded-full border-4 border-rose-400 object-cover shadow-[0_0_50px_rgba(244,63,94,0.5)] bg-slate-900" alt="P3" />
                                </div>
                                <div className="relative">
                                    <img src={p4Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p4Name); }} className="w-20 h-20 md:w-32 md:h-32 rounded-full border-4 border-rose-400 object-cover shadow-[0_0_50px_rgba(244,63,94,0.5)] bg-slate-900" alt="P4" />
                                </div>
                            </div>
                            <h2 className="text-xl md:text-4xl font-black text-white text-center drop-shadow-xl">{p3Name} & {p4Name}</h2>
                        </div>

                        {/* Squadre Destra */}
                        <div className="absolute top-[60%] left-0 w-full px-2 md:px-8 flex justify-center flex-wrap gap-2 md:gap-4 -translate-y-1/2">
                            {[...p3Team.filter(c => !c.isSummonOnly), ...p4Team.filter(c => !c.isSummonOnly)].map((char, i) => (
                                <div key={i} className={`flex flex-col items-center transition-all duration-500 ease-out transform ${introCharIdx >= Math.floor(i/2) + 3 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-50 translate-y-10'}`}>
                                    <img src={char.img} className="w-10 h-10 md:w-20 md:h-20 rounded-full border-2 md:border-4 border-rose-300 object-cover shadow-[0_0_20px_rgba(244,63,94,0.4)] mb-1" alt={char.name}/>
                                    <span className="text-[7px] md:text-xs font-bold text-rose-100 truncate w-16 md:w-24 text-center drop-shadow-md bg-slate-900/50 px-1 py-0.5 rounded-full">{char.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div className={`absolute top-0 bottom-0 left-1/2 w-2 bg-gradient-to-b from-transparent via-white to-transparent -translate-x-1/2 transform skew-x-[-15deg] z-10 transition-opacity duration-1000 ${introCharIdx >= 2 ? 'opacity-20' : 'opacity-100'}`}></div>
                    
                    <div className={`z-20 bg-black text-white px-6 py-3 md:px-8 md:py-4 rounded-full font-black text-4xl md:text-8xl italic border-4 border-yellow-500 shadow-[0_0_50px_rgba(234,179,8,0.8)] [animation:pulse-vs_1s_infinite_ease-in-out] transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? 'scale-50 opacity-0 -translate-y-48' : 'scale-100 opacity-100 translate-y-0'}`}>
                        VS
                    </div>

                    <div className="absolute inset-0 shadow-[inset_0_0_150px_rgba(0,0,0,0.9)] pointer-events-none z-30"></div>
                </div>
            );
        }

        const p1Name = gameState.players[activeMatchPlayers[0]] || "Giocatore 1";
        const p2Name = gameState.players[activeMatchPlayers[1]] || "Giocatore 2";
        const p1Avatar = gameState.playerAvatars[activeMatchPlayers[0]] || getDefaultAvatar(p1Name);
        const p2Avatar = gameState.playerAvatars[activeMatchPlayers[1]] || getDefaultAvatar(p2Name);
        
        const p1Team = gameState.teams[activeMatchPlayers[0]] || [];
        const p2Team = gameState.teams[activeMatchPlayers[1]] || [];

        return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center relative overflow-hidden">
                {/* Metà sinistra (Blu) */}
                <div className="w-1/2 h-full absolute left-0 bg-gradient-to-br from-blue-900 to-slate-950 flex flex-col items-center justify-center p-8 [animation:slide-in-left_0.5s_ease-out]">
                    <div className={`flex flex-col items-center transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? '-translate-y-16 md:-translate-y-32 scale-75' : 'translate-y-0 scale-100'}`}>
                        <div className="relative">
                            <img src={p1Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p1Name); }} className="w-32 h-32 md:w-48 md:h-48 rounded-full border-4 border-cyan-400 object-cover shadow-[0_0_50px_rgba(34,211,238,0.5)] mb-6 z-10 relative bg-slate-900" alt="P1" />
                            <div className="absolute inset-0 rounded-full border-4 border-cyan-400 blur-md opacity-50"></div>
                        </div>
                        <h2 className="text-3xl md:text-5xl font-black text-white text-center drop-shadow-xl">{p1Name}</h2>
                    </div>

                    {/* Squadra Sinistra */}
                    <div className="absolute top-[60%] left-0 w-full px-4 md:px-8 flex justify-center flex-wrap gap-4 md:gap-6 -translate-y-1/2">
                        {p1Team.filter(c => !c.isSummonOnly).map((char, i) => (
                            <div key={i} className={`flex flex-col items-center transition-all duration-500 ease-out transform ${introCharIdx >= i + 3 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-50 translate-y-10'}`}>
                                <img src={char.img} className="w-16 h-16 md:w-24 md:h-24 rounded-full border-2 md:border-4 border-cyan-300 object-cover shadow-[0_0_20px_rgba(34,211,238,0.4)] mb-2" alt={char.name}/>
                                <span className="text-[10px] md:text-sm font-bold text-cyan-100 truncate w-24 text-center drop-shadow-md bg-slate-900/50 px-2 py-0.5 rounded-full">{char.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
                
                {/* Metà destra (Rossa) */}
                <div className="w-1/2 h-full absolute right-0 bg-gradient-to-bl from-rose-900 to-slate-950 flex flex-col items-center justify-center p-8 [animation:slide-in-right_0.5s_ease-out]">
                    <div className={`flex flex-col items-center transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? '-translate-y-16 md:-translate-y-32 scale-75' : 'translate-y-0 scale-100'}`}>
                        <div className="relative">
                            <img src={p2Avatar} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(p2Name); }} className="w-32 h-32 md:w-48 md:h-48 rounded-full border-4 border-rose-400 object-cover shadow-[0_0_50px_rgba(244,63,94,0.5)] mb-6 z-10 relative bg-slate-900" alt="P2" />
                            <div className="absolute inset-0 rounded-full border-4 border-rose-400 blur-md opacity-50"></div>
                        </div>
                        <h2 className="text-3xl md:text-5xl font-black text-white text-center drop-shadow-xl">{p2Name}</h2>
                    </div>

                    {/* Squadra Destra */}
                    <div className="absolute top-[60%] left-0 w-full px-4 md:px-8 flex justify-center flex-wrap gap-4 md:gap-6 -translate-y-1/2">
                        {p2Team.filter(c => !c.isSummonOnly).map((char, i) => (
                            <div key={i} className={`flex flex-col items-center transition-all duration-500 ease-out transform ${introCharIdx >= i + 3 ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-50 translate-y-10'}`}>
                                <img src={char.img} className="w-16 h-16 md:w-24 md:h-24 rounded-full border-2 md:border-4 border-rose-300 object-cover shadow-[0_0_20px_rgba(244,63,94,0.4)] mb-2" alt={char.name}/>
                                <span className="text-[10px] md:text-sm font-bold text-rose-100 truncate w-24 text-center drop-shadow-md bg-slate-900/50 px-2 py-0.5 rounded-full">{char.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
                
                {/* Striscia di divisione e VS */}
                <div className={`absolute top-0 bottom-0 left-1/2 w-2 bg-gradient-to-b from-transparent via-white to-transparent -translate-x-1/2 transform skew-x-[-15deg] z-10 transition-opacity duration-1000 ${introCharIdx >= 2 ? 'opacity-20' : 'opacity-100'}`}></div>
                
                <div className={`z-20 bg-black text-white px-8 py-4 rounded-full font-black text-6xl md:text-8xl italic border-4 border-yellow-500 shadow-[0_0_50px_rgba(234,179,8,0.8)] [animation:pulse-vs_1s_infinite_ease-in-out] transition-all duration-700 ease-in-out ${introCharIdx >= 2 ? 'scale-50 opacity-0 -translate-y-48' : 'scale-100 opacity-100 translate-y-0'}`}>
                    VS
                </div>

                {/* Filtro scurito sui bordi per atmosfera cinematica */}
                <div className="absolute inset-0 shadow-[inset_0_0_150px_rgba(0,0,0,0.9)] pointer-events-none z-30"></div>
            </div>
        );
    }

        return null;
    }; // Fine renderView

    return (
        <>
            {showLeaveConfirm && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-rose-500/50 p-6 rounded-3xl max-w-sm w-full text-center shadow-[0_0_50px_rgba(244,63,94,0.2)] relative overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-500 to-red-600"></div>
                        <h3 className="text-2xl font-black text-rose-500 mb-2 flex items-center justify-center gap-2">Vuoi Abbandonare?</h3>
                        <p className="text-slate-300 mb-6 font-medium text-sm">Sei sicuro di voler uscire? Se la partita è in corso online, equivarrà a una resa istantanea per il tuo team.</p>
                        <div className="flex gap-3">
                            <button onClick={() => setShowLeaveConfirm(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all border border-slate-600">Annulla</button>
                            <button onClick={handleConfirmLeave} className="flex-1 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Conferma</button>
                        </div>
                    </div>
                </div>
            )}
            {systemAlert && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-amber-500/50 p-6 rounded-3xl max-w-sm w-full text-center shadow-[0_0_50px_rgba(245,158,11,0.2)] relative overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                        <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center justify-center gap-2">⚠️ Avviso</h3>
                        <p className="text-slate-300 mb-8 font-medium">{systemAlert}</p>
                        <button onClick={() => setSystemAlert(null)} className="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3 px-6 rounded-xl w-full transition-all shadow-lg hover:-translate-y-0.5">
                            Ho capito!
                        </button>
                    </div>
                </div>
            )}
            
            {/* MODALE GIOCATORI ONLINE */}
            {showOnlinePlayers && (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-cyan-500/50 rounded-3xl max-w-md w-full shadow-[0_0_50px_rgba(6,182,212,0.3)] relative overflow-hidden flex flex-col max-h-[80vh]">
                        <div className="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
                            <h3 className="text-xl font-black text-cyan-400 flex items-center gap-2"><Users size={24}/> Giocatori Online</h3>
                            <button onClick={() => setShowOnlinePlayers(false)} className="text-slate-500 hover:text-white transition-colors"><XIcon size={24}/></button>
                        </div>
                        <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3">
                            {onlineUsers.length === 0 ? (
                                <p className="text-slate-500 text-center italic py-8 font-medium">Nessun altro giocatore online al momento.</p>
                            ) : onlineUsers.map(u => (
                                <div key={u.sessionId} className="bg-slate-800/80 border border-slate-700 p-3 rounded-xl flex items-center gap-3 shadow-md">
                                    <img src={u.avatar || getDefaultAvatar(u.name)} onError={(e) => { e.target.onerror = null; e.target.src = getDefaultAvatar(u.name); }} className="w-12 h-12 rounded-full border-2 border-slate-600 bg-slate-900 object-cover" />
                                    <div className="flex-1 min-w-0">
                                        <div className="font-bold text-white truncate text-base mb-0.5">{u.name}</div>
                                        <div className={`text-[10px] font-bold uppercase tracking-widest ${u.status === 'In Partita' ? 'text-amber-400' : 'text-emerald-400'}`}>{u.status}</div>
                                    </div>
                                    {u.roomId && (
                                        <button onClick={() => handleObserve(u.roomId)} className="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg transition-all hover:-translate-y-0.5">
                                            <Eye size={16}/> Osserva
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
            
            {renderView()}
        </>
    );
}
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
